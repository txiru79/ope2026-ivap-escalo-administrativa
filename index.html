<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Cuerpo Administrativo - IVAP</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b2430">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --ink:#1b2430; --paper:#f7f5f0; --card:#ffffff; --line:#dcd6c8;
    --green:#2f5d4f; --green-dark:#1f3f36; --red:#8a2b2b; --gold:#a3742b; --muted:#6b6459;
    --shadow: 0 1px 2px rgba(27,36,48,.06), 0 6px 20px rgba(27,36,48,.06);
  }
  body.dark{
    --ink:#eae5da; --paper:#171b1f; --card:#20262c; --line:#3d464c;
    --green:#5fae95; --green-dark:#8fd3bd; --red:#e08787; --gold:#d9ac5f; --muted:#a9ada6;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
  }
  html.fs-sm{font-size:15px;}
  html.fs-md{font-size:16px;}
  html.fs-lg{font-size:18.5px;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s;}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px;}
  header.app{display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:22px;gap:10px;}
  header.app h1{font-size:1.3rem;letter-spacing:.02em;margin:0;font-weight:700;}
  header.app .tag{font-family:ui-monospace,Menlo,monospace;font-size:.72rem;color:var(--muted);letter-spacing:.06em;white-space:nowrap;}
  .headerRight{display:flex;align-items:center;gap:10px;}
  .iconBtn{border:1px solid var(--line);background:var(--card);border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:.95rem;line-height:1;color:var(--ink);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);padding:22px;margin-bottom:18px;}
  h2.section{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--gold);margin:0 0 14px;font-family:ui-monospace,Menlo,monospace;border-bottom:1px solid var(--line);padding-bottom:8px;}
  .btn{font-family:ui-monospace,Menlo,monospace;font-size:.85rem;letter-spacing:.03em;border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:2px;cursor:pointer;}
  .btn.secondary{background:transparent;color:var(--ink);}
  .btn.wide{width:100%;}
  .btn:disabled{opacity:.4;cursor:default;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .num-input,select.field{width:100px;padding:9px;font-family:ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:2px;font-size:.9rem;background:var(--card);color:var(--ink);}
  input[type="text"].field{width:100%;padding:12px;border:1px solid var(--line);border-radius:2px;font-size:1rem;background:var(--card);color:var(--ink);box-sizing:border-box;}
  select.field{width:auto;}
  .tema-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:.86rem;max-height:300px;overflow-y:auto;padding-right:4px;}
  @media (max-width:560px){.tema-grid{grid-template-columns:1fr;}}
  .tema-item{display:flex;align-items:flex-start;gap:8px;line-height:1.3;padding:4px 0;border-bottom:1px dashed var(--line);}
  .tema-item input{margin-top:4px;flex-shrink:0;}
  .tema-actions{display:flex;gap:14px;margin:10px 0 14px;font-size:.8rem;}
  .tema-actions a,.link-btn{color:var(--green);cursor:pointer;text-decoration:underline;background:none;border:none;font-size:.85rem;padding:0;font-family:inherit;}
  .progress-bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px;}
  .progress-fill{height:100%;background:var(--green);transition:width .25s ease;}
  .qmeta{font-family:ui-monospace,Menlo,monospace;font-size:.72rem;color:var(--muted);letter-spacing:.05em;margin-bottom:10px;text-transform:uppercase;display:flex;justify-content:space-between;}
  .qtext{font-size:1.12rem;line-height:1.5;margin:0 0 20px;}
  .option{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:3px;padding:13px 14px;margin-bottom:10px;cursor:pointer;font-size:.98rem;line-height:1.4;background:var(--card);transition:border-color .15s,background .15s;}
  .option:hover{border-color:var(--green);}
  .option .letter{font-family:ui-monospace,Menlo,monospace;font-weight:700;color:var(--gold);flex-shrink:0;}
  .option.correct{border-color:var(--green);background:rgba(47,93,79,.12);}
  .option.correct .letter{color:var(--green);}
  .option.wrong{border-color:var(--red);background:rgba(138,43,43,.12);}
  .option.wrong .letter{color:var(--red);}
  .option.disabled{cursor:default;}
  .option.selected{border-color:var(--gold);background:rgba(163,116,43,.12);}
  .flagBtn{border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:.72rem;padding:3px 8px;border-radius:10px;cursor:pointer;font-family:ui-monospace,Menlo,monospace;white-space:nowrap;}
  .flagBtn.active{border-color:var(--gold);color:var(--gold);background:rgba(163,116,43,.12);}
  .feedback{margin-top:6px;padding:12px 14px;border-radius:3px;font-size:.88rem;line-height:1.5;}
  .feedback.ok{background:rgba(47,93,79,.12);border:1px solid var(--green);color:var(--green-dark);}
  .feedback.no{background:rgba(138,43,43,.12);border:1px solid var(--red);color:var(--red);}
  .footer-nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px;}
  .score-big{font-size:2.6rem;font-weight:700;font-family:ui-monospace,Menlo,monospace;}
  .tema-result{display:flex;justify-content:space-between;font-size:.85rem;padding:7px 0;border-bottom:1px dashed var(--line);}
  .badge{font-family:ui-monospace,Menlo,monospace;font-size:.72rem;padding:2px 7px;border-radius:10px;background:var(--line);color:var(--ink);}
  textarea{width:100%;min-height:140px;font-family:ui-monospace,Menlo,monospace;font-size:.82rem;border:1px solid var(--line);border-radius:3px;padding:10px;background:var(--card);color:var(--ink);}
  .small{font-size:.82rem;color:var(--muted);line-height:1.5;}
  .flag{display:inline-block;width:14px;height:14px;border-radius:50%;background:conic-gradient(from 0deg,#d52b1e 0 25%,#eab308 25% 40%,#2f5d4f 40% 100%);margin-right:8px;vertical-align:-2px;}
  .radioRow{display:flex;gap:16px;font-size:.88rem;margin:6px 0;flex-wrap:wrap;}
  .radioRow label{display:flex;gap:6px;align-items:center;cursor:pointer;}
  .statBar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;flex:1;margin:0 10px;}
  .statBar > div{height:100%;background:var(--green);}
  .statRow{display:flex;align-items:center;font-size:.82rem;padding:8px 0;border-bottom:1px dashed var(--line);}
  .statRow .name{width:160px;flex-shrink:0;}
  .statRow .pct{width:44px;text-align:right;font-family:ui-monospace,Menlo,monospace;flex-shrink:0;}
  .timerBox{font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:.95rem;padding:4px 10px;border:1px solid var(--line);border-radius:3px;}
  .timerBox.low{color:var(--red);border-color:var(--red);}

  /* Splash screen */
  .splash{
    position:fixed; inset:0; z-index:50;
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    background: radial-gradient(ellipse at 50% 30%, rgba(163,116,43,.10), transparent 60%), var(--paper);
    cursor:pointer; text-align:center; padding:24px;
  }
  .splash-flag{width:34px;height:34px;border-radius:50%;background:conic-gradient(from 0deg,#d52b1e 0 25%,#eab308 25% 40%,#2f5d4f 40% 100%);margin-bottom:26px;box-shadow:0 4px 18px rgba(0,0,0,.15);}
  .splash-logo{max-width:min(420px,80vw);width:100%;height:auto;margin-bottom:30px;}
  .splash-title{
    font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;
    font-weight:700; letter-spacing:.02em; color:var(--ink);
    font-size:clamp(2.4rem, 9vw, 4.2rem); line-height:1.05; margin:0;
  }
  .splash-subtitle{
    font-family: ui-monospace, Menlo, monospace;
    text-transform:uppercase; letter-spacing:.22em; color:var(--gold);
    font-size:clamp(.9rem, 3vw, 1.15rem); margin:18px 0 0;
  }
  .splash-rule{width:64px;height:2px;background:var(--ink);margin:26px 0;opacity:.5;}
  .splash-hint{font-family:ui-monospace,Menlo,monospace;font-size:.72rem;color:var(--muted);letter-spacing:.08em;margin-top:40px;animation:splashPulse 2s ease-in-out infinite;}
  @keyframes splashPulse{0%,100%{opacity:.4;}50%{opacity:1;}}
  .splash-credit{
    position:fixed; bottom:22px; right:26px; z-index:51;
    font-family:ui-monospace,Menlo,monospace; letter-spacing:.05em;
    font-size:.8rem; color:var(--ink); opacity:.75;
    padding:6px 12px; border:1px solid var(--line); border-radius:3px; background:var(--card);
  }
</style>
</head>

[30, "La producción de un acto administrativo debe ajustarse, entre otros requisitos, al procedimiento:", ["Determinado únicamente por la costumbre local", "Que discrecionalmente decida el órgano competente", "Fijado por el interesado", "Legalmente establecido"], 3],
[30, "Un acto administrativo dictado por órgano manifiestamente incompetente por razón de la materia o del territorio es:", ["Inexistente sin consecuencias jurídicas", "Plenamente válido y eficaz", "Nulo de pleno derecho", "Simplemente anulable"], 2],
[31, "La falta de recusación de una autoridad afectada por una causa legal no impide:", ["Que el procedimiento se archive automáticamente", "La validez del acto en todo caso sin control", "Que los interesados puedan promoverla en cualquier momento de la tramitación", "La imposibilidad de recurrir la resolución"], 2],
[31, "El principio de proporcionalidad en el procedimiento administrativo sancionador exige que la sanción sea:", ["Determinada de forma arbitraria", "Adecuada a la gravedad del hecho constitutivo de la infracción", "Siempre la máxima prevista legalmente", "Idéntica para todas las infracciones sin distinción"], 1],
[32, "La aportación de documentos por los interesados durante la instrucción debe realizarse:", ["Antes del trámite de audiencia, salvo excepciones", "Solo tras dictarse la resolución definitiva", "Exclusivamente en la fase de iniciación sin posibilidad posterior", "Nunca, pues corresponde solo a la Administración"], 0],
[32, "La caducidad del procedimiento iniciado de oficio susceptible de producir efectos desfavorables se produce por:", ["La ausencia de pruebas practicadas", "El transcurso del plazo máximo sin haberse dictado resolución expresa", "La solicitud expresa del interesado", "La presentación de un recurso por el interesado"], 1],
[33, "La anulación de un acto en vía de recurso puede conllevar, en su caso:", ["La responsabilidad penal automática del funcionario", "La retroacción de actuaciones al momento en que se produjo el defecto", "La nulidad de todo el ordenamiento jurídico aplicable", "La suspensión automática de cualquier otro procedimiento"], 1],
[34, "La indemnización por responsabilidad patrimonial se calcula, entre otros criterios, con arreglo a:", ["La exclusiva capacidad económica de la Administración", "La libre voluntad del reclamante sin ningún criterio objetivo", "Los criterios de valoración establecidos en la legislación fiscal, de expropiación forzosa y demás normas aplicables", "Un importe fijo idéntico en todos los casos"], 2],
[15, "La aplicación presupuestaria es la unidad que identifica en el presupuesto de gastos:", ["La fecha de aprobación del presupuesto", "El nombre del funcionario responsable del gasto", "Solo el importe total del presupuesto", "La clasificación orgánica, funcional y económica del crédito"], 3, "La aplicación presupuestaria combina tres clasificaciones (quién gasta, para qué y en qué concepto) y es la unidad mínima de vinculación del crédito."],
[15, "La fase de autorización del gasto (fase A) supone:", ["El acto por el que se aprueba la realización de un gasto por una cuantía determinada", "El pago material al acreedor", "El reconocimiento de la obligación frente a un tercero", "La recaudación del ingreso correspondiente"], 0, "La autorización (A) es la primera fase: reserva el crédito pero todavía no vincula a la Administración con un tercero concreto."],
[15, "La fase de disposición o compromiso del gasto (fase D) implica:", ["Un acto por el que se acuerda la realización de gastos previamente autorizados, vinculando a la Administración con un tercero", "La devolución de un ingreso indebido", "La simple previsión inicial del crédito", "El cobro efectivo de un derecho"], 0, "La disposición (D) vincula ya jurídicamente a la Administración con el tercero, tras la autorización previa."],
[15, "El reconocimiento de la obligación (fase O) se produce cuando:", ["Se ordena el pago al acreedor", "Se recibe una factura sin verificar", "Se declara la existencia de un crédito exigible contra la Administración derivado de un gasto autorizado y comprometido", "Se aprueba el presupuesto anual"], 2, "El reconocimiento de la obligación (O) exige que se haya realizado la prestación o el derecho del acreedor, tras las fases A y D."],
[15, "La ordenación del pago (fase P) consiste en:", ["Comprometer el crédito presupuestario", "Fiscalizar el expediente de gasto", "Expedir la orden de pago contra la Tesorería a favor de los acreedores", "Aprobar el gasto inicialmente"], 2, "La ordenación del pago (P) es la última fase del ciclo ADOP: autorización, disposición, obligación y pago."],
[15, "Los créditos de compromiso son créditos que:", ["Se destinan exclusivamente a gastos de personal", "No requieren autorización previa", "Solo pueden emplearse dentro del ejercicio en curso", "Permiten adquirir compromisos de gasto que se extenderán a ejercicios futuros"], 3, "Se usan para gastos plurianuales, como obras o contratos de varios años, comprometiendo presupuesto de ejercicios futuros."],
[15, "Los pagos a justificar son aquellos que:", ["Solo se destinan a gastos de inversión", "Se libran sin la previa aportación de documentos justificativos, quedando obligado el perceptor a justificarlos posteriormente", "Nunca requieren justificación posterior", "Se realizan siempre tras la fiscalización completa del gasto"], 1, "Son una excepción al procedimiento ordinario para gastos urgentes o de difícil justificación previa, con obligación de rendir cuentas después."],
[15, "Los anticipos de caja fija (fondos anticipados) se destinan a:", ["Atender gastos periódicos o repetitivos de carácter menor", "Financiar inversiones de gran cuantía", "Sustituir la totalidad del presupuesto de gastos", "Pagar exclusivamente subvenciones"], 0, "Son provisiones de fondos para gastos corrientes de escasa cuantía y repetitivos (material de oficina, pequeñas reparaciones, etc.)."],
[15, "La vinculación jurídica de los créditos determina:", ["El nivel en que los créditos presupuestarios tienen carácter limitativo y vinculante", "El importe exacto de cada factura", "La fecha límite de gasto en el ejercicio", "El responsable político del gasto"], 0, "Determina hasta qué nivel de desagregación (capítulo, artículo, concepto...) el crédito no puede superarse sin modificación presupuestaria."],
[15, "La referencia de intervención en un expediente de gasto hace alusión a:", ["El número de expediente judicial asociado", "El código de la partida de ingresos", "La firma del responsable del área usuaria", "La identificación del acto de control o fiscalización realizado por el órgano interventor"], 3, "Es la marca que deja el órgano de control interno (Intervención) al fiscalizar el expediente antes de continuar su tramitación."],
[15, "Los residuos de gastos hacen referencia a:", ["Créditos ampliables sin límite", "Gastos anulados definitivamente sin posibilidad de reclamación", "Obligaciones reconocidas y no pagadas o gastos comprometidos no realizados que se incorporan al ejercicio siguiente", "Ingresos pendientes de cobro"], 2, "Permiten que gastos ya autorizados/comprometidos en un ejercicio, pero no completados, continúen tramitándose en el siguiente."],
[15, "La ejecución del presupuesto de gastos sigue, con carácter general, la secuencia de fases:", ["Ordenación, disposición, autorización y reconocimiento", "Autorización, disposición, reconocimiento de la obligación y ordenación del pago", "Recaudación, liquidación, ingreso y compromiso", "Solo la fase de pago, sin trámites previos"], 1, "Es el conocido ciclo ADOP: A-D-O-P, en ese orden estricto."],
[16, "Los derechos reconocidos, en el presupuesto de ingresos, son:", ["Los créditos a favor de la Administración una vez practicada la liquidación del ingreso correspondiente", "Los créditos vencidos y prescritos", "Solo los ingresos ya recaudados en efectivo", "Los ingresos previstos en el anteproyecto de presupuesto"], 0, "Es el equivalente, en ingresos, a la fase de 'obligación reconocida' en gastos: existe ya un derecho de cobro liquidado."],
[16, "Las fases de ejecución del presupuesto de ingresos incluyen, entre otras:", ["El reconocimiento del derecho y la recaudación", "Únicamente la fase de ordenación del pago", "La fiscalización previa exclusivamente", "Únicamente la fase de disposición"], 0, "El ciclo de ingresos es más simple que el de gastos: liquidación/reconocimiento del derecho y recaudación."],
[16, "La devolución de ingresos indebidos procede cuando:", ["El contribuyente lo solicita sin ninguna justificación", "Se ha producido un ingreso en la Tesorería que no correspondía o excedía de lo debido", "Se supera el presupuesto anual de gastos", "El ejercicio presupuestario ha finalizado"], 1, "Corrige un ingreso erróneo o excesivo, devolviendo al interesado la cantidad indebidamente percibida por la Administración."],
[16, "Los derechos reconocidos pendientes de cobro son aquellos que:", ["Ya han sido cobrados y contabilizados como ingreso definitivo", "Corresponden a gastos ya pagados", "Han sido liquidados pero aún no se ha producido su recaudación efectiva", "Nunca podrán ser exigidos"], 2, "Representan la diferencia entre lo ya liquidado (derecho reconocido) y lo efectivamente cobrado (recaudación)."],
[16, "Los ingresos públicos se clasifican, entre otros criterios, en:", ["Solo ingresos por multas", "Solo ingresos tributarios", "Solo transferencias del Estado", "Ingresos tributarios, patrimoniales y por operaciones financieras, entre otros"], 3, "La clasificación económica de ingresos incluye varios capítulos: impuestos, tasas, transferencias, ingresos patrimoniales, operaciones financieras, etc."],
[16, "Los documentos contables de ingresos permiten, entre otras funciones:", ["Reflejar el reconocimiento del derecho y la recaudación del ingreso", "Sustituir el presupuesto de gastos", "Aprobar el gasto público", "Fiscalizar la nómina del personal"], 0, "Son el soporte documental que registra contablemente cada fase de la ejecución del ingreso."],
[16, "La recaudación en período voluntario de un ingreso público se caracteriza por:", ["Realizarse dentro del plazo señalado sin recargos ni intereses de demora", "Ser posterior al período ejecutivo", "Aplicar siempre recargo de apremio", "No requerir liquidación previa"], 0, "Es la recaudación normal dentro de plazo; si no se paga, se pasa a período ejecutivo con recargos."],
[16, "El presupuesto de ingresos de una Administración recoge:", ["La previsión de los recursos económicos que se estima obtener durante el ejercicio", "Únicamente los gastos de personal", "El balance de situación patrimonial", "La ejecución final del gasto del año anterior"], 0, "Es la contrapartida del presupuesto de gastos: estimación de recursos que financiarán el gasto previsto."],
[17, "La relación de puestos de trabajo (RPT) es el instrumento que:", ["Fija únicamente el horario laboral", "Regula exclusivamente el régimen disciplinario", "Sustituye a la ley de presupuestos", "Ordena el conjunto de puestos de trabajo de la Administración, definiendo sus características esenciales"], 3, "La RPT es el instrumento técnico básico de organización del personal: define denominación, cuerpo, nivel, forma de provisión, etc. de cada puesto."],
[17, "La clasificación en Cuerpos y Escalas de la Administración de la Comunidad Autónoma de Euskadi se rige por:", ["El Estatuto de los Trabajadores exclusivamente", "La Ley de Cuerpos y Escalas de la Administración de la Comunidad Autónoma de Euskadi", "El Código Civil", "La normativa de contratos del sector público"], 1, "Es la norma específica vasca que estructura los cuerpos y escalas de la función pública autonómica."],
[17, "La relación de puestos de trabajo debe contener, entre otros datos:", ["La denominación del puesto, el cuerpo o escala de adscripción y el sistema de provisión", "Exclusivamente el presupuesto de personal", "Solo la fecha de creación del organismo", "Únicamente el nombre del titular del puesto"], 0, "La RPT recoge datos estructurales del puesto, no de la persona concreta que lo ocupa en cada momento."],
[17, "La estructura del empleo público vasco se organiza, entre otros, en función de:", ["El sindicato de afiliación del empleado", "Un único cuerpo general sin distinción de escalas", "Cuerpos, escalas y grupos de clasificación profesional", "La antigüedad exclusivamente"], 2, "La clasificación profesional se basa en cuerpos/escalas (por especialización) y grupos (por titulación exigida)."],
[17, "La modificación de la relación de puestos de trabajo corresponde, con carácter general:", ["A cualquier empleado público a título individual", "A los sindicatos de forma exclusiva y vinculante", "Al órgano competente en materia de función pública, conforme al procedimiento establecido", "A los usuarios de los servicios públicos"], 2, "Es un acto de organización que corresponde a la Administración, con la negociación colectiva que proceda, no una decisión individual."],
[17, "Los grupos de clasificación profesional del personal funcionario se determinan, entre otros criterios, según:", ["El lugar de residencia del funcionario", "El estado civil del empleado", "La titulación exigida para el ingreso", "El número de hijos a cargo"], 2, "El grupo (A1, A2, C1, C2...) depende del nivel de titulación académica requerido para acceder al cuerpo o escala."],
[18, "El acceso al empleo público se rige, entre otros, por el principio de:", ["Antigüedad exclusiva sin otros criterios", "Igualdad, mérito y capacidad", "Libre designación sin concurrencia", "Discrecionalidad absoluta del órgano convocante"], 1, "Es un principio constitucional (art. 103.3 CE) aplicable a todo acceso a la función pública."],
[18, "Los sistemas selectivos de acceso al empleo público incluyen, entre otros:", ["Únicamente el sorteo", "La oposición, el concurso y el concurso-oposición", "La cooptación entre funcionarios", "La libre designación exclusivamente"], 1, "Son los tres sistemas selectivos clásicos regulados en la normativa de función pública."],
[18, "La provisión de puestos de trabajo puede realizarse, entre otros sistemas, mediante:", ["Exclusivamente por antigüedad", "Únicamente por sorteo público", "Solo mediante oposición libre", "El concurso de méritos y la libre designación"], 3, "A diferencia del acceso al cuerpo (oposición), la provisión del puesto concreto usa concurso o libre designación."],
[18, "La situación administrativa de servicio activo implica que el funcionario:", ["Presta efectivamente sus servicios en el puesto que ocupa", "Ha perdido la condición de funcionario", "Se encuentra suspendido de funciones", "Está jubilado"], 0, "Es la situación 'normal': el funcionario desempeña su puesto de trabajo con plenitud de derechos y deberes."],
[18, "La excedencia voluntaria es una situación administrativa en la que el funcionario:", ["Percibe siempre el cien por cien de sus retribuciones", "Es expulsado definitivamente del cuerpo", "Se encuentra en prisión provisional", "No presta servicio activo por decisión propia, con reserva o no del puesto según la modalidad"], 3, "Existen distintas modalidades de excedencia voluntaria, algunas con reserva de plaza y otras sin ella."],
[18, "Los servicios especiales, como situación administrativa, se declaran, entre otros supuestos, cuando el funcionario:", ["Es nombrado para un cargo político o de alta responsabilidad", "Comete una falta disciplinaria leve", "Solicita un permiso de pocos días", "Se traslada de localidad dentro del mismo cuerpo"], 0, "Se reconoce, entre otros casos, a quienes son nombrados altos cargos, conservando derechos como el cómputo de antigüedad."],
[18, "La suspensión de funciones, como situación administrativa, puede tener origen:", ["Exclusivamente por jubilación", "Disciplinario o preventivo, mientras se tramita un procedimiento", "Únicamente voluntario a petición del interesado", "Solo por concurso de traslados"], 1, "Puede imponerse como sanción firme o como medida cautelar durante la tramitación de un expediente."],
[18, "El sistema de concurso para la provisión de puestos de trabajo valora fundamentalmente:", ["Únicamente la antigüedad en el cuerpo", "La pertenencia a un sindicato determinado", "El lugar de nacimiento del candidato", "Los méritos y capacidades de los candidatos, conforme al baremo de la convocatoria"], 3, "El concurso se resuelve mediante un baremo objetivo de méritos (formación, experiencia, etc.) fijado en la convocatoria."],
[19, "La gestión de la documentación en los archivos de oficina tiene como finalidad principal:", ["Organizar y conservar la documentación generada en la tramitación de los asuntos hasta su transferencia o eliminación", "Eliminar sistemáticamente toda la documentación anual", "Publicar automáticamente los expedientes en el Boletín Oficial", "Sustituir el registro de entrada de documentos"], 0, "El archivo de oficina es la primera fase del ciclo vital del documento, mientras el expediente sigue activo o recién cerrado."],
[19, "El Sistema de Archivo de la Administración Pública de la Comunidad Autónoma de Euskadi tiene por objeto:", ["Regular exclusivamente los archivos históricos", "Gestionar únicamente la nómina del personal", "Sustituir la sede electrónica", "Organizar de forma integral el ciclo de vida de los documentos, desde su creación hasta su conservación permanente o eliminación"], 3, "Cubre todo el ciclo vital: archivo de gestión, intermedio e histórico, en soporte papel y electrónico."],
[19, "La documentación electrónica en la gestión de archivos de oficina exige garantizar, entre otros aspectos:", ["Su eliminación automática tras la resolución del expediente", "Que no exista ningún control de acceso", "Que se conserve exclusivamente en soporte papel", "Su autenticidad, integridad y disponibilidad a lo largo del tiempo"], 3, "Son las garantías básicas de preservación digital a largo plazo (autenticidad, integridad, disponibilidad, confidencialidad)."],
[19, "El calendario de conservación y acceso a la documentación establece:", ["El sueldo del personal de archivo", "Los plazos de transferencia, conservación, acceso y eliminación de las series documentales", "Únicamente el horario de atención al público", "La estructura orgánica del departamento"], 1, "Es la herramienta que fija, para cada serie documental, cuándo se transfiere, cuánto se conserva y cuándo se elimina o conserva permanentemente."],
[19, "El ciclo vital de los documentos administrativos comprende, entre otras, las fases de:", ["Únicamente la fase de destrucción inmediata", "Archivo de gestión, archivo intermedio y archivo histórico o definitivo", "Exclusivamente la fase de digitalización", "Solo la fase de creación del documento"], 1, "Es el modelo clásico de las tres edades del documento archivístico."],
[19, "Una serie documental se define como:", ["El índice del expediente electrónico", "Un documento único e irrepetible", "Un tipo de firma electrónica avanzada", "El conjunto de documentos producidos de manera continuada como resultado de una misma actividad o función administrativa"], 3, "Es la unidad básica de clasificación archivística: documentos generados repetidamente por una misma función (por ejemplo, expedientes de subvenciones)."],
[20, "El Sistema de Intercambio Registral (SIR) tiene como finalidad:", ["Gestionar exclusivamente la contabilidad pública", "Permitir el intercambio de asientos registrales entre las distintas Administraciones Públicas conectadas", "Eliminar el registro de entrada y salida", "Sustituir la sede electrónica de cada organismo"], 1, "El SIR conecta los registros de distintas Administraciones para remitirse documentos entre sí de forma electrónica y con validez de registro."],
[20, "Los registros electrónicos de entrada y salida de documentos permiten:", ["Eliminar la necesidad de identificación del interesado", "Prescindir del cómputo de plazos administrativos", "Sustituir el archivo definitivo de los expedientes", "Dejar constancia oficial de la recepción o remisión de documentos, con indicación de fecha y hora"], 3, "La fecha y hora del asiento registral es clave para el cómputo de plazos del procedimiento."],
[20, "La interoperabilidad entre sistemas de información de distintas Administraciones tiene como objetivo:", ["Eliminar los estándares técnicos comunes", "Centralizar toda la información en un único registro sin posibilidad de intercambio", "Permitir la relación, el intercambio de información y la prestación conjunta de servicios entre Administraciones", "Impedir el acceso electrónico de la ciudadanía"], 2, "Busca que sistemas distintos 'se entiendan' entre sí, evitando que la ciudadanía tenga que aportar datos que ya obran en otra Administración."],
[20, "Los registros electrónicos generales de la Comunidad Autónoma de Euskadi permiten, entre otras funciones:", ["La presentación de solicitudes, escritos y comunicaciones dirigidos a cualquier Administración", "Únicamente la recepción de documentos en papel", "La eliminación automática de los documentos tras su registro", "Solo la recepción de documentos dirigidos al propio organismo"], 0, "Gracias a la interconexión de registros, se puede presentar documentación dirigida a otra Administración distinta."],
[20, "El asiento registral de un documento recoge, entre otros datos:", ["El importe económico del expediente exclusivamente", "La resolución final del procedimiento", "Un número, epígrafe expresivo del contenido y la fecha y hora de presentación", "Solo el nombre del funcionario que lo tramita"], 2, "Estos datos permiten identificar y localizar el documento, así como acreditar el momento exacto de su presentación."],
[20, "La interoperabilidad se clasifica habitualmente en las siguientes dimensiones:", ["Exclusivamente jurídica", "Solo económica", "Únicamente técnica", "Organizativa, semántica y técnica"], 3, "Son las tres dimensiones clásicas del Esquema Nacional de Interoperabilidad."],
[24, "La ciudadanía, como destinataria de los servicios y prestaciones públicas, tiene derecho, entre otros, a:", ["Exigir la gratuidad de cualquier tasa administrativa", "Recibir una atención de calidad y adaptada a sus necesidades", "Obtener resolución inmediata de cualquier solicitud sin trámite", "Elegir personalmente al funcionario que le atienda"], 1, "El derecho a una atención de calidad es un principio general de las cartas de servicios y la normativa de atención ciudadana."],
[24, "La atención ante quejas y reclamaciones de la ciudadanía debe caracterizarse por:", ["La negación sistemática de cualquier responsabilidad", "La escucha activa, el registro adecuado y la información sobre el cauce de tramitación", "El traslado sin registro a otro organismo", "La ausencia de respuesta al interesado"], 1, "Una buena praxis de atención exige escuchar, registrar formalmente la queja e informar sobre cómo se tramitará."],
[24, "La atención a personas con discapacidad en las dependencias administrativas exige garantizar:", ["La accesibilidad universal, física, sensorial y cognitiva", "La reducción del tiempo de atención respecto a otras personas", "La exigencia de acompañante obligatorio en todo caso", "La atención exclusivamente telefónica"], 0, "La accesibilidad universal cubre tanto barreras físicas como de comunicación (sensorial, cognitiva)."],
[24, "La atención intercultural en la Administración vasca implica, entre otros aspectos:", ["Exigir siempre la contratación de un traductor jurado", "Limitar la atención únicamente al euskera", "Adaptar la comunicación y los servicios a la diversidad cultural y lingüística de la ciudadanía", "Excluir a la población extranjera de los servicios públicos"], 2, "Se trata de adaptar la atención (lenguaje, mediación cultural si procede) sin excluir a nadie ni imponer trámites innecesarios."],
[24, "La información y atención al público, como función de la Administración, debe prestarse conforme a los principios de:", ["Exclusividad para determinados colectivos", "Discrecionalidad absoluta sin criterios uniformes", "Claridad, veracidad y accesibilidad", "Confidencialidad total frente al interesado"], 2, "Son los principios básicos de cualquier servicio de información administrativa de calidad."],
[24, "Ante una reclamación por demora en la tramitación de un expediente, la actuación adecuada del personal de atención es:", ["Derivar la reclamación sin registrar la incidencia", "Prometer una resolución inmediata sin base real", "Negar cualquier información sobre el expediente", "Informar del estado real de tramitación y de los cauces de reclamación disponibles"], 3, "La transparencia sobre el estado real del expediente es preferible a promesas que luego no se pueden cumplir."],
[24, "La Carta de Servicios de un organismo público tiene como finalidad:", ["Informar a la ciudadanía sobre los servicios prestados y los compromisos de calidad asumidos", "Fijar el régimen disciplinario del personal", "Sustituir la normativa reguladora del procedimiento", "Establecer el presupuesto anual del organismo"], 0, "Es un instrumento de transparencia y calidad que recoge compromisos concretos y medibles frente a la ciudadanía."],
[24, "Los canales de atención a la ciudadanía en la Administración vasca incluyen habitualmente:", ["La atención presencial, telefónica y electrónica", "Únicamente la atención presencial", "Exclusivamente redes sociales privadas", "Solo el correo postal ordinario"], 0, "La multicanalidad es un principio habitual de la atención ciudadana moderna."],
[27, "Los centros de documentación y bibliotecas tienen como función principal:", ["Reunir, organizar, conservar y difundir información y documentación para su consulta pública", "Sustituir el registro general de entrada de documentos", "Tramitar el régimen disciplinario del personal", "Gestionar exclusivamente el presupuesto del organismo"], 0, "Son las cuatro funciones clásicas de cualquier centro de documentación o biblioteca."],

[8, "La Ley 10/1982, de 24 de noviembre, básica de normalización del uso del Euskera, tiene como objetivo fundamental:", ["Establecer el régimen sancionador en materia lingüística", "Regular exclusivamente la enseñanza universitaria", "Suprimir el castellano como lengua oficial", "Regular la cooficialidad y el proceso de normalización del euskera en la Comunidad Autónoma"], 3, "Es la ley marco que desarrolla el mandato estatutario de cooficialidad del euskera y el castellano en la CAE."],
[8, "El Decreto 19/2024, de 22 de febrero, regula:", ["La normalización del euskera en la enseñanza no universitaria", "El Concierto Económico", "El régimen de bibliotecas de Euskadi", "La normalización del uso del euskera en el Sector Público Vasco"], 3, "Es una norma reciente que actualiza los criterios de uso y normalización del euskera en el conjunto del sector público vasco."],
[8, "Conforme a la Ley 10/1982, la cooficialidad del euskera implica que la ciudadanía tiene derecho a:", ["Usar exclusivamente el castellano en cualquier trámite", "Usar tanto el euskera como el castellano en sus relaciones con la Administración", "Usar exclusivamente el euskera en cualquier trámite", "Elegir un tercer idioma oficial en la Administración"], 1, "La cooficialidad garantiza el derecho de la ciudadanía a relacionarse con la Administración en cualquiera de las dos lenguas oficiales."],
[9, "La Ley 11/2022, de 1 de diciembre, de Empleo Público Vasco, tiene por objeto:", ["Regular únicamente el personal laboral privado", "Regular exclusivamente el régimen presupuestario", "Aprobar el Estatuto de Autonomía", "Regular el régimen del empleo público de las Administraciones Públicas vascas"], 3, "Es la norma vasca más reciente y completa sobre función pública, adaptando el Estatuto Básico del Empleado Público (TREBEP) al ámbito autonómico."],
[9, "El Real Decreto Legislativo 5/2015 aprueba el texto refundido de:", ["La Ley del Estatuto Básico del Empleado Público (TREBEP)", "La Ley General Presupuestaria", "La Ley de Bases del Régimen Local", "La Ley de Procedimiento Administrativo Común"], 0, "El TREBEP es la norma básica estatal aplicable a todo el personal empleado público, sin perjuicio de su desarrollo autonómico."],
[9, "El TREBEP clasifica al personal al servicio de las Administraciones Públicas, entre otras categorías, en:", ["Solo personal laboral", "Únicamente funcionarios de carrera", "Exclusivamente altos cargos", "Funcionarios de carrera, funcionarios interinos, personal laboral y personal eventual"], 3, "Es la clasificación básica común a todas las Administraciones Públicas españolas."],
[9, "Conforme al TREBEP, los principios éticos del personal al servicio de las Administraciones Públicas incluyen, entre otros:", ["La discrecionalidad absoluta sin control", "La objetividad, integridad y transparencia", "La subordinación exclusiva a intereses partidistas", "La confidencialidad frente a los órganos de fiscalización"], 1, "El TREBEP dedica un capítulo específico al código de conducta de los empleados públicos, con principios éticos y de conducta."],
[10, "El Reglamento (UE) 2016/679 es conocido comúnmente como:", ["Reglamento de Transparencia", "Reglamento de Administración Electrónica", "Reglamento de Interoperabilidad", "Reglamento General de Protección de Datos (RGPD)"], 3, "El RGPD es la norma europea directamente aplicable en materia de protección de datos personales desde el 25 de mayo de 2018."],
[10, "La Ley Orgánica 3/2018, de 5 de diciembre, tiene por objeto:", ["Regular el régimen de incompatibilidades del personal público", "Adaptar el ordenamiento español al RGPD y garantizar los derechos digitales", "Regular exclusivamente la Administración electrónica", "Aprobar el régimen de transparencia"], 1, "La LOPDGDD completa y adapta al ordenamiento español las disposiciones del RGPD, además de reconocer nuevos derechos digitales."],
[10, "Según el RGPD, el responsable del tratamiento de datos personales es:", ["El propio interesado titular de los datos", "La autoridad de control en materia de protección de datos", "Quien determina los fines y medios del tratamiento", "Quien únicamente trata los datos por cuenta de otro"], 2, "Se diferencia del 'encargado del tratamiento', que trata datos por cuenta del responsable, siguiendo sus instrucciones."],
[10, "Entre los derechos digitales reconocidos por la LOPDGDD se encuentra:", ["El derecho a la propiedad privada", "El derecho de sufragio activo", "El derecho a la desconexión digital en el ámbito laboral", "El derecho a la libre circulación de mercancías"], 2, "La LOPDGDD incorpora un título específico de derechos digitales, entre ellos la desconexión digital, la neutralidad de la red o el testamento digital."],
[11, "La Ley 31/1995, de 8 de noviembre, de Prevención de Riesgos Laborales, tiene como principio básico:", ["Garantizar la seguridad y la salud de los trabajadores en el desempeño de su trabajo", "Regular exclusivamente las relaciones laborales colectivas", "Regular el régimen de la Seguridad Social", "Fijar el salario mínimo interprofesional"], 0, "Es la norma marco estatal en materia de prevención de riesgos laborales, aplicable tanto al sector privado como a las Administraciones Públicas."],
[11, "Conforme a la Ley 31/1995, la evaluación de riesgos laborales debe realizarse:", ["Solo una vez, al iniciar la actividad, sin necesidad de actualización", "Inicialmente y actualizarse cuando cambien las condiciones de trabajo", "Únicamente si lo solicita el trabajador", "Nunca, si la empresa tiene menos de 10 empleados"], 1, "La evaluación inicial de riesgos debe revisarse cuando cambien las condiciones de trabajo o se detecten daños a la salud."],
[11, "Los delegados de prevención, conforme a la Ley 31/1995, son:", ["Cargos de libre designación de la empresa", "Inspectores de trabajo destinados en la empresa", "Los representantes de los trabajadores con funciones específicas en materia de prevención de riesgos laborales", "Miembros del comité de empresa sin funciones específicas"], 2, "Son elegidos entre los representantes del personal para ejercer funciones específicas de representación en materia preventiva."],
[12, "El Real Decreto 488/1997, de 14 de abril, regula:", ["La prevención de riesgos laborales con carácter general", "Las disposiciones mínimas de seguridad y salud relativas al trabajo con equipos que incluyen pantallas de visualización", "El régimen de accidentes de trabajo", "La formación continua del personal"], 1, "Desarrolla específicamente la Ley 31/1995 en lo relativo a los riesgos derivados del trabajo con pantallas de visualización de datos."],
[12, "Según la normativa sobre pantallas de visualización de datos, la empresa debe garantizar al trabajador, entre otras medidas:", ["La eliminación de cualquier descanso durante la jornada", "La sustitución obligatoria de toda pantalla cada seis meses", "La prohibición absoluta de usar pantallas más de una hora al día", "Interrupciones periódicas o cambios de actividad que reduzcan la carga del trabajo con pantallas"], 3, "El RD 488/1997 exige organizar el trabajo de forma que existan pausas o cambios de actividad que atenúen la carga visual y postural."],
[13, "Ante una parada cardíaca extrahospitalaria, la actuación inmediata prioritaria es:", ["Administrar medicación sin supervisión", "Trasladar a la persona por medios propios sin avisar a emergencias", "Esperar la llegada de personal sanitario sin intervenir", "Iniciar la reanimación cardiopulmonar y activar el sistema de emergencias"], 3, "La cadena de supervivencia exige el reconocimiento precoz, la activación de emergencias y el inicio inmediato de RCP por parte de cualquier testigo."],
[13, "En la cadena de supervivencia ante una parada cardiorrespiratoria, el uso de un desfibrilador externo automático (DEA) debe realizarse:", ["Solo por personal médico especializado", "Únicamente en el hospital", "Nunca antes de que llegue la ambulancia", "Lo antes posible, en cuanto esté disponible, combinado con las compresiones torácicas"], 3, "La desfibrilación precoz es una de las claves de la cadena de supervivencia y puede ser usada por personal no sanitario entrenado."],
[14, "La Ley 19/2013, de 9 de diciembre, regula:", ["La protección de datos personales", "La transparencia, el acceso a la información pública y el buen gobierno", "La Administración electrónica", "El régimen presupuestario del Estado"], 1, "Es la ley estatal básica en materia de transparencia, aplicable con carácter supletorio y de mínimos a todas las Administraciones."],
[14, "Conforme a la Ley 19/2013, la publicidad activa consiste en:", ["La obligación de las Administraciones de publicar de oficio determinada información, sin necesidad de solicitud previa", "La prohibición de publicar información sin autorización judicial", "La obligación del ciudadano de solicitar siempre por escrito la información", "La publicación exclusiva de los presupuestos anuales"], 0, "Se diferencia del derecho de acceso a la información pública, que se ejerce mediante solicitud; la publicidad activa es proactiva."],
[14, "El derecho de acceso a la información pública, regulado en la Ley 19/2013, puede ser ejercido por:", ["Cualquier persona, sin necesidad de motivar su solicitud", "Exclusivamente los cargos electos", "Únicamente las personas directamente afectadas por la información", "Solo periodistas acreditados"], 0, "Es un derecho de titularidad universal, sin necesidad de acreditar un interés específico, aunque sujeto a los límites legalmente establecidos."],
[14, "El 'buen gobierno', como parte del contenido de la Ley 19/2013, establece:", ["El régimen sancionador tributario", "El régimen retributivo del personal funcionario", "Principios éticos y de actuación que deben guiar a los altos cargos de las Administraciones Públicas", "El sistema electoral municipal"], 2, "Incluye principios generales y de actuación (objetividad, transparencia, responsabilidad) exigibles a los altos cargos."],
[15, "El Decreto Legislativo 1/1997, de 11 de noviembre, aprueba el texto refundido de:", ["La Ley del Sector Público Vasco", "La Ley de Empleo Público Vasco", "El Concierto Económico", "La Ley de Principios Ordenadores de la Hacienda General del País Vasco"], 3, "Es la norma marco que regula los principios generales de la Hacienda General del País Vasco, incluida la actividad económico-financiera."],
[15, "El Decreto Legislativo 1/2011, de 24 de mayo, regula:", ["El régimen de contratación pública", "El régimen de recaudación tributaria", "El régimen presupuestario de Euskadi, incluyendo fundaciones y consorcios del sector público autonómico", "La protección de datos en el ámbito presupuestario"], 2, "Contiene el texto refundido de las disposiciones sobre régimen presupuestario aplicables a la Administración General y su sector público."],
[15, "La Ley 8/1996, de 8 de noviembre, de Finanzas de la Comunidad Autónoma de Euskadi, regula fundamentalmente:", ["El régimen de bibliotecas", "La normalización del euskera", "El sistema financiero y presupuestario de la Comunidad Autónoma de Euskadi", "El régimen de empleo público"], 2, "Es una de las normas base del sistema financiero vasco, junto con el Decreto Legislativo 1/1997 y el régimen presupuestario."],
[15, "El Decreto Legislativo 2/2017, de 19 de octubre, aprueba el texto refundido de la Ley de:", ["Control Económico y Contabilidad de la Comunidad Autónoma de Euskadi", "Empleo Público Vasco", "Instituciones Locales de Euskadi", "Administración Electrónica"], 0, "Regula el sistema de control económico interno (función interventora) y la contabilidad pública de la CAE."],
[15, "La función interventora, en el marco del control económico de la Hacienda vasca, tiene como finalidad principal:", ["Fiscalizar previamente los actos que dan lugar al reconocimiento de derechos y obligaciones económicas", "Sustituir al Parlamento Vasco en el control del gasto", "Ejercer funciones exclusivamente de auditoría externa posterior", "Aprobar directamente el presupuesto anual"], 0, "El control interno mediante la función interventora es un mecanismo de fiscalización previa dentro de la propia Administración."],
[16, "El Decreto 1/2021, de 12 de enero, aprueba el Reglamento de:", ["Recaudación de la Hacienda General del País Vasco", "Protección de Datos de la CAE", "Bibliotecas de Euskadi", "Empleo Público Vasco"], 0, "Desarrolla el procedimiento de recaudación, tanto en período voluntario como ejecutivo, de los ingresos de derecho público vascos."],
[16, "El período ejecutivo de recaudación conlleva, con carácter general:", ["La paralización de cualquier actuación de la Administración", "La exigencia de recargos e intereses de demora sobre la deuda no satisfecha en plazo", "La prescripción inmediata del derecho de cobro", "La condonación automática de la deuda"], 1, "El impago en período voluntario abre el período ejecutivo, con recargos crecientes según el momento del pago."],
[16, "Los principios ordenadores de la Hacienda General del País Vasco incluyen, entre otros:", ["La unidad de caja y la anualidad presupuestaria", "La libre disposición de fondos sin límite alguno", "La inexistencia de contabilidad pública", "La ausencia total de control presupuestario"], 0, "Son principios clásicos de la hacienda pública (unidad de caja, anualidad, especialidad, entre otros) recogidos en el Decreto Legislativo 1/1997."],
[17, "La Ley 11/2022, de Empleo Público Vasco, regula, entre otros aspectos:", ["La ordenación, planificación y gestión de los recursos humanos de las Administraciones Públicas vascas", "El régimen electoral autonómico", "Exclusivamente el régimen retributivo estatal", "El régimen de contratos del sector público"], 0, "Es la norma vasca de referencia en materia de empleo público, en desarrollo del TREBEP."],
[17, "Conforme al TREBEP, los cuerpos y escalas se agrupan en distintos grupos de clasificación profesional en función de:", ["El número de méritos acreditados", "El destino geográfico del puesto", "La titulación exigida para el ingreso", "La antigüedad del funcionario"], 2, "El TREBEP establece los grupos A1, A2, C1, C2 y Agrupaciones Profesionales según la titulación exigida."],
[18, "La Ley 11/2022 de Empleo Público Vasco regula la provisión de puestos de trabajo, entre otros, a través de:", ["Exclusivamente por decisión sindical", "El concurso de méritos y la libre designación", "Solo mediante herencia del puesto", "Únicamente el sorteo entre aspirantes"], 1, "Mantiene los sistemas clásicos de provisión (concurso y libre designación) previstos también en el TREBEP."],
[18, "Conforme al TREBEP, la evaluación del desempeño del personal funcionario:", ["Está prohibida por la normativa de función pública", "Es un instrumento para medir la conducta profesional y el rendimiento o logro de resultados", "Sustituye completamente al régimen disciplinario", "Solo puede aplicarse al personal laboral"], 1, "El TREBEP introduce la evaluación del desempeño como herramienta de gestión de recursos humanos, vinculada a la carrera profesional."],
[19, "El Decreto 91/2023, de atención integral y multicanal a la ciudadanía, contempla el acceso a los servicios públicos, entre otros medios, por:", ["Solo mediante cita previa presencial", "Únicamente vía electrónica", "Vía electrónica, presencial y telefónica de forma integrada", "Exclusivamente por correo postal"], 2, "Este decreto vasco consolida un modelo de atención integral que combina distintos canales de forma coordinada."],
[20, "El Real Decreto 203/2021 regula, entre otros aspectos, el funcionamiento de:", ["Los registros electrónicos y las sedes electrónicas del sector público", "El régimen notarial", "El régimen de propiedad industrial", "Los registros civiles exclusivamente"], 0, "Desarrolla, junto a otros aspectos, el funcionamiento electrónico de registros, sedes y archivos del sector público."],
[21, "La Ley 39/2015, de 1 de octubre, regula:", ["El Procedimiento Administrativo Común de las Administraciones Públicas", "La Protección de Datos Personales", "El Régimen Jurídico del Sector Público", "La Prevención de Riesgos Laborales"], 0, "Es la ley básica estatal (LPAC) que regula el procedimiento administrativo aplicable a todas las Administraciones Públicas."],
[21, "Conforme a la Ley 39/2015, el expediente administrativo electrónico se forma mediante:", ["La simple acumulación de archivos sin ningún orden", "Actas notariales obligatorias en todo caso", "Documentos exclusivamente en soporte papel", "La agregación ordenada de documentos, pruebas e informes en un índice electrónico firmado"], 3, "El artículo 70 LPAC exige que el expediente electrónico se forme mediante un índice electrónico firmado que garantice su integridad."],
[22, "La Ley 39/2015 admite, entre los sistemas de firma electrónica de las personas interesadas, los siguientes:", ["Solo el certificado electrónico cualificado", "Únicamente la firma manuscrita digitalizada", "Sistemas de firma electrónica cualificada, avanzada y otros sistemas como claves concertadas", "Exclusivamente la firma biométrica"], 2, "El artículo 10 LPAC admite distintos sistemas de identificación y firma, no solo el certificado cualificado."],
[23, "Conforme a la Ley 39/2015, las personas físicas podrán elegir en todo caso:", ["Relacionarse exclusivamente por vía electrónica", "Relacionarse con las Administraciones Públicas a través de medios electrónicos o presenciales, salvo obligación de relacionarse electrónicamente", "Relacionarse exclusivamente de forma presencial", "No poder ejercer ningún derecho de acceso a archivos"], 1, "El artículo 14 LPAC reconoce este derecho de elección a las personas físicas, salvo que estén obligadas a relacionarse electrónicamente."],
[23, "Están obligados a relacionarse electrónicamente con las Administraciones Públicas, conforme a la Ley 39/2015, entre otros:", ["Todas las personas físicas sin excepción", "Las personas jurídicas y los empleados públicos, en los trámites relacionados con su condición de funcionario", "Exclusivamente las personas con discapacidad", "Únicamente las personas mayores de 65 años"], 1, "El artículo 14.2 LPAC establece la obligación electrónica para determinados colectivos, incluidas las personas jurídicas."],
[24, "El derecho de la ciudadanía a no aportar documentos que ya obren en poder de la Administración actuante se recoge en:", ["El artículo 28 de la Ley 39/2015", "El artículo 103 de la Constitución", "El RGPD", "La Ley 19/2013 de Transparencia"], 0, "Este derecho, que evita duplicidades y cargas innecesarias, está expresamente recogido en la LPAC."],
[25, "Las notificaciones electrónicas practicadas por las Administraciones Públicas se entienden rechazadas, conforme a la Ley 39/2015, cuando:", ["Transcurre un año sin acceder al contenido", "Nunca se pueden considerar rechazadas", "El interesado lo solicita expresamente", "Transcurren diez días naturales desde la puesta a disposición sin que el interesado acceda a su contenido"], 3, "El artículo 43 LPAC establece esta consecuencia, salvo que de oficio o a instancia del destinatario se compruebe la imposibilidad técnica de acceso."],
[26, "La comunicación no verbal en la atención presencial incluye, entre otros elementos:", ["La expresión facial, la postura corporal y el tono de voz", "El sello del registro de entrada", "La firma electrónica del funcionario", "Únicamente el contenido de los formularios entregados"], 0, "La comunicación no verbal complementa y a veces condiciona más que el propio contenido verbal la calidad percibida de la atención."],
[27, "La Ley 11/2007, de 26 de octubre, de Bibliotecas de Euskadi, tiene por objeto:", ["Regular exclusivamente las bibliotecas universitarias", "Regular el sistema bibliotecario de la Comunidad Autónoma del País Vasco", "Regular el régimen de archivos históricos", "Aprobar el régimen de propiedad intelectual"], 1, "Es la norma marco que ordena el sistema bibliotecario vasco, incluyendo la Red de Lectura Pública de Euskadi."],
[27, "Conforme a la Ley 11/2007, el sistema bibliotecario de Euskadi se estructura, entre otros elementos, en torno a:", ["Bibliotecas exclusivamente privadas", "La ausencia de cualquier órgano consultivo", "Un único organismo centralizado sin coordinación territorial", "La Red de Lectura Pública de Euskadi y el Consejo Vasco de Bibliotecas"], 3, "La ley prevé tanto una red de bibliotecas de acceso público como órganos de coordinación y participación."],
[27, "Entre los fines del sistema bibliotecario de Euskadi, conforme a su ley reguladora, se encuentra:", ["Garantizar el acceso de toda la ciudadanía a la información, la formación y el ocio cultural", "Restringir el acceso a los fondos a personal investigador", "Suprimir el préstamo domiciliario", "Sustituir a los archivos administrativos"], 0, "El acceso universal a la información y la cultura es uno de los fines esenciales de cualquier ley de bibliotecas."],
[28, "La Ley 40/2015, de 1 de octubre, regula:", ["El Régimen Jurídico del Sector Público", "El Estatuto Básico del Empleado Público", "La Prevención de Riesgos Laborales", "El Procedimiento Administrativo Común"], 0, "La Ley 40/2015 (LRJSP) regula la organización y funcionamiento del sector público, en paralelo a la Ley 39/2015 (procedimiento)."],
[28, "Conforme a la Ley 40/2015, los principios generales de actuación de las Administraciones Públicas incluyen:", ["Eficacia, jerarquía, descentralización, desconcentración y coordinación", "Subordinación exclusiva al poder legislativo", "Confidencialidad total frente a la ciudadanía", "Discrecionalidad absoluta sin control judicial"], 0, "Estos principios, recogidos también en el art. 103 CE, se desarrollan en el artículo 3 de la Ley 40/2015."],
[29, "Los órganos administrativos, conforme a la Ley 40/2015, se crean mediante:", ["Un simple acuerdo verbal entre funcionarios", "La costumbre administrativa exclusivamente", "La norma que determine su forma de integración y dependencia, dotación de créditos y atribución de competencias", "Decisión unilateral de cualquier empleado público"], 2, "El artículo 5 de la Ley 40/2015 exige varios requisitos formales para la válida creación de un órgano administrativo."],
[30, "Conforme a la Ley 39/2015, los actos administrativos se presumen:", ["Ineficaces hasta su publicación en el BOE en todo caso", "Válidos y producen efectos desde la fecha en que se dicten, salvo que en ellos se disponga otra cosa", "Recurribles únicamente en vía penal", "Siempre nulos hasta que se demuestre lo contrario"], 1, "El artículo 39 LPAC establece la presunción de validez de los actos administrativos y su eficacia inmediata salvo excepción."],
[31, "Conforme a la Ley 39/2015, tienen la consideración de interesados en el procedimiento administrativo, entre otros:", ["Exclusivamente el Ministerio Fiscal", "Únicamente quienes hayan iniciado formalmente el expediente", "Quienes lo promuevan como titulares de derechos o intereses legítimos, individuales o colectivos", "Solo el personal funcionario que lo tramita"], 2, "El artículo 4 LPAC define ampliamente quiénes tienen la condición de interesados, incluyendo a los titulares de intereses legítimos aunque no hayan iniciado el procedimiento."],
[32, "Conforme a la Ley 39/2015, la fase de instrucción del procedimiento administrativo tiene como finalidad:", ["Eliminar el trámite de audiencia al interesado", "Ser la última fase antes de la ejecución forzosa", "Determinar, conocer y comprobar los datos en virtud de los cuales debe pronunciarse la resolución", "Sustituir a la fase de iniciación"], 2, "La instrucción incluye actos como la prueba, los informes y el trámite de audiencia, previos a la propuesta de resolución."],
[33, "Conforme a la Ley 39/2015, el plazo para interponer el recurso de alzada es, con carácter general, de:", ["Un año en todo caso", "Un mes si el acto fuera expreso", "Diez días hábiles", "Seis meses desde la notificación"], 1, "El artículo 122 LPAC fija este plazo general de un mes desde la notificación del acto expreso (tres meses si el acto no fuese expreso)."],
[34, "Conforme a la Ley 40/2015, la responsabilidad patrimonial de las Administraciones Públicas se rige por el principio de:", ["Ausencia total de responsabilidad frente a terceros", "Responsabilidad exclusivamente subjetiva basada en dolo", "Responsabilidad objetiva o por el resultado, con independencia de la culpa del agente", "Responsabilidad únicamente penal de los funcionarios"], 2, "El sistema español de responsabilidad patrimonial de la Administración es de carácter objetivo, exigiendo un daño efectivo derivado del funcionamiento del servicio público."],
[4, "El Parlamento Vasco ejerce el control del Gobierno mediante, entre otros instrumentos:", ["Preguntas, interpelaciones y mociones", "La gestión directa de los servicios públicos", "La aprobación de sentencias", "Únicamente el nombramiento de jueces"], 0],
[4, "La sede del Parlamento Vasco se encuentra en:", ["Bergara", "Bilbao", "Donostia-San Sebastián", "Vitoria-Gasteiz"], 3],
[4, "El Lehendakari puede ser destituido, entre otros supuestos, mediante:", ["Una moción de censura aprobada por el Parlamento Vasco", "Una decisión unilateral del Gobierno del Estado", "Una sentencia del Tribunal Supremo exclusivamente", "Un referéndum municipal"], 0],
[4, "Los Decretos del Gobierno Vasco son aprobados, con carácter general, por:", ["El Consejo de Gobierno", "Las Diputaciones Forales", "Cada Consejero individualmente sin necesidad de acuerdo colegiado", "El Parlamento Vasco"], 0],
[4, "El Estatuto de Gernika fue aprobado mediante:", ["Ley 27/1983", "Real Decreto 121/1979", "Ley Orgánica 3/1979, de 18 de diciembre", "Ley 12/2002"], 2],
[4, "Los Consejeros del Gobierno Vasco son nombrados y cesados por:", ["Las Juntas Generales de cada Territorio", "El Rey a propuesta del Gobierno del Estado", "El Parlamento Vasco directamente", "El Lehendakari"], 3],
