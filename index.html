[24, "Un plan de mejora de la atención ciudadana se basa habitualmente en:", ["El análisis de quejas, sugerencias y resultados de encuestas de satisfacción", "La eliminación de los canales de queja", "La reducción del personal de atención sin más criterio", "La supresión de las cartas de servicios"], 0, "Las quejas y encuestas son fuentes de información clave para detectar puntos de mejora en la atención."],
[24, "La empatía en la atención a la ciudadanía consiste en:", ["Priorizar siempre los intereses del propio organismo", "Aceptar sin cuestionamiento cualquier petición, sea o no procedente", "Evitar cualquier contacto emocional con la persona atendida", "Ponerse en el lugar de la persona usuaria para comprender su situación y necesidades"], 3, "La empatía no implica ceder ante peticiones improcedentes, sino comprender la perspectiva de la persona atendida para dar una respuesta adecuada."],
[24, "Ante una persona usuaria visiblemente alterada o agresiva, la actuación recomendada del personal de atención es:", ["Responder con el mismo tono para 'poner límites' de forma inmediata", "Abandonar el puesto de atención sin informar a nadie", "Mantener la calma, escuchar y, si es preciso, solicitar apoyo sin entrar en confrontación", "Ignorar completamente a la persona hasta que se calme por sí sola"], 2, "La desescalada mediante la calma y la escucha activa es la técnica recomendada en protocolos de atención al público."],
[24, "La accesibilidad cognitiva en la atención a la ciudadanía implica, entre otros aspectos:", ["Excluir cualquier apoyo visual en la comunicación", "Emplear siempre terminología jurídica precisa sin adaptarla", "Utilizar un lenguaje claro, sencillo y estructurado en la información que se ofrece", "Limitar la información a un máximo de una frase"], 2, "El lenguaje claro es una herramienta clave de accesibilidad cognitiva, especialmente relevante en la comunicación administrativa."],
[24, "Los indicadores de calidad de una Carta de Servicios permiten:", ["Sustituir la evaluación del desempeño del personal", "Fijar el presupuesto anual del organismo", "Eliminar la necesidad de atención presencial", "Medir objetivamente el grado de cumplimiento de los compromisos asumidos"], 3, "Los indicadores cuantifican compromisos concretos (plazos, tasas de resolución, etc.) para verificar su cumplimiento."],
[24, "La escucha activa, como técnica de atención a la ciudadanía, implica:", ["Interrumpir constantemente para agilizar la atención", "Preparar la respuesta propia mientras habla la otra persona sin prestarle atención", "Limitarse a asentir sin verificar la comprensión del mensaje", "Prestar atención completa al interlocutor, verificando la comprensión de lo escuchado"], 3, "La escucha activa exige concentración plena y comprobación de que se ha entendido correctamente el mensaje, no solo oírlo."],
[26, "En la atención telefónica, el protocolo habitual de descolgado recomienda:", ["Contestar sin identificación alguna del servicio", "Dejar sonar el teléfono el mayor tiempo posible antes de contestar", "Identificar el organismo, saludar y ofrecerse a ayudar en un tiempo breve", "Transferir la llamada sin informar al usuario del motivo"], 2, "Un protocolo de atención telefónica de calidad exige una identificación clara y una respuesta ágil."],
[26, "El desvío de llamadas hacia otro servicio debe realizarse, como buena práctica:", ["Transfiriendo sin verificar que el destino puede atender la consulta", "Informando previamente a la persona usuaria del motivo y destino del desvío", "Únicamente si el usuario lo exige expresamente por escrito", "Sin informar en ningún caso al usuario"], 1, "La transparencia sobre el motivo y destino del desvío mejora la experiencia y evita reiteraciones innecesarias."],
[26, "El silencio en una conversación telefónica de atención al público puede generar, si se prolonga sin explicación:", ["Ninguna consecuencia relevante en la percepción del servicio", "Sensación de desatención o desconexión en la persona que llama", "Mayor confianza automática del usuario", "Mejora automática de la satisfacción del usuario"], 1, "Los silencios prolongados sin explicación suelen generar incertidumbre o incomodidad en la persona que llama; conviene explicarlos brevemente."],
[26, "Entre los criterios generales de una buena comunicación oral en la Administración se encuentra:", ["Utilizar siempre el máximo tecnicismo posible", "Evitar cualquier verificación de que el mensaje ha sido comprendido", "Hablar con rapidez para finalizar cuanto antes", "Adaptar el registro lingüístico a la persona interlocutora sin perder precisión técnica"], 3, "Adaptar el lenguaje a la persona interlocutora, sin renunciar a la precisión necesaria, es un criterio básico de comunicación eficaz."],
[26, "La comunicación no verbal puede, en ocasiones, entrar en contradicción con el mensaje verbal; en tal caso:", ["El mensaje verbal siempre prevalece sin excepción", "El interlocutor suele dar más credibilidad a las señales no verbales", "Debe ignorarse siempre el lenguaje corporal", "La contradicción no afecta a la percepción del mensaje"], 1, "Es un principio bien documentado en comunicación interpersonal: ante incongruencia entre lo verbal y lo no verbal, suele primar lo no verbal en la percepción del receptor."],
[26, "El acompañamiento presencial a una persona usuaria dentro de las dependencias administrativas es una práctica recomendable especialmente cuando:", ["La persona tiene dificultades de movilidad, orientación o comprensión del itinerario", "La persona no lo solicita expresamente por escrito", "El organismo dispone de pocos empleados y no puede permitírselo nunca", "Se trata de agilizar la salida de la persona lo antes posible"], 0, "El acompañamiento facilita la accesibilidad de personas con dificultades de movilidad u orientación dentro del edificio."],
[22, "El certificado electrónico reconocido o cualificado se diferencia de otros por:", ["No requerir ningún tipo de verificación de identidad", "Poder ser emitido por cualquier persona sin control", "Tener una validez ilimitada en el tiempo sin renovación", "Ser expedido por un prestador de servicios de confianza cualificado, con mayor nivel de garantía jurídica"], 3, "Los certificados cualificados exigen la intervención de un prestador cualificado de servicios de confianza, aportando mayores garantías jurídicas."],
[22, "El sello electrónico, a diferencia de la firma electrónica de una persona física, se utiliza para:", ["Autenticar transacciones bancarias privadas exclusivamente", "Identificar a una persona jurídica o entidad, no a una persona física concreta", "Firmar exclusivamente documentos personales", "Sustituir siempre a la firma manuscrita de un particular"], 1, "El sello electrónico se vincula a personas jurídicas o entidades (por ejemplo, un órgano administrativo), no a personas físicas individuales."],
[22, "El código seguro de verificación (CSV) de un documento administrativo electrónico permite:", ["Impedir cualquier acceso posterior al documento", "Eliminar la necesidad de archivo del documento", "Sustituir por completo la firma electrónica", "Comprobar la autenticidad e integridad del documento accediendo a la sede electrónica correspondiente"], 3, "El CSV, junto con el acceso a la sede electrónica, permite verificar que una copia impresa o electrónica corresponde a un documento original auténtico."],
[22, "La legalización notarial de firmas se diferencia de la legalización administrativa en que:", ["Ninguna de las dos tiene efectos jurídicos", "Solo puede legalizarse un documento una vez en toda su vida", "Ambas requieren siempre la intervención judicial", "La primera es realizada por un notario y da fe pública, mientras que la segunda puede realizarse por funcionario habilitado en determinados supuestos"], 3, "La legalización notarial tiene el respaldo de la fe pública notarial; en el ámbito administrativo existen otros mecanismos de reconocimiento de firmas."],
[22, "Un prestador de servicios electrónicos de confianza, conforme al Reglamento eIDAS, puede prestar, entre otros, servicios de:", ["Únicamente gestión de nóminas", "Solo intermediación inmobiliaria", "Firma electrónica, sello electrónico y sellado de tiempo", "Exclusivamente asesoría jurídica"], 2, "El Reglamento eIDAS regula distintos servicios de confianza (firma, sello, sellado de tiempo, entrega electrónica certificada, entre otros)."],
[34, "La acción de responsabilidad patrimonial contra la Administración debe dirigirse, con carácter general:", ["Ante el Defensor del Pueblo exclusivamente", "Directamente ante los tribunales sin trámite administrativo previo", "Ante el Tribunal Constitucional en todo caso", "Ante la propia Administración presuntamente responsable, en vía administrativa previa"], 3, "Con carácter general, la vía administrativa (reclamación previa) es necesaria antes de acudir, en su caso, a la vía contencioso-administrativa."],
[34, "El nexo causal en la responsabilidad patrimonial de la Administración exige:", ["Que el perjudicado sea funcionario público", "Que el daño se produzca fuera del territorio nacional", "Que el daño sea consecuencia del funcionamiento normal o anormal de un servicio público", "Que exista siempre intención dolosa del empleado público"], 2, "La responsabilidad patrimonial no exige culpa del agente, sino un nexo causal entre el funcionamiento del servicio y el daño producido."],
[34, "Los daños derivados de fuerza mayor, en materia de responsabilidad patrimonial de la Administración:", ["Siempre generan responsabilidad objetiva de la Administración", "Solo generan responsabilidad si hay culpa del funcionario", "Nunca eximen a la Administración de cualquier tipo de responsabilidad", "Con carácter general, no generan responsabilidad de la Administración"], 3, "La fuerza mayor es una causa de exclusión de la responsabilidad patrimonial, a diferencia del caso fortuito, que sí puede generar responsabilidad."],
[34, "La responsabilidad de las autoridades y personal al servicio de las Administraciones Públicas frente a la propia Administración se denomina:", ["Responsabilidad penal exclusiva", "Responsabilidad objetiva absoluta sin excepciones", "Responsabilidad civil frente a terceros directamente", "Responsabilidad patrimonial de las autoridades y personal por dolo, culpa o negligencia grave"], 3, "Cuando la Administración indemniza a un tercero, puede repetir contra la autoridad o empleado responsable si hubo dolo, culpa o negligencia grave."],
[34, "El plazo para reclamar la responsabilidad patrimonial derivada de daños de carácter físico o psíquico a las personas comienza a computarse:", ["Desde la finalización del ejercicio presupuestario", "Desde la jubilación del perjudicado", "Desde la curación o la determinación del alcance de las secuelas", "Siempre desde la fecha exacta del hecho causante, sin excepción"], 2, "En daños personales de carácter continuado, el plazo de prescripción se computa desde la curación o la determinación del alcance de las secuelas, no desde el hecho inicial."],
[34, "La responsabilidad patrimonial derivada de la anulación de actos o disposiciones administrativas:", ["No presupone, por sí sola, derecho a indemnización", "Excluye siempre cualquier posible indemnización", "Genera automáticamente derecho a indemnización en todo caso", "Solo puede reclamarse ante el Tribunal Constitucional"], 0, "La mera anulación de un acto no genera automáticamente responsabilidad patrimonial; deben concurrir el resto de requisitos (daño efectivo, nexo causal, etc.)."],
[31, "La comparecencia de un interesado en un procedimiento administrativo puede realizarse:", ["Nunca de forma electrónica", "Por sí mismo o mediante representante", "Únicamente mediante abogado colegiado", "Solo si lo autoriza expresamente un juez"], 1, "El interesado puede actuar por sí mismo o valerse de representante, salvo que la ley exija su intervención personal."],
[31, "La actuación de oficio del procedimiento administrativo se caracteriza por:", ["No poder finalizar nunca en una resolución", "Estar reservada a los procedimientos sancionadores exclusivamente", "Iniciarse por la propia Administración, sin necesidad de solicitud del interesado", "Requerir siempre solicitud previa de un particular"], 2, "El procedimiento de oficio se inicia por acuerdo del órgano competente, por propia iniciativa o como consecuencia de orden superior, petición razonada o denuncia."],
[31, "El principio de buena fe y confianza legítima en las relaciones de la ciudadanía con la Administración implica:", ["Que la actuación administrativa debe ser coherente y previsible, sin generar expectativas defraudadas injustificadamente", "Que el ciudadano no tiene ningún derecho frente a cambios de criterio", "Que la Administración puede actuar arbitrariamente en cualquier momento", "Que solo se aplica en el ámbito contractual privado"], 0, "Es un principio general de actuación administrativa, expresamente recogido en el artículo 3 de la Ley 40/2015."],
[2, "El principio dispositivo en el acceso a la autonomía de las Comunidades Autónomas implica que:", ["No existió ningún proceso de decisión territorial", "Fueron los propios territorios quienes decidieron constituirse en Comunidad Autónoma", "El Estado impuso unilateralmente la creación de cada Comunidad Autónoma", "Solo el Congreso de los Diputados podía decidir qué territorios serían autónomos"], 1, "El artículo 2 CE reconoce el derecho a la autonomía, pero su ejercicio dependió de la iniciativa de los propios territorios (principio dispositivo)."],
[2, "El Tribunal Constitucional resuelve, entre otros, los conflictos de competencias que se susciten entre:", ["El Estado y las Comunidades Autónomas, o de estas entre sí", "Los particulares en materia civil", "Los sindicatos y las patronales", "Los ayuntamientos y las diputaciones exclusivamente"], 0, "Uno de los cometidos esenciales del Tribunal Constitucional es resolver los conflictos de competencias territoriales."],
[3, "El procedimiento legislativo ordinario de la Unión Europea implica la participación conjunta de:", ["El Parlamento Europeo y el Consejo de la Unión Europea", "Únicamente la Comisión Europea", "Solo el Consejo Europeo", "Exclusivamente el Tribunal de Justicia"], 0, "Es el procedimiento habitual de aprobación de reglamentos y directivas, con codecisión de Parlamento y Consejo, a propuesta de la Comisión."],
[4, "Las leyes aprobadas por el Parlamento Vasco reciben la denominación de:", ["Órdenes departamentales", "Reglamentos autonómicos", "Leyes del Parlamento Vasco", "Decretos Legislativos exclusivamente"], 2, "El Parlamento Vasco, como órgano legislativo, aprueba leyes propiamente dichas dentro de su ámbito competencial."],
[4, "La moción de censura al Lehendakari, conforme al sistema parlamentario vasco, debe ser:", ["Simple, sin necesidad de proponer alternativa", "Convocada mediante referéndum popular", "Constructiva, incluyendo un candidato alternativo", "Aprobada por el Gobierno del Estado"], 2, "Al igual que en el sistema estatal, la moción de censura en el sistema vasco es de carácter constructivo."],
[7, "La sede electrónica asociada de un organismo público permite:", ["Eliminar la necesidad de identificación electrónica", "Prescindir de cualquier medida de seguridad", "Sustituir por completo el registro electrónico general", "Que varios órganos compartan una misma sede electrónica común"], 3, "Permite que distintos órganos o entidades compartan infraestructura y presencia electrónica común, optimizando recursos."],
[7, "El principio de neutralidad tecnológica en la Administración electrónica implica que:", ["Es incompatible con el uso de estándares abiertos", "La ciudadanía no debe verse obligada a utilizar una aplicación o sistema propietario específico", "Solo se admiten formatos de código cerrado", "Debe imponerse siempre un único sistema operativo"], 1, "Este principio busca garantizar la libertad de elección tecnológica de la ciudadanía en sus relaciones electrónicas con la Administración."],
[8, "El euskera batua es:", ["Un dialecto exclusivamente hablado en Francia", "Una lengua distinta del euskera", "La variante estandarizada del euskera adoptada como referencia normativa", "Una variante exclusiva del ámbito judicial"], 2, "El euskera batua es la forma unificada y estandarizada del euskera, promovida por Euskaltzaindia desde finales de los años 60."],
[8, "Euskaltzaindia es la institución encargada de:", ["La gestión de las bibliotecas públicas vascas", "La normativización y regulación académica de la lengua vasca", "La recaudación de tributos forales", "La organización de los procesos selectivos de empleo público"], 1, "Es la Real Academia de la Lengua Vasca, responsable de la codificación normativa del euskera."],
[11, "Los equipos de protección individual (EPI) deben utilizarse, conforme a la normativa preventiva:", ["Como primera y única medida preventiva, sin adoptar otras", "Nunca en el ámbito de la Administración Pública", "Únicamente si el trabajador lo solicita voluntariamente", "Cuando los riesgos no puedan evitarse o limitarse suficientemente por medios de protección colectiva"], 3, "La jerarquía de medidas preventivas prioriza la protección colectiva; los EPI se usan cuando esta no es suficiente."],
[12, "El deslumbramiento en el trabajo con pantallas de visualización puede prevenirse, entre otras medidas, mediante:", ["La correcta orientación de la pantalla respecto a las fuentes de luz", "El aumento máximo del brillo de la pantalla", "La eliminación de cualquier fuente de luz natural", "El uso continuado sin pausas"], 0, "Orientar adecuadamente la pantalla respecto a ventanas y luminarias reduce los reflejos y el deslumbramiento."],
[13, "Ante una persona con signos de atragantamiento que no puede toser ni hablar, la maniobra recomendada es:", ["Darle agua para facilitar la deglución", "Esperar sin intervenir a que se resuelva solo", "Golpear únicamente en el pecho", "La maniobra de Heimlich (compresiones abdominales)"], 3, "La maniobra de Heimlich es la técnica de primeros auxilios recomendada ante obstrucción completa de la vía aérea."],
[13, "En caso de quemadura leve, la actuación de primeros auxilios recomendada incluye:", ["Enfriar la zona con agua a temperatura ambiente durante varios minutos", "Reventar cualquier ampolla que se forme", "Aplicar pasta de dientes o remedios caseros similares", "Aplicar hielo directamente sobre la quemadura"], 0, "El enfriamiento con agua templada (no helada) es la medida de primeros auxilios recomendada ante quemaduras leves."],
[14, "El principio de rendición de cuentas, dentro del gobierno abierto, implica que:", ["Solo los tribunales pueden exigir explicaciones a la Administración", "No existe obligación de justificar decisiones públicas", "Se limita exclusivamente al ámbito presupuestario", "Los responsables públicos deben responder de sus decisiones y resultados ante la ciudadanía"], 3, "Es uno de los tres pilares clásicos del gobierno abierto junto con la transparencia y la participación ciudadana."],
[16, "Las tasas, como categoría de ingreso público, se caracterizan por:", ["Ser siempre de carácter voluntario sin contraprestación", "No tener relación alguna con ningún servicio prestado", "Retribuir la prestación de un servicio público o la realización de una actividad administrativa que beneficia al obligado", "Aplicarse exclusivamente a empresas privadas"], 2, "Las tasas se vinculan a la prestación de un servicio o actividad administrativa concreta que beneficia al sujeto obligado a pagarlas."],
[17, "Un puesto de trabajo singularizado, en el marco de la RPT, se caracteriza por:", ["Estar excluido de la relación de puestos de trabajo", "No requerir ninguna adscripción a cuerpo o escala", "Ser siempre de libre designación", "Tener características específicas que lo diferencian del resto de puestos base del mismo cuerpo o escala"], 3, "Los puestos singularizados presentan funciones o requisitos específicos, a diferencia de los puestos base o genéricos."],
[19, "Los metadatos de un documento electrónico de archivo permiten, entre otras funciones:", ["Eliminar la necesidad de un sistema de gestión documental", "Describir el contexto, contenido y estructura del documento para su gestión y recuperación", "Sustituir el contenido del propio documento", "Cifrar el documento de forma permanente"], 1, "Los metadatos son datos estructurados sobre el documento que facilitan su identificación, gestión y recuperación en el tiempo."],
[20, "Un registro electrónico general puede rechazar la entrada de un documento cuando:", ["El interesado se identifique mediante certificado electrónico", "El documento esté dirigido a otra Administración distinta", "Se presente fuera del horario de atención presencial", "Contenga código malicioso o un formato no admitido por la sede electrónica"], 3, "El rechazo de documentos en el registro electrónico está tasado legalmente, entre otros supuestos, a los documentos con código malicioso o formato no admitido."],
[21, "La expedición de una copia auténtica de un documento administrativo en soporte papel a partir de un documento electrónico exige, entre otros requisitos:", ["Que se solicite ante notario en todo caso", "Que se elimine el documento electrónico original", "Que el documento pierda su validez jurídica", "Que quede constancia de su carácter de copia mediante la diligencia correspondiente"], 3, "Las copias auténticas deben incluir la diligencia que acredite su condición de copia y su correspondencia con el original."],
[23, "El derecho a obtener información y orientación sobre los requisitos jurídicos o técnicos de un proyecto se recoge, conforme a la LPAC, como:", ["Un derecho condicionado al pago de una tasa previa", "Un derecho exclusivo de los profesionales colegiados", "Un privilegio exclusivo de las grandes empresas", "Un derecho de la ciudadanía en sus relaciones con las Administraciones Públicas"], 3, "El artículo 13 LPAC recoge este derecho entre los derechos generales de las personas en sus relaciones con la Administración."],
[23, "El derecho a ser tratado con respeto y deferencia por las autoridades y empleados públicos forma parte de:", ["Un privilegio exclusivo de los cargos electos", "Un derecho condicionado a la nacionalidad española", "Un derecho exclusivo en vía judicial", "Los derechos generales de la ciudadanía frente a la Administración"], 3, "Es uno de los derechos generales recogidos en el artículo 13 LPAC, aplicable a cualquier persona en sus relaciones con la Administración."],
[25, "El uso de mayúsculas sostenidas en un documento administrativo escrito debe, como buena práctica de estilo:", ["Ser obligatorio en cualquier notificación", "Aplicarse a la totalidad del texto del documento", "Sustituir siempre a la negrita y la cursiva", "Limitarse a casos concretos, evitando su abuso por dificultar la lectura"], 3, "Las guías de estilo administrativo desaconsejan el abuso de mayúsculas sostenidas por dificultar la lectura y comprensión del texto."],
[25, "El lenguaje claro en los documentos administrativos persigue, entre otros objetivos:", ["Aumentar la longitud de las frases para mayor precisión jurídica", "Sustituir por completo el vocabulario técnico necesario", "Reducir el documento a un único párrafo sin estructura", "Facilitar la comprensión del contenido por parte de cualquier persona destinataria"], 3, "El lenguaje claro busca que cualquier persona, sin formación jurídica, pueda comprender el contenido esencial del documento."],
[27, "El depósito legal, en relación con las bibliotecas y centros de documentación, tiene como finalidad:", ["Autorizar la exportación de fondos bibliográficos", "Fijar el precio de venta al público de los libros", "Sustituir el registro de la propiedad intelectual", "Garantizar la conservación del patrimonio bibliográfico y documental publicado"], 3, "El depósito legal obliga a depositar ejemplares de toda publicación para su conservación y control bibliográfico."],
[29, "La avocación es la técnica mediante la cual:", ["Un órgano superior asume el conocimiento de un asunto que corresponde por delegación o desconcentración a un órgano inferior", "Se crea un nuevo órgano administrativo", "Un órgano inferior asume competencias de uno superior sin autorización", "Se elimina definitivamente una competencia"], 0, "La avocación permite al órgano superior recuperar, motivadamente, el conocimiento de un asunto concreto."],
[30, "La motivación de los actos administrativos tiene como finalidad principal:", ["Sustituir el trámite de audiencia al interesado", "Aumentar la extensión del documento sin más utilidad", "Evitar la necesidad de notificación", "Permitir conocer las razones de hecho y de derecho en que se basa la decisión, facilitando su control"], 3, "La motivación es una garantía esencial que permite al interesado conocer y, en su caso, impugnar los fundamentos del acto."],
[30, "La convalidación es la técnica mediante la cual:", ["Se subsanan los vicios de que adolezca un acto anulable, mediante la subsanación de los defectos", "Se ejecuta forzosamente un acto administrativo", "Se recurre un acto ante los tribunales", "Se declara la nulidad radical de un acto"], 0, "La convalidación permite sanar los vicios de anulabilidad de un acto, a diferencia de los actos nulos de pleno derecho, que no admiten convalidación."],
[32, "El trámite de audiencia en el procedimiento administrativo tiene como finalidad:", ["Sustituir la fase de instrucción completa", "Ser opcional y prescindible en todo procedimiento", "Aplicarse únicamente en procedimientos penales", "Permitir al interesado alegar y presentar los documentos que estime pertinentes antes de la resolución"], 3, "Es un trámite esencial de garantía que permite al interesado conocer el expediente y formular alegaciones antes de que se dicte resolución."],

/* ============ STORAGE (window.storage con fallback a localStorage) ============ */
async function storageGet(key){
  try{ if(window.storage){ const r = await window.storage.get(key); return r ? r.value : null; } }catch(e){}
  try{ return localStorage.getItem(key); }catch(e){}
  return null;
}
async function storageSet(key,value){
  try{ if(window.storage){ await window.storage.set(key,value); return; } }catch(e){}
  try{ localStorage.setItem(key,value); }catch(e){}
}

function buildAll(){
  const out=[];
  QUESTIONS.forEach((q,i)=> out.push({id:'b'+i, tema:q[0], question:q[1], options:q[2], correct:q[3], explanation:q[4]||null}));
  customQuestions.forEach((q,i)=> out.push({id:'c'+i, tema:q[0], question:q[1], options:q[2], correct:q[3], explanation:q[4]||null}));
  return out;
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

  try{ const c = await storageGet('custom_questions'); if(c) customQuestions = JSON.parse(c); }catch(e){}

  try{ const s = await storageGet('tema_stats'); if(s) temaStats = JSON.parse(s); }catch(e){}
  try{ const d = await storageGet('dark_mode'); if(d) darkMode = d === '1'; }catch(e){}

  try{ const em = await storageGet('exam_mode'); if(em){ examMode = em === '1'; examModePreference = examMode; } }catch(e){}

/* ============ MONITORIZACIÓN: envío a Google Sheets (si está configurado) ============ */
function sendLog(accion, extra){
  if(!SHEET_WEBHOOK_URL) return; // sin URL configurada, no se envía nada a ningún sitio
  try{
    const payload = Object.assign({
      nombre: userName || "(sin nombre)",
      accion: accion,
      fechaCliente: new Date().toLocaleString('es-ES'),
    }, extra || {});
    fetch(SHEET_WEBHOOK_URL, {
      method: 'POST',
      mode: 'no-cors', // Apps Script no admite CORS estándar; no leemos respuesta, solo enviamos
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(()=>{ /* sin conexión: se ignora silenciosamente, no interrumpe el uso de la app */ });
  }catch(e){ /* nunca debe romper la app por un fallo de red */ }
}

let _audioCtx = null;
function getAudioCtx(){
  if(!_audioCtx){
    try{ _audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; }
  }
  if(_audioCtx.state === 'suspended'){ _audioCtx.resume(); }
  return _audioCtx;
}
function playTone(freq, startTime, duration, ctx, type='sine', gainPeak=0.18){
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, startTime);
  gain.gain.setValueAtTime(0, startTime);
  gain.gain.linearRampToValueAtTime(gainPeak, startTime+0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001, startTime+duration);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(startTime); osc.stop(startTime+duration+0.02);
}
function playCorrectSound(){
  if(!soundEnabled) return;
  const ctx = getAudioCtx(); if(!ctx) return;
  const now = ctx.currentTime;
  playTone(587.33, now, 0.11, ctx, 'sine');       // Re5
  playTone(880.00, now+0.09, 0.16, ctx, 'sine');  // La5
}
function playWrongSound(){
  if(!soundEnabled) return;
  const ctx = getAudioCtx(); if(!ctx) return;
  const now = ctx.currentTime;
  playTone(196.00, now, 0.22, ctx, 'sawtooth', 0.12);     // Sol3
  playTone(174.61, now+0.1, 0.24, ctx, 'sawtooth', 0.12); // Fa3
}

function computeStreak(){
  let streak = 0;
  const d = new Date();
  const todayStr = d.toISOString().slice(0,10);
  if(!studyDates.has(todayStr)){ d.setDate(d.getDate()-1); }
  while(true){
    const s = d.toISOString().slice(0,10);
    if(studyDates.has(s)){ streak++; d.setDate(d.getDate()-1); }
    else break;
  }
  return streak;
}

function weakestTemas(n){
  return Object.entries(TEMAS).map(([num,name])=>{
    const st = temaStats[num]||{attempts:0,correct:0};
    const pct = st.attempts>0 ? st.correct/st.attempts*100 : null;
    return {num:Number(num), name, pct, attempts:st.attempts};
  }).filter(t=>t.pct!==null && t.attempts>=3).sort((a,b)=>a.pct-b.pct).slice(0,n);
}

  else if(view==="quiz") app.innerHTML = renderQuiz();
  else if(view==="results") app.innerHTML = renderResults();
  else if(view==="import") app.innerHTML = renderImport();
  else if(view==="stats") app.innerHTML = renderStats();
  else if(view==="temario") app.innerHTML = renderTemario();
  attachHandlers();
  startTimerIfNeeded();
}

function renderQuiz(){
  const q = quizPool[currentIndex];
  const answered = answers[currentIndex];
  const progressPct = Math.round((currentIndex/quizPool.length)*100);
  const letters = ["A","B","C","D"];
  const isFlagged = flaggedIds.has(q.id);

  const showFeedback = answered && !examMode;
  const optionsHtml = q.options.map((opt,i)=>{
    let cls = "option";
    if(showFeedback){
      cls += " disabled";
      if(i===q.correct) cls += " correct";
      else if(i===answered.chosen) cls += " wrong";
    } else if(examMode && answered && i===answered.chosen){
      cls += " selected";
    }
    return `<div class="${cls}" data-opt="${i}"><span class="letter">${letters[i]}</span><span>${opt}</span></div>`;
  }).join("");

  let feedback = "";
  if(showFeedback){
    if(answered.chosen === q.correct){
      feedback = `<div class="feedback ok">Correcto.</div>`;
    } else if(answered.chosen === null){
      feedback = `<div class="feedback no">Sin responder. La correcta es la <b>${letters[q.correct]}) ${q.options[q.correct]}</b>.</div>`;
    } else {
      feedback = `<div class="feedback no">Incorrecto. La respuesta correcta es la <b>${letters[q.correct]}) ${q.options[q.correct]}</b>.</div>`;
    }
    if(q.explanation){
      feedback += `<div class="small" style="margin-top:6px;">${q.explanation}</div>`;
    }
    const qst = questionStats[q.id];
    if(qst && qst.fails>0){
      feedback += `<div class="small" style="margin-top:6px;color:var(--gold);">Ya has fallado esta pregunta ${qst.fails} ${qst.fails===1?'vez':'veces'} antes. Repásala con atención.</div>`;
    }
  }

  const timerHtml = quizEndTime ? `<div id="timerDisplay" class="timerBox">--:--</div>` : "";
  const isLast = currentIndex===quizPool.length-1;
  const canAdvance = examMode || answered;
  const nextLabel = isLast ? (examMode ? "Finalizar test" : "Ver resultados") : "Siguiente";

  return `
  <header class="app">
    <h1>Test en curso ${examMode?'<span class="tag" style="margin-left:8px;">MODO EXAMEN</span>':''}</h1>
    <div class="headerRight">
      <button class="iconBtn" id="soundToggle" title="${soundEnabled?'Silenciar sonidos':'Activar sonidos'}">${soundEnabled?'🔊':'🔇'}</button>
      ${timerHtml}
      <div class="tag">${currentIndex+1} / ${quizPool.length}</div>
    </div>
  </header>
  <div class="progress-bar"><div class="progress-fill" style="width:${progressPct}%"></div></div>
  <div class="card">
    <div class="qmeta">
      <span>Tema ${q.tema} · ${TEMAS[q.tema]||''}</span>
      <button class="flagBtn ${isFlagged?'active':''}" id="flagBtn" title="Marcar como duda">${isFlagged?'★ Duda':'☆ Marcar duda'}</button>
    </div>
    <p class="qtext">${q.question}</p>
    ${optionsHtml}
    ${feedback}
  </div>
  <div class="footer-nav">
    <button class="btn secondary" id="quitBtn">Salir</button>
    ${examMode ? `<button class="btn secondary" id="prevBtn" ${currentIndex===0?'disabled':''}>Anterior</button>` : ""}
    <button class="btn" id="nextBtn" ${canAdvance?'':'disabled'}>${nextLabel}</button>
  </div>
  ${examMode && !isLast ? `<div style="text-align:center;margin-top:12px;"><a class="link-btn" id="finishNowBtn">Finalizar test ahora</a></div>` : ""}
  `;
}

function renderEvolutionCard(){
  if(sessionsHistory.length<2) return "";
  const recent = sessionsHistory.slice(-12);
  const w = 300, h = 70, pad = 6;
  const stepX = (w-2*pad)/(recent.length-1);
  const pts = recent.map((s,i)=>{
    const x = pad + i*stepX;
    const y = pad + (h-2*pad) * (1 - s.pct/100);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  const circles = recent.map((s,i)=>{
    const x = pad + i*stepX;
    const y = pad + (h-2*pad) * (1 - s.pct/100);
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.5" fill="var(--green)"></circle>`;
  }).join("");
  const first = recent[0].pct, last = recent[recent.length-1].pct;
  const trend = last>=first ? "↑" : "↓";
  return `
  <div class="card">
    <h2 class="section">Tu evolución (últimos ${recent.length} tests)</h2>
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;overflow:visible;">
      <polyline points="${pts}" fill="none" stroke="var(--green)" stroke-width="2"></polyline>
      ${circles}
    </svg>
    <p class="small" style="margin-top:6px;">De ${first}% a ${last}% de acierto ${trend}</p>
  </div>`;
}

function renderResults(){
  const total = quizPool.length;
  let correctCount=0, wrongCount=0, blankCount=0, netScore=0;
  answers.forEach((a,i)=>{
    const q = quizPool[i];
    if(a.chosen===null){ blankCount++; }
    else if(a.chosen===q.correct){ correctCount++; netScore += 1; }
    else{ wrongCount++; netScore -= penaltyFraction; }
  });
  const notaSobre10 = (netScore/total*10).toFixed(2);

  const byTema = {};
  answers.forEach((a,i)=>{
    const q = quizPool[i];
    if(!byTema[q.tema]) byTema[q.tema] = {ok:0,total:0};
    byTema[q.tema].total++;
    if(a.chosen===q.correct) byTema[q.tema].ok++;
  });
  const temaRows = Object.entries(byTema).sort((a,b)=>a[0]-b[0]).map(([tema,v])=>{
    return `<div class="tema-result"><span>Tema ${tema} · ${TEMAS[tema]}</span><span class="badge">${v.ok}/${v.total}</span></div>`;
  }).join("");

  const wrongList = answers.map((a,i)=>({a,q:quizPool[i]})).filter(x=>x.a.chosen!==x.q.correct).map(({a,q})=>{
    const letters=["A","B","C","D"];
    const tuResp = a.chosen===null ? "sin responder" : `${letters[a.chosen]}) ${q.options[a.chosen]}`;
    return `<div class="card" style="padding:16px;">
      <div class="qmeta">Tema ${q.tema}</div>
      <p style="margin:0 0 8px;font-size:.95rem;">${q.question}</p>
      <p class="small" style="margin:0;">Tu respuesta: ${tuResp}<br>Correcta: ${letters[q.correct]}) ${q.options[q.correct]}</p>
    </div>`;
  }).join("");

  const totalMs = questionElapsed.reduce((a,b)=>a+b,0);
  const avgMs = total>0 ? totalMs/total : 0;
  const avgSec = Math.round(avgMs/1000);
  const avgTimeStr = avgSec>=60 ? `${Math.floor(avgSec/60)} min ${avgSec%60}s` : `${avgSec}s`;

  return `
  ${headerHtml("Resultados", total + " preguntas")}
  <div class="card" style="text-align:center;">
    <div class="score-big">${correctCount}/${total}</div>
    <div class="small" style="margin-top:6px;">${correctCount} aciertos · ${wrongCount} fallos · ${blankCount} en blanco</div>
    <div class="small" style="margin-top:6px;">Tiempo medio por pregunta: <b>${avgTimeStr}</b></div>
    ${penaltyFraction>0 ? `<div class="small" style="margin-top:10px;">Nota con penalización: <b>${netScore.toFixed(2)}</b> puntos (${notaSobre10} sobre 10)</div>` : ""}
  </div>
  ${renderEvolutionCard()}
  <div class="card">
    <h2 class="section">Resultado por tema</h2>
    ${temaRows}
  </div>
  ${wrongList ? `<h2 class="section" style="margin:20px 0 12px;">Repaso de fallos</h2>${wrongList}` : `<p class="small">¡Sin fallos! Buen trabajo.</p>`}
  <div class="row" style="margin-top:16px;">
    <button class="btn wide" id="backHome">Volver al inicio</button>
    ${wrongCount>0 ? `<button class="btn secondary wide" id="exportFails">Exportar fallos (.txt)</button>` : ""}
  </div>
  `;
}

function renderStats(){
  const rows = Object.entries(TEMAS).map(([num,name])=>{
    const st = temaStats[num] || {attempts:0, correct:0};
    const pct = st.attempts>0 ? Math.round(st.correct/st.attempts*100) : null;
    return {num,name,attempts:st.attempts,correct:st.correct,pct};
  }).sort((a,b)=>{
    if(a.pct===null && b.pct===null) return a.num-b.num;
    if(a.pct===null) return 1;
    if(b.pct===null) return -1;
    return a.pct-b.pct;
  });

  const rowsHtml = rows.map(r=>{
    const pctDisplay = r.pct===null ? "—" : r.pct+"%";
    const barWidth = r.pct===null ? 0 : r.pct;
    return `<div class="statRow">
      <span class="name">T${r.num} · ${r.name}</span>
      <div class="statBar"><div style="width:${barWidth}%"></div></div>
      <span class="pct">${pctDisplay}</span>
    </div>`;
  }).join("");

  return `
  ${headerHtml("Estadísticas", "por tema")}
  <div class="card">
    <p class="small">Acumulado de todas tus sesiones de test, ordenado de peor a mejor % de acierto, para ver de un vistazo qué temas tienes más flojos.</p>
    ${rowsHtml}
  </div>
  <div class="row">
    <button class="btn wide" id="backHome3">Volver al inicio</button>
    <button class="link-btn" id="resetStats">Reiniciar estadísticas</button>
  </div>
  `;
}

/* ============ HANDLERS ============ */
function attachHandlers(){
  const splash = document.getElementById('splashScreen');
  if(splash) splash.onclick = ()=>{
    if(SHEET_WEBHOOK_URL && !userName){ view="identify"; } else { view="home"; sendLog('apertura'); }
    render();
  };
  const nameSubmit = document.getElementById('nameSubmit');
  if(nameSubmit){
    const nameInput = document.getElementById('nameInput');
    const submit = async ()=>{
      const val = (nameInput.value||"").trim();
      if(!val) { nameInput.focus(); return; }
      userName = val;
      await storageSet('user_name', userName);
      view = "home";
      sendLog('apertura');
      render();
    };
    nameSubmit.onclick = submit;
    nameInput.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
  }

  const dt = document.getElementById('darkToggle');
  if(dt) dt.onclick = async ()=>{ darkMode=!darkMode; applyDarkMode(); await persistDark(); render(); };

  if(view==="home"){
    document.querySelectorAll('[data-tema]').forEach(cb=>{
      cb.addEventListener('change',e=>{
        const n = Number(e.target.dataset.tema);
        if(e.target.checked) selectedTemas.add(n); else selectedTemas.delete(n);
        updateMaxAvail();
      });
    });
    document.querySelectorAll('input[name="srcMode"]').forEach(r=>{
      r.addEventListener('change', e=>{ sourceMode = e.target.value; render(); });
    });
    document.getElementById('selAll').onclick=()=>{selectedTemas=new Set(Object.keys(TEMAS).map(Number));render();};
    document.getElementById('selNone').onclick=()=>{selectedTemas=new Set();render();};
    document.getElementById('goTemario').onclick=()=>{view="temario";render();};
    document.getElementById('startBtn').onclick=startQuiz;
    document.getElementById('examSimBtn').onclick=startExamSimulation;
    document.getElementById('goImport').onclick=()=>{view="import";render();};
    document.getElementById('goStats').onclick=()=>{view="stats";render();};
    document.getElementById('examModeChk').onchange=async e=>{ examMode=e.target.checked; examModePreference=examMode; await persistExamMode(); };
    document.getElementById('fontSizeSel').onchange=async e=>{ fontSize=e.target.value; applyFontSize(); await persistFontSize(); };
    updateMaxAvail();
  } else if(view==="quiz"){
    document.querySelectorAll('.option').forEach(el=>{
      el.addEventListener('click',()=>{
        if(answers[currentIndex] && !examMode) return;
        const chosen = Number(el.dataset.opt);
        answers[currentIndex] = {chosen};
        if(!examMode){
          const q = quizPool[currentIndex];
          if(chosen === q.correct) playCorrectSound(); else playWrongSound();
        }
        render();
      });
    });
    document.getElementById('quitBtn').onclick=()=>{
      if(confirm("¿Seguro que quieres salir? Perderás el progreso de este test.")){
        clearInterval(timerInterval); examMode = examModePreference; view="home"; render();
      }
    };
    const st = document.getElementById('soundToggle');
    if(st) st.onclick = async ()=>{ soundEnabled = !soundEnabled; await persistSound(); render(); };
    document.getElementById('flagBtn').onclick=async ()=>{
      const q = quizPool[currentIndex];
      if(flaggedIds.has(q.id)) flaggedIds.delete(q.id); else flaggedIds.add(q.id);
      await persistFlagged();
      render();
    };
    const pb = document.getElementById('prevBtn');
    if(pb) pb.onclick=()=>{ recordTimeSpent(); currentIndex--; render(); };
    const fnb = document.getElementById('finishNowBtn');
    if(fnb) fnb.onclick=()=>{
      for(let i=0;i<quizPool.length;i++){ if(!answers[i]) answers[i]={chosen:null}; }
      recordTimeSpent();
      finalizeQuiz();
    };
    const nb = document.getElementById('nextBtn');
    if(nb) nb.onclick=()=>{
      recordTimeSpent();
      if(currentIndex===quizPool.length-1){
        if(examMode){ for(let i=0;i<quizPool.length;i++){ if(!answers[i]) answers[i]={chosen:null}; } }
        finalizeQuiz();
      }
      else{ currentIndex++; render(); }
    };
  } else if(view==="results"){
    document.getElementById('backHome').onclick=()=>{examMode = examModePreference; view="home";render();};
    const exp = document.getElementById('exportFails');
    if(exp) exp.onclick = exportFails;
  } else if(view==="import"){
    document.getElementById('importBtn').onclick=handleImport;
    document.getElementById('backHome2').onclick=()=>{view="home";render();};
    const clr = document.getElementById('clearCustom');
    if(clr) clr.onclick=async ()=>{ customQuestions=[]; await persistCustom(); render(); };
  } else if(view==="temario"){
    document.getElementById('backHome4').onclick=()=>{view="home";render();};
  } else if(view==="stats"){
    document.getElementById('backHome3').onclick=()=>{view="home";render();};
    document.getElementById('resetStats').onclick=async ()=>{
      if(confirm("¿Reiniciar todo el historial de estadísticas por tema?")){
        temaStats = {}; await persistStats(); render();
      }
    };
  }
}

function updateMaxAvail(){
  const avail = buildAll().filter(q=>selectedTemas.has(q.tema)).length;
  const maxEl = document.getElementById('maxAvail');
  const numQ = document.getElementById('numQ');
  if(maxEl) maxEl.textContent = avail;
  if(numQ) numQ.max = Math.max(1,avail);
}

function priorityWeight(q){
  // Prioridad de repaso: cuantas más veces se ha fallado en proporción a los intentos, mayor peso.
  // Suavizado de Laplace para que una sola pregunta nunca fallada no quede en peso 0, y una nueva sin intentos tenga peso medio.
  const st = questionStats[q.id];
  if(!st || !st.attempts) return 1.5; // preguntas nunca vistas: prioridad media-alta para que entren en rotación
  const failRate = (st.fails + 1) / (st.attempts + 2);
  return 0.3 + failRate*3; // entre ~0.3 (dominada) y ~3.3 (muy fallada)
}

function weightedShuffle(arr, weightFn){
  // Muestreo aleatorio ponderado sin reemplazo (algoritmo de la clave A-ExpJ simplificado)
  return arr
    .map(q=>({q, key: Math.pow(Math.random(), 1/weightFn(q))}))
    .sort((a,b)=>b.key-a.key)
    .map(p=>p.q);
}

function weightedByFails(pool){
  // Repetición espaciada: prioriza preguntas con peor % de acierto histórico, con aleatoriedad para no repetir siempre el mismo orden
  return weightedShuffle(pool, priorityWeight);
}

function stratifiedByTema(pool, n){
  // Reparte las preguntas de forma equilibrada entre los temas seleccionados y, dentro de cada tema,
  // da prioridad suave a las preguntas que peor dominas (repetición espaciada ligera también en modo normal)
  const byTema = {};
  pool.forEach(q=>{ (byTema[q.tema] = byTema[q.tema]||[]).push(q); });
  const temaKeys = Object.keys(byTema);
  const numTemas = temaKeys.length;
  if(numTemas<=1) return weightedShuffle(pool, priorityWeight).slice(0,n);
  temaKeys.forEach(k=> byTema[k]=weightedShuffle(byTema[k], priorityWeight));
  const base = Math.floor(n/numTemas);
  let remainder = n - base*numTemas;
  const order = shuffle(temaKeys);
  const result = [];
  order.forEach(k=>{
    let quota = base + (remainder>0 ? 1 : 0);
    if(remainder>0) remainder--;
    result.push(...byTema[k].slice(0,quota));
  });
  if(result.length<n){
    const used = new Set(result.map(q=>q.id));
    const leftovers = weightedShuffle(pool.filter(q=>!used.has(q.id)), priorityWeight);
    result.push(...leftovers.slice(0, n-result.length));
  }
  return shuffle(result).slice(0,n);
}


function startExamSimulation(){
  selectedTemas = new Set(Object.keys(TEMAS).map(Number));
  sourceMode = "temas";
  examMode = true;
  const all = buildAll().filter(q=>selectedTemas.has(q.tema));
  const n = Math.min(60, all.length);
  const chosen = stratifiedByTema(all, n);
  quizPool = shuffle(chosen).map(q=>{
    const idxs = shuffle(q.options.map((_,i)=>i));
    return {...q, options: idxs.map(i=>q.options[i]), correct: idxs.indexOf(q.correct)};
  });
  currentIndex = 0;
  answers = [];
  questionElapsed = new Array(quizPool.length).fill(0);
  qEnterTime = Date.now();
  penaltyFraction = 0.3333;
  timeLimitMin = 60;
  quizEndTime = Date.now() + timeLimitMin*60000;
  view = "quiz";
  render();
}

function startQuiz(){
  const all = buildAll();
  let pool;
  let useWeighting = false;
  if(sourceMode==="fallos"){
    pool = all.filter(q=>failedIds.has(q.id));
    if(pool.length===0){ alert("Todavía no tienes preguntas falladas guardadas."); return; }
    useWeighting = true;
  } else if(sourceMode==="dudas"){
    pool = all.filter(q=>flaggedIds.has(q.id));
    if(pool.length===0){ alert("Todavía no tienes preguntas marcadas como duda."); return; }
    useWeighting = true;
  } else {
    pool = all.filter(q=>selectedTemas.has(q.tema));
    if(pool.length===0){ alert("Selecciona al menos un tema."); return; }
  }
  let n = Number(document.getElementById('numQ').value) || pool.length;
  n = Math.min(Math.max(n,1), pool.length);
  penaltyFraction = Number(document.getElementById('penaltySel').value) || 0;
  timeLimitMin = Number(document.getElementById('timeLimit').value) || 0;

  let chosen;
  if(useWeighting){
    chosen = weightedByFails(pool).slice(0,n);
  } else {
    chosen = stratifiedByTema(pool, n);
  }

  quizPool = shuffle(chosen).map(q=>{
    const idxs = shuffle(q.options.map((_,i)=>i));
    return {...q, options: idxs.map(i=>q.options[i]), correct: idxs.indexOf(q.correct)};
  });
  currentIndex = 0;
  answers = [];
  questionElapsed = new Array(quizPool.length).fill(0);
  qEnterTime = Date.now();
  quizEndTime = timeLimitMin>0 ? (Date.now() + timeLimitMin*60000) : null;
  view = "quiz";
  render();
}

function recordTimeSpent(){
  if(currentIndex>=0 && currentIndex<questionElapsed.length){
    questionElapsed[currentIndex] += Date.now()-qEnterTime;
  }
  qEnterTime = Date.now();
}

function startTimerIfNeeded(){
  clearInterval(timerInterval);
  if(view!=="quiz" || !quizEndTime) return;
  timerInterval = setInterval(()=>{
    const remain = quizEndTime - Date.now();
    const el = document.getElementById('timerDisplay');
    if(remain<=0){
      clearInterval(timerInterval);
      forceFinishByTime();
      return;
    }
    if(el){
      const m = Math.floor(remain/60000);
      const s = Math.floor((remain%60000)/1000);
      el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      el.classList.toggle('low', remain < 60000);
    }
  },500);
}

function forceFinishByTime(){
  for(let i=0;i<quizPool.length;i++){
    if(!answers[i]) answers[i] = {chosen:null};
  }
  finalizeQuiz();
}

async function finalizeQuiz(){
  clearInterval(timerInterval);
  recordTimeSpent();
  let correctCount = 0;
  quizPool.forEach((q,i)=>{
    const a = answers[i];
    if(!temaStats[q.tema]) temaStats[q.tema] = {attempts:0, correct:0};
    temaStats[q.tema].attempts++;
    if(!questionStats[q.id]) questionStats[q.id] = {attempts:0, correct:0, fails:0};
    questionStats[q.id].attempts++;
    if(a && a.chosen===q.correct){
      temaStats[q.tema].correct++;
      questionStats[q.id].correct++;
      failedIds.delete(q.id);
      correctCount++;
    } else {
      failedIds.add(q.id);
      questionStats[q.id].fails++;
    }
  });
  const total = quizPool.length;
  const pct = total>0 ? Math.round(correctCount/total*100) : 0;
  sessionsHistory.push({date: new Date().toISOString(), pct});
  if(sessionsHistory.length>30) sessionsHistory = sessionsHistory.slice(-30);
  totalTestsCompleted++;
  studyDates.add(new Date().toISOString().slice(0,10));
  await persistStats();
  await persistQuestionStats();
  await persistFailed();
  await persistSessions();
  await persistTotalTests();
  await persistStudyDates();
  const temasEnTest = [...new Set(quizPool.map(q=>q.tema))].sort((a,b)=>a-b);
  const failsPorTema = {};
  quizPool.forEach((q,i)=>{ const a=answers[i]; if(!a || a.chosen!==q.correct) failsPorTema[q.tema]=(failsPorTema[q.tema]||0)+1; });
  const temasFlojos = Object.entries(failsPorTema).sort((a,b)=>b[1]-a[1]).slice(0,5)
    .map(([t,n])=>`T${t} (${n} fallo${n===1?'':'s'})`).join(', ');
  sendLog('test_completado', {
    modo: sourceMode,
    modoExamen: examMode,
    temas: temasEnTest.join(', '),
    totalPreguntas: total,
    aciertos: correctCount,
    fallos: total - correctCount,
    porcentaje: pct,
    tiempoSegundos: questionElapsed.reduce((a,b)=>a+b,0),
    temasFlojos: temasFlojos
  });
  view = "results";
  render();
}

function exportFails(){
  const letters=["A","B","C","D"];
  let text = "Repaso de fallos - Test Cuerpo Administrativo\n" + new Date().toLocaleString() + "\n\n";
  answers.forEach((a,i)=>{
    const q = quizPool[i];
    if(a.chosen!==q.correct){
      text += `Tema ${q.tema} - ${TEMAS[q.tema]}\n`;
      text += q.question + "\n";
      q.options.forEach((opt,idx)=>{ text += `  ${letters[idx]}) ${opt}${idx===q.correct?'  <-- correcta':''}\n`; });
      text += `Tu respuesta: ${a.chosen===null?'sin responder':letters[a.chosen]}\n\n`;
    }
  });
  const blob = new Blob([text], {type:"text/plain;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = "fallos_test_oposicion.txt";
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

function handleImport(){
  const raw = document.getElementById('importArea').value.trim();
  const msg = document.getElementById('importMsg');
  if(!raw){ msg.textContent=""; return; }
  try{
    const parsed = JSON.parse(raw);
    if(!Array.isArray(parsed)) throw new Error("no es un array");
    let added = 0;
    parsed.forEach(item=>{
      if(Array.isArray(item) && item.length>=4 && typeof item[0]==="number" && typeof item[1]==="string" && Array.isArray(item[2]) && item[2].length===4 && typeof item[3]==="number"){
        customQuestions.push(item);
        added++;
      }
    });
    msg.textContent = `Se añadieron ${added} preguntas correctamente.`;
    msg.style.color = "var(--green)";
    persistCustom();
    document.getElementById('importArea').value = "";
    setTimeout(render, 900);
  }catch(e){
    msg.textContent = "El formato no es válido. Revisa el ejemplo de arriba.";
    msg.style.color = "var(--red)";
  }
}

window.addEventListener('beforeunload', (e)=>{
  if(view==="quiz"){ e.preventDefault(); e.returnValue=''; }
});

loadAll();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
