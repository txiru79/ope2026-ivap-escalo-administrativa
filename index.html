<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Cuerpo Administrativo - IVAP</title>
<style>
  :root{
    --ink:#1b2430; --paper:#f7f5f0; --card:#ffffff; --line:#dcd6c8;
    --green:#2f5d4f; --green-dark:#1f3f36; --red:#8a2b2b; --gold:#a3742b; --muted:#6b6459;
    --shadow: 0 1px 2px rgba(27,36,48,.06), 0 6px 20px rgba(27,36,48,.06);
  }
  body.dark{
    --ink:#eae5da; --paper:#171b1f; --card:#20262c; --line:#343c42;
    --green:#5fae95; --green-dark:#8fd3bd; --red:#e08787; --gold:#d9ac5f; --muted:#93968f;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s;}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px;}
  header.app{display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:22px;gap:10px;}
  header.app h1{font-size:1.3rem;letter-spacing:.02em;margin:0;font-weight:700;}
  header.app .tag{font-family:ui-monospace,Menlo,monospace;font-size:.72rem;color:var(--muted);letter-spacing:.06em;white-space:nowrap;}
  .headerRight{display:flex;align-items:center;gap:10px;}
  .iconBtn{border:1px solid var(--line);background:var(--card);border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:.95rem;line-height:1;color:var(--ink);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);padding:22px;margin-bottom:18px;}
  h2.section{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--gold);margin:0 0 14px;font-family:ui-monospace,Menlo,monospace;border-bottom:1px solid var(--line);padding-bottom:8px;}
  .btn{font-family:ui-monospace,Menlo,monospace;font-size:.85rem;letter-spacing:.03em;border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:2px;cursor:pointer;}
  .btn.secondary{background:transparent;color:var(--ink);}
  .btn.wide{width:100%;}
  .btn:disabled{opacity:.4;cursor:default;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .num-input,select.field{width:100px;padding:9px;font-family:ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:2px;font-size:.9rem;background:var(--card);color:var(--ink);}
  select.field{width:auto;}
  .tema-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:.86rem;max-height:300px;overflow-y:auto;padding-right:4px;}
  @media (max-width:560px){.tema-grid{grid-template-columns:1fr;}}
  .tema-item{display:flex;align-items:flex-start;gap:8px;line-height:1.3;padding:4px 0;border-bottom:1px dashed var(--line);}
  .tema-item input{margin-top:4px;flex-shrink:0;}
  .tema-actions{display:flex;gap:14px;margin:10px 0 14px;font-size:.8rem;}
  .tema-actions a,.link-btn{color:var(--green);cursor:pointer;text-decoration:underline;background:none;border:none;font-size:.85rem;padding:0;font-family:inherit;}
  .progress-bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px;}
  .progress-fill{height:100%;background:var(--green);transition:width .25s ease;}
  .qmeta{font-family:ui-monospace,Menlo,monospace;font-size:.72rem;color:var(--muted);letter-spacing:.05em;margin-bottom:10px;text-transform:uppercase;display:flex;justify-content:space-between;}
  .qtext{font-size:1.12rem;line-height:1.5;margin:0 0 20px;}
  .option{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:3px;padding:13px 14px;margin-bottom:10px;cursor:pointer;font-size:.98rem;line-height:1.4;background:var(--card);transition:border-color .15s,background .15s;}
  .option:hover{border-color:var(--green);}
  .option .letter{font-family:ui-monospace,Menlo,monospace;font-weight:700;color:var(--gold);flex-shrink:0;}
  .option.correct{border-color:var(--green);background:rgba(47,93,79,.12);}
  .option.correct .letter{color:var(--green);}
  .option.wrong{border-color:var(--red);background:rgba(138,43,43,.12);}
  .option.wrong .letter{color:var(--red);}
  .option.disabled{cursor:default;}
  .feedback{margin-top:6px;padding:12px 14px;border-radius:3px;font-size:.88rem;line-height:1.5;}
  .feedback.ok{background:rgba(47,93,79,.12);border:1px solid var(--green);color:var(--green-dark);}
  .feedback.no{background:rgba(138,43,43,.12);border:1px solid var(--red);color:var(--red);}
  .footer-nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px;}
  .score-big{font-size:2.6rem;font-weight:700;font-family:ui-monospace,Menlo,monospace;}
  .tema-result{display:flex;justify-content:space-between;font-size:.85rem;padding:7px 0;border-bottom:1px dashed var(--line);}
  .badge{font-family:ui-monospace,Menlo,monospace;font-size:.72rem;padding:2px 7px;border-radius:10px;background:var(--line);color:var(--ink);}
  textarea{width:100%;min-height:140px;font-family:ui-monospace,Menlo,monospace;font-size:.82rem;border:1px solid var(--line);border-radius:3px;padding:10px;background:var(--card);color:var(--ink);}
  .small{font-size:.82rem;color:var(--muted);line-height:1.5;}
  .flag{display:inline-block;width:14px;height:14px;border-radius:50%;background:conic-gradient(from 0deg,#d52b1e 0 25%,#eab308 25% 40%,#2f5d4f 40% 100%);margin-right:8px;vertical-align:-2px;}
  .radioRow{display:flex;gap:16px;font-size:.88rem;margin:6px 0;flex-wrap:wrap;}
  .radioRow label{display:flex;gap:6px;align-items:center;cursor:pointer;}
  .statBar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;flex:1;margin:0 10px;}
  .statBar > div{height:100%;background:var(--green);}
  .statRow{display:flex;align-items:center;font-size:.82rem;padding:8px 0;border-bottom:1px dashed var(--line);}
  .statRow .name{width:160px;flex-shrink:0;}
  .statRow .pct{width:44px;text-align:right;font-family:ui-monospace,Menlo,monospace;flex-shrink:0;}
  .timerBox{font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:.95rem;padding:4px 10px;border:1px solid var(--line);border-radius:3px;}
  .timerBox.low{color:var(--red);border-color:var(--red);}

  /* Splash screen */
  .splash{
    position:fixed; inset:0; z-index:50;
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    background: radial-gradient(ellipse at 50% 30%, rgba(163,116,43,.10), transparent 60%), var(--paper);
    cursor:pointer; text-align:center; padding:24px;
  }
  .splash-flag{width:34px;height:34px;border-radius:50%;background:conic-gradient(from 0deg,#d52b1e 0 25%,#eab308 25% 40%,#2f5d4f 40% 100%);margin-bottom:26px;box-shadow:0 4px 18px rgba(0,0,0,.15);}
  .splash-title{
    font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;
    font-weight:700; letter-spacing:.02em; color:var(--ink);
    font-size:clamp(2.4rem, 9vw, 4.2rem); line-height:1.05; margin:0;
  }
  .splash-subtitle{
    font-family: ui-monospace, Menlo, monospace;
    text-transform:uppercase; letter-spacing:.22em; color:var(--gold);
    font-size:clamp(.9rem, 3vw, 1.15rem); margin:18px 0 0;
  }
  .splash-rule{width:64px;height:2px;background:var(--ink);margin:26px 0;opacity:.5;}
  .splash-hint{font-family:ui-monospace,Menlo,monospace;font-size:.72rem;color:var(--muted);letter-spacing:.08em;margin-top:40px;animation:splashPulse 2s ease-in-out infinite;}
  @keyframes splashPulse{0%,100%{opacity:.4;}50%{opacity:1;}}
  .splash-credit{
    position:fixed; bottom:22px; right:26px; z-index:51;
    font-family:ui-monospace,Menlo,monospace; letter-spacing:.05em;
    font-size:.8rem; color:var(--ink); opacity:.75;
    padding:6px 12px; border:1px solid var(--line); border-radius:3px; background:var(--card);
  }
</style>
</head>

/* ============ STORAGE (window.storage con fallback a localStorage) ============ */
async function storageGet(key){
  try{ if(window.storage){ const r = await window.storage.get(key); return r ? r.value : null; } }catch(e){}
  try{ return localStorage.getItem(key); }catch(e){}
  return null;
}
async function storageSet(key,value){
  try{ if(window.storage){ await window.storage.set(key,value); return; } }catch(e){}
  try{ localStorage.setItem(key,value); }catch(e){}
}

let temaStats = {}; // {tema: {attempts, correct}}
let darkMode = false;
let selectedTemas = new Set(Object.keys(TEMAS).map(Number));
let quizPool = [];
let currentIndex = 0;
let answers = [];

let penaltyFraction = 0; // 0, 1/3, 1/4
let timeLimitMin = 0;

function buildAll(){
  const out=[];
  QUESTIONS.forEach((q,i)=> out.push({id:'b'+i, tema:q[0], question:q[1], options:q[2], correct:q[3], explanation:q[4]||null}));
  customQuestions.forEach((q,i)=> out.push({id:'c'+i, tema:q[0], question:q[1], options:q[2], correct:q[3], explanation:q[4]||null}));
  return out;
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

async function loadAll(){
  try{ const c = await storageGet('custom_questions'); if(c) customQuestions = JSON.parse(c); }catch(e){}
  try{ const f = await storageGet('failed_ids'); if(f) failedIds = new Set(JSON.parse(f)); }catch(e){}
  try{ const s = await storageGet('tema_stats'); if(s) temaStats = JSON.parse(s); }catch(e){}
  try{ const d = await storageGet('dark_mode'); if(d) darkMode = d === '1'; }catch(e){}
  applyDarkMode();
  render();
}
function applyDarkMode(){ document.body.classList.toggle('dark', darkMode); }

async function persistFailed(){ await storageSet('failed_ids', JSON.stringify(Array.from(failedIds))); }
async function persistStats(){ await storageSet('tema_stats', JSON.stringify(temaStats)); }
async function persistCustom(){ await storageSet('custom_questions', JSON.stringify(customQuestions)); }
async function persistDark(){ await storageSet('dark_mode', darkMode ? '1':'0'); }

function render(){
  const app = document.getElementById('app');
  if(view==="splash") app.innerHTML = renderSplash();
  else if(view==="home") app.innerHTML = renderHome();
  else if(view==="quiz") app.innerHTML = renderQuiz();
  else if(view==="results") app.innerHTML = renderResults();
  else if(view==="import") app.innerHTML = renderImport();
  else if(view==="stats") app.innerHTML = renderStats();
  attachHandlers();
  startTimerIfNeeded();
}

function allQuestions_count(){ return QUESTIONS.length + customQuestions.length; }

function renderQuiz(){
  const q = quizPool[currentIndex];
  const answered = answers[currentIndex];
  const progressPct = Math.round((currentIndex/quizPool.length)*100);
  const letters = ["A","B","C","D"];

  const optionsHtml = q.options.map((opt,i)=>{
    let cls = "option";
    if(answered){
      cls += " disabled";
      if(i===q.correct) cls += " correct";
      else if(i===answered.chosen) cls += " wrong";
    }
    return `<div class="${cls}" data-opt="${i}"><span class="letter">${letters[i]}</span><span>${opt}</span></div>`;
  }).join("");

  let feedback = "";
  if(answered){
    if(answered.chosen === q.correct){
      feedback = `<div class="feedback ok">Correcto.</div>`;
    } else if(answered.chosen === null){
      feedback = `<div class="feedback no">Sin responder. La correcta es la <b>${letters[q.correct]}</b>.</div>`;
    } else {
      feedback = `<div class="feedback no">Incorrecto. La respuesta correcta es la <b>${letters[q.correct]}</b>.</div>`;
    }
    if(q.explanation){
      feedback += `<div class="small" style="margin-top:6px;">${q.explanation}</div>`;
    }
  }

  const timerHtml = quizEndTime ? `<div id="timerDisplay" class="timerBox">--:--</div>` : "";

  return `
  <header class="app">
    <h1>Test en curso</h1>
    <div class="headerRight">
      ${timerHtml}
      <div class="tag">${currentIndex+1} / ${quizPool.length}</div>
    </div>
  </header>
  <div class="progress-bar"><div class="progress-fill" style="width:${progressPct}%"></div></div>
  <div class="card">
    <div class="qmeta"><span>Tema ${q.tema} · ${TEMAS[q.tema]||''}</span></div>
    <p class="qtext">${q.question}</p>
    ${optionsHtml}
    ${feedback}
  </div>
  <div class="footer-nav">
    <button class="btn secondary" id="quitBtn">Salir</button>
    <button class="btn" id="nextBtn" ${answered?'':'disabled'}>${currentIndex===quizPool.length-1?'Ver resultados':'Siguiente'}</button>
  </div>
  `;
}

function renderResults(){
  const total = quizPool.length;
  let correctCount=0, wrongCount=0, blankCount=0, netScore=0;
  answers.forEach((a,i)=>{
    const q = quizPool[i];
    if(a.chosen===null){ blankCount++; }
    else if(a.chosen===q.correct){ correctCount++; netScore += 1; }
    else{ wrongCount++; netScore -= penaltyFraction; }
  });
  const notaSobre10 = (netScore/total*10).toFixed(2);

  const byTema = {};
  answers.forEach((a,i)=>{
    const q = quizPool[i];
    if(!byTema[q.tema]) byTema[q.tema] = {ok:0,total:0};
    byTema[q.tema].total++;
    if(a.chosen===q.correct) byTema[q.tema].ok++;
  });
  const temaRows = Object.entries(byTema).sort((a,b)=>a[0]-b[0]).map(([tema,v])=>{
    return `<div class="tema-result"><span>Tema ${tema} · ${TEMAS[tema]}</span><span class="badge">${v.ok}/${v.total}</span></div>`;
  }).join("");

  const wrongList = answers.map((a,i)=>({a,q:quizPool[i]})).filter(x=>x.a.chosen!==x.q.correct).map(({a,q})=>{
    const letters=["A","B","C","D"];
    const tuResp = a.chosen===null ? "sin responder" : `${letters[a.chosen]}) ${q.options[a.chosen]}`;
    return `<div class="card" style="padding:16px;">
      <div class="qmeta">Tema ${q.tema}</div>
      <p style="margin:0 0 8px;font-size:.95rem;">${q.question}</p>
      <p class="small" style="margin:0;">Tu respuesta: ${tuResp}<br>Correcta: ${letters[q.correct]}) ${q.options[q.correct]}</p>
    </div>`;
  }).join("");

  return `
  ${headerHtml("Resultados", total + " preguntas")}
  <div class="card" style="text-align:center;">
    <div class="score-big">${correctCount}/${total}</div>
    <div class="small" style="margin-top:6px;">${correctCount} aciertos · ${wrongCount} fallos · ${blankCount} en blanco</div>
    ${penaltyFraction>0 ? `<div class="small" style="margin-top:10px;">Nota con penalización: <b>${netScore.toFixed(2)}</b> puntos (${notaSobre10} sobre 10)</div>` : ""}
  </div>
  <div class="card">
    <h2 class="section">Resultado por tema</h2>
    ${temaRows}
  </div>
  ${wrongList ? `<h2 class="section" style="margin:20px 0 12px;">Repaso de fallos</h2>${wrongList}` : `<p class="small">¡Sin fallos! Buen trabajo.</p>`}
  <div class="row" style="margin-top:16px;">
    <button class="btn wide" id="backHome">Volver al inicio</button>
    ${wrongCount>0 ? `<button class="btn secondary wide" id="exportFails">Exportar fallos (.txt)</button>` : ""}
  </div>
  `;
}

function renderStats(){
  const rows = Object.entries(TEMAS).map(([num,name])=>{
    const st = temaStats[num] || {attempts:0, correct:0};
    const pct = st.attempts>0 ? Math.round(st.correct/st.attempts*100) : null;
    return {num,name,attempts:st.attempts,correct:st.correct,pct};
  }).sort((a,b)=>{
    if(a.pct===null && b.pct===null) return a.num-b.num;
    if(a.pct===null) return 1;
    if(b.pct===null) return -1;
    return a.pct-b.pct;
  });

  const rowsHtml = rows.map(r=>{
    const pctDisplay = r.pct===null ? "—" : r.pct+"%";
    const barWidth = r.pct===null ? 0 : r.pct;
    return `<div class="statRow">
      <span class="name">T${r.num} · ${r.name}</span>
      <div class="statBar"><div style="width:${barWidth}%"></div></div>
      <span class="pct">${pctDisplay}</span>
    </div>`;
  }).join("");

  return `
  ${headerHtml("Estadísticas", "por tema")}
  <div class="card">
    <p class="small">Acumulado de todas tus sesiones de test, ordenado de peor a mejor % de acierto, para ver de un vistazo qué temas tienes más flojos.</p>
    ${rowsHtml}
  </div>
  <div class="row">
    <button class="btn wide" id="backHome3">Volver al inicio</button>
    <button class="link-btn" id="resetStats">Reiniciar estadísticas</button>
  </div>
  `;
}

  return `

  <div class="card">
    <p class="small">Pega aquí un array JSON con tus preguntas: tema, pregunta, 4 opciones, índice 0-3 de la correcta (y opcionalmente una breve explicación que tú mismo hayas verificado):</p>
    <pre class="small" style="background:var(--paper);padding:10px;border-radius:3px;overflow-x:auto;">[[1,"¿Pregunta?",["Op A","Op B","Op C","Op D"],0,"Explicación opcional"]]</pre>
    <textarea id="importArea" placeholder="Pega tu JSON aquí..."></textarea>
    <div id="importMsg" class="small" style="margin-top:8px;"></div>
    <div class="row" style="margin-top:14px;">
      <button class="btn" id="importBtn">Añadir al banco</button>
      <button class="btn secondary" id="backHome2">Volver</button>
    </div>
  </div>
  <div class="card">
    <p class="small">Tienes actualmente <b>${customQuestions.length}</b> preguntas propias guardadas. Pídeme en el chat más preguntas de un tema concreto y te las paso en este formato.</p>
    ${customQuestions.length ? `<button class="link-btn" id="clearCustom">Borrar todas mis preguntas añadidas</button>` : ""}
  </div>
  `;
}

/* ============ HANDLERS ============ */
function attachHandlers(){
  const splash = document.getElementById('splashScreen');
  if(splash) splash.onclick = ()=>{ view="home"; render(); };

  const dt = document.getElementById('darkToggle');
  if(dt) dt.onclick = async ()=>{ darkMode=!darkMode; applyDarkMode(); await persistDark(); render(); };

  if(view==="home"){
    document.querySelectorAll('[data-tema]').forEach(cb=>{
      cb.addEventListener('change',e=>{
        const n = Number(e.target.dataset.tema);
        if(e.target.checked) selectedTemas.add(n); else selectedTemas.delete(n);
        updateMaxAvail();
      });
    });
    document.querySelectorAll('input[name="srcMode"]').forEach(r=>{
      r.addEventListener('change', e=>{ sourceMode = e.target.value; render(); });
    });
    document.getElementById('selAll').onclick=()=>{selectedTemas=new Set(Object.keys(TEMAS).map(Number));render();};
    document.getElementById('selNone').onclick=()=>{selectedTemas=new Set();render();};
    document.getElementById('startBtn').onclick=startQuiz;
    document.getElementById('goImport').onclick=()=>{view="import";render();};
    document.getElementById('goStats').onclick=()=>{view="stats";render();};
    updateMaxAvail();
  } else if(view==="quiz"){
    document.querySelectorAll('.option').forEach(el=>{
      el.addEventListener('click',()=>{
        if(answers[currentIndex]) return;
        const chosen = Number(el.dataset.opt);
        answers[currentIndex] = {chosen};
        render();
      });
    });
    document.getElementById('quitBtn').onclick=()=>{ clearInterval(timerInterval); view="home"; render(); };
    const nb = document.getElementById('nextBtn');
    if(nb) nb.onclick=()=>{
      if(currentIndex===quizPool.length-1){ finalizeQuiz(); }
      else{ currentIndex++; render(); }
    };
  } else if(view==="results"){
    document.getElementById('backHome').onclick=()=>{view="home";render();};
    const exp = document.getElementById('exportFails');
    if(exp) exp.onclick = exportFails;
  } else if(view==="import"){
    document.getElementById('importBtn').onclick=handleImport;
    document.getElementById('backHome2').onclick=()=>{view="home";render();};
    const clr = document.getElementById('clearCustom');
    if(clr) clr.onclick=async ()=>{ customQuestions=[]; await persistCustom(); render(); };
  } else if(view==="stats"){
    document.getElementById('backHome3').onclick=()=>{view="home";render();};
    document.getElementById('resetStats').onclick=async ()=>{
      if(confirm("¿Reiniciar todo el historial de estadísticas por tema?")){
        temaStats = {}; await persistStats(); render();
      }
    };
  }
}

function updateMaxAvail(){
  const avail = buildAll().filter(q=>selectedTemas.has(q.tema)).length;
  const maxEl = document.getElementById('maxAvail');
  const numQ = document.getElementById('numQ');
  if(maxEl) maxEl.textContent = avail;
  if(numQ) numQ.max = Math.max(1,avail);
}

function startQuiz(){
  const all = buildAll();
  let pool;
  if(sourceMode==="fallos"){
    pool = all.filter(q=>failedIds.has(q.id));
    if(pool.length===0){ alert("Todavía no tienes preguntas falladas guardadas."); return; }
  } else {
    pool = all.filter(q=>selectedTemas.has(q.tema));
    if(pool.length===0){ alert("Selecciona al menos un tema."); return; }
  }
  let n = Number(document.getElementById('numQ').value) || pool.length;
  n = Math.min(Math.max(n,1), pool.length);
  penaltyFraction = Number(document.getElementById('penaltySel').value) || 0;
  timeLimitMin = Number(document.getElementById('timeLimit').value) || 0;

  quizPool = shuffle(pool).slice(0,n);
  currentIndex = 0;
  answers = [];
  quizEndTime = timeLimitMin>0 ? (Date.now() + timeLimitMin*60000) : null;
  view = "quiz";
  render();
}

function startTimerIfNeeded(){
  clearInterval(timerInterval);
  if(view!=="quiz" || !quizEndTime) return;
  timerInterval = setInterval(()=>{
    const remain = quizEndTime - Date.now();
    const el = document.getElementById('timerDisplay');
    if(remain<=0){
      clearInterval(timerInterval);
      forceFinishByTime();
      return;
    }
    if(el){
      const m = Math.floor(remain/60000);
      const s = Math.floor((remain%60000)/1000);
      el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      el.classList.toggle('low', remain < 60000);
    }
  },500);
}

function forceFinishByTime(){
  for(let i=0;i<quizPool.length;i++){
    if(!answers[i]) answers[i] = {chosen:null};
  }
  finalizeQuiz();
}

async function finalizeQuiz(){
  clearInterval(timerInterval);
  quizPool.forEach((q,i)=>{
    const a = answers[i];
    if(!temaStats[q.tema]) temaStats[q.tema] = {attempts:0, correct:0};
    temaStats[q.tema].attempts++;
    if(a && a.chosen===q.correct){
      temaStats[q.tema].correct++;
      failedIds.delete(q.id);
    } else {
      failedIds.add(q.id);
    }
  });
  await persistStats();
  await persistFailed();
  view = "results";
  render();
}

function exportFails(){
  const letters=["A","B","C","D"];
  let text = "Repaso de fallos - Test Cuerpo Administrativo\n" + new Date().toLocaleString() + "\n\n";
  answers.forEach((a,i)=>{
    const q = quizPool[i];
    if(a.chosen!==q.correct){
      text += `Tema ${q.tema} - ${TEMAS[q.tema]}\n`;
      text += q.question + "\n";
      q.options.forEach((opt,idx)=>{ text += `  ${letters[idx]}) ${opt}${idx===q.correct?'  <-- correcta':''}\n`; });
      text += `Tu respuesta: ${a.chosen===null?'sin responder':letters[a.chosen]}\n\n`;
    }
  });
  const blob = new Blob([text], {type:"text/plain;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = "fallos_test_oposicion.txt";
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

function handleImport(){
  const raw = document.getElementById('importArea').value.trim();
  const msg = document.getElementById('importMsg');
  if(!raw){ msg.textContent=""; return; }
  try{
    const parsed = JSON.parse(raw);
    if(!Array.isArray(parsed)) throw new Error("no es un array");
    let added = 0;
    parsed.forEach(item=>{
      if(Array.isArray(item) && item.length>=4 && typeof item[0]==="number" && typeof item[1]==="string" && Array.isArray(item[2]) && item[2].length===4 && typeof item[3]==="number"){
        customQuestions.push(item);
        added++;
      }
    });
    msg.textContent = `Se añadieron ${added} preguntas correctamente.`;
    msg.style.color = "var(--green)";
    persistCustom();
    document.getElementById('importArea').value = "";
    setTimeout(render, 900);
  }catch(e){
    msg.textContent = "El formato no es válido. Revisa el ejemplo de arriba.";
    msg.style.color = "var(--red)";
  }
}

loadAll();
</script>
