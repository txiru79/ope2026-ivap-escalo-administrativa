[34, "La acción de responsabilidad patrimonial contra la Administración debe dirigirse, con carácter general:", ["Ante el Defensor del Pueblo exclusivamente", "Directamente ante los tribunales sin trámite administrativo previo", "Ante la propia Administración presuntamente responsable, en vía administrativa previa", "Ante el Tribunal Constitucional en todo caso"], 2, "Con carácter general, la vía administrativa (reclamación previa) es necesaria antes de acudir, en su caso, a la vía contencioso-administrativa."],
[34, "El nexo causal en la responsabilidad patrimonial de la Administración exige:", ["Que el daño sea consecuencia del funcionamiento normal o anormal de un servicio público", "Que exista siempre intención dolosa del empleado público", "Que el daño se produzca fuera del territorio nacional", "Que el perjudicado sea funcionario público"], 0, "La responsabilidad patrimonial no exige culpa del agente, sino un nexo causal entre el funcionamiento del servicio y el daño producido."],
[34, "Los daños derivados de fuerza mayor, en materia de responsabilidad patrimonial de la Administración:", ["Con carácter general, no generan responsabilidad de la Administración", "Solo generan responsabilidad si hay culpa del funcionario", "Siempre generan responsabilidad objetiva de la Administración", "Nunca eximen a la Administración de cualquier tipo de responsabilidad"], 0, "La fuerza mayor es una causa de exclusión de la responsabilidad patrimonial, a diferencia del caso fortuito, que sí puede generar responsabilidad."],
[34, "La responsabilidad de las autoridades y personal al servicio de las Administraciones Públicas frente a la propia Administración se denomina:", ["Responsabilidad patrimonial de las autoridades y personal por dolo, culpa o negligencia grave", "Responsabilidad civil frente a terceros directamente", "Responsabilidad objetiva absoluta sin excepciones", "Responsabilidad penal exclusiva"], 0, "Cuando la Administración indemniza a un tercero, puede repetir contra la autoridad o empleado responsable si hubo dolo, culpa o negligencia grave."],
[34, "El plazo para reclamar la responsabilidad patrimonial derivada de daños de carácter físico o psíquico a las personas comienza a computarse:", ["Desde la curación o la determinación del alcance de las secuelas", "Desde la jubilación del perjudicado", "Desde la finalización del ejercicio presupuestario", "Siempre desde la fecha exacta del hecho causante, sin excepción"], 0, "En daños personales de carácter continuado, el plazo de prescripción se computa desde la curación o la determinación del alcance de las secuelas, no desde el hecho inicial."],
[34, "La responsabilidad patrimonial derivada de la anulación de actos o disposiciones administrativas:", ["Solo puede reclamarse ante el Tribunal Constitucional", "No presupone, por sí sola, derecho a indemnización", "Excluye siempre cualquier posible indemnización", "Genera automáticamente derecho a indemnización en todo caso"], 1, "La mera anulación de un acto no genera automáticamente responsabilidad patrimonial; deben concurrir el resto de requisitos (daño efectivo, nexo causal, etc.)."],
[31, "La comparecencia de un interesado en un procedimiento administrativo puede realizarse:", ["Por sí mismo o mediante representante", "Solo si lo autoriza expresamente un juez", "Nunca de forma electrónica", "Únicamente mediante abogado colegiado"], 0, "El interesado puede actuar por sí mismo o valerse de representante, salvo que la ley exija su intervención personal."],
[31, "La actuación de oficio del procedimiento administrativo se caracteriza por:", ["No poder finalizar nunca en una resolución", "Iniciarse por la propia Administración, sin necesidad de solicitud del interesado", "Estar reservada a los procedimientos sancionadores exclusivamente", "Requerir siempre solicitud previa de un particular"], 1, "El procedimiento de oficio se inicia por acuerdo del órgano competente, por propia iniciativa o como consecuencia de orden superior, petición razonada o denuncia."],
[31, "El principio de buena fe y confianza legítima en las relaciones de la ciudadanía con la Administración implica:", ["Que solo se aplica en el ámbito contractual privado", "Que la actuación administrativa debe ser coherente y previsible, sin generar expectativas defraudadas injustificadamente", "Que el ciudadano no tiene ningún derecho frente a cambios de criterio", "Que la Administración puede actuar arbitrariamente en cualquier momento"], 1, "Es un principio general de actuación administrativa, expresamente recogido en el artículo 3 de la Ley 40/2015."],
[2, "El principio dispositivo en el acceso a la autonomía de las Comunidades Autónomas implica que:", ["No existió ningún proceso de decisión territorial", "Solo el Congreso de los Diputados podía decidir qué territorios serían autónomos", "El Estado impuso unilateralmente la creación de cada Comunidad Autónoma", "Fueron los propios territorios quienes decidieron constituirse en Comunidad Autónoma"], 3, "El artículo 2 CE reconoce el derecho a la autonomía, pero su ejercicio dependió de la iniciativa de los propios territorios (principio dispositivo)."],
[2, "El Tribunal Constitucional resuelve, entre otros, los conflictos de competencias que se susciten entre:", ["Los particulares en materia civil", "Los ayuntamientos y las diputaciones exclusivamente", "Los sindicatos y las patronales", "El Estado y las Comunidades Autónomas, o de estas entre sí"], 3, "Uno de los cometidos esenciales del Tribunal Constitucional es resolver los conflictos de competencias territoriales."],
[3, "El procedimiento legislativo ordinario de la Unión Europea implica la participación conjunta de:", ["El Parlamento Europeo y el Consejo de la Unión Europea", "Exclusivamente el Tribunal de Justicia", "Solo el Consejo Europeo", "Únicamente la Comisión Europea"], 0, "Es el procedimiento habitual de aprobación de reglamentos y directivas, con codecisión de Parlamento y Consejo, a propuesta de la Comisión."],
[4, "Las leyes aprobadas por el Parlamento Vasco reciben la denominación de:", ["Reglamentos autonómicos", "Órdenes departamentales", "Leyes del Parlamento Vasco", "Decretos Legislativos exclusivamente"], 2, "El Parlamento Vasco, como órgano legislativo, aprueba leyes propiamente dichas dentro de su ámbito competencial."],
[4, "La moción de censura al Lehendakari, conforme al sistema parlamentario vasco, debe ser:", ["Aprobada por el Gobierno del Estado", "Constructiva, incluyendo un candidato alternativo", "Simple, sin necesidad de proponer alternativa", "Convocada mediante referéndum popular"], 1, "Al igual que en el sistema estatal, la moción de censura en el sistema vasco es de carácter constructivo."],
[7, "La sede electrónica asociada de un organismo público permite:", ["Prescindir de cualquier medida de seguridad", "Que varios órganos compartan una misma sede electrónica común", "Sustituir por completo el registro electrónico general", "Eliminar la necesidad de identificación electrónica"], 1, "Permite que distintos órganos o entidades compartan infraestructura y presencia electrónica común, optimizando recursos."],
[7, "El principio de neutralidad tecnológica en la Administración electrónica implica que:", ["La ciudadanía no debe verse obligada a utilizar una aplicación o sistema propietario específico", "Debe imponerse siempre un único sistema operativo", "Es incompatible con el uso de estándares abiertos", "Solo se admiten formatos de código cerrado"], 0, "Este principio busca garantizar la libertad de elección tecnológica de la ciudadanía en sus relaciones electrónicas con la Administración."],
[8, "El euskera batua es:", ["Una variante exclusiva del ámbito judicial", "Una lengua distinta del euskera", "La variante estandarizada del euskera adoptada como referencia normativa", "Un dialecto exclusivamente hablado en Francia"], 2, "El euskera batua es la forma unificada y estandarizada del euskera, promovida por Euskaltzaindia desde finales de los años 60."],
[8, "Euskaltzaindia es la institución encargada de:", ["La normativización y regulación académica de la lengua vasca", "La gestión de las bibliotecas públicas vascas", "La organización de los procesos selectivos de empleo público", "La recaudación de tributos forales"], 0, "Es la Real Academia de la Lengua Vasca, responsable de la codificación normativa del euskera."],
[11, "Los equipos de protección individual (EPI) deben utilizarse, conforme a la normativa preventiva:", ["Cuando los riesgos no puedan evitarse o limitarse suficientemente por medios de protección colectiva", "Únicamente si el trabajador lo solicita voluntariamente", "Como primera y única medida preventiva, sin adoptar otras", "Nunca en el ámbito de la Administración Pública"], 0, "La jerarquía de medidas preventivas prioriza la protección colectiva; los EPI se usan cuando esta no es suficiente."],
[12, "El deslumbramiento en el trabajo con pantallas de visualización puede prevenirse, entre otras medidas, mediante:", ["La correcta orientación de la pantalla respecto a las fuentes de luz", "La eliminación de cualquier fuente de luz natural", "El aumento máximo del brillo de la pantalla", "El uso continuado sin pausas"], 0, "Orientar adecuadamente la pantalla respecto a ventanas y luminarias reduce los reflejos y el deslumbramiento."],
[13, "Ante una persona con signos de atragantamiento que no puede toser ni hablar, la maniobra recomendada es:", ["La maniobra de Heimlich (compresiones abdominales)", "Esperar sin intervenir a que se resuelva solo", "Darle agua para facilitar la deglución", "Golpear únicamente en el pecho"], 0, "La maniobra de Heimlich es la técnica de primeros auxilios recomendada ante obstrucción completa de la vía aérea."],
[13, "En caso de quemadura leve, la actuación de primeros auxilios recomendada incluye:", ["Aplicar pasta de dientes o remedios caseros similares", "Reventar cualquier ampolla que se forme", "Enfriar la zona con agua a temperatura ambiente durante varios minutos", "Aplicar hielo directamente sobre la quemadura"], 2, "El enfriamiento con agua templada (no helada) es la medida de primeros auxilios recomendada ante quemaduras leves."],
[14, "El principio de rendición de cuentas, dentro del gobierno abierto, implica que:", ["Los responsables públicos deben responder de sus decisiones y resultados ante la ciudadanía", "Se limita exclusivamente al ámbito presupuestario", "No existe obligación de justificar decisiones públicas", "Solo los tribunales pueden exigir explicaciones a la Administración"], 0, "Es uno de los tres pilares clásicos del gobierno abierto junto con la transparencia y la participación ciudadana."],
[16, "Las tasas, como categoría de ingreso público, se caracterizan por:", ["Retribuir la prestación de un servicio público o la realización de una actividad administrativa que beneficia al obligado", "Aplicarse exclusivamente a empresas privadas", "No tener relación alguna con ningún servicio prestado", "Ser siempre de carácter voluntario sin contraprestación"], 0, "Las tasas se vinculan a la prestación de un servicio o actividad administrativa concreta que beneficia al sujeto obligado a pagarlas."],
[17, "Un puesto de trabajo singularizado, en el marco de la RPT, se caracteriza por:", ["No requerir ninguna adscripción a cuerpo o escala", "Ser siempre de libre designación", "Estar excluido de la relación de puestos de trabajo", "Tener características específicas que lo diferencian del resto de puestos base del mismo cuerpo o escala"], 3, "Los puestos singularizados presentan funciones o requisitos específicos, a diferencia de los puestos base o genéricos."],
[19, "Los metadatos de un documento electrónico de archivo permiten, entre otras funciones:", ["Cifrar el documento de forma permanente", "Describir el contexto, contenido y estructura del documento para su gestión y recuperación", "Sustituir el contenido del propio documento", "Eliminar la necesidad de un sistema de gestión documental"], 1, "Los metadatos son datos estructurados sobre el documento que facilitan su identificación, gestión y recuperación en el tiempo."],
[20, "Un registro electrónico general puede rechazar la entrada de un documento cuando:", ["Contenga código malicioso o un formato no admitido por la sede electrónica", "Se presente fuera del horario de atención presencial", "El documento esté dirigido a otra Administración distinta", "El interesado se identifique mediante certificado electrónico"], 0, "El rechazo de documentos en el registro electrónico está tasado legalmente, entre otros supuestos, a los documentos con código malicioso o formato no admitido."],
[21, "La expedición de una copia auténtica de un documento administrativo en soporte papel a partir de un documento electrónico exige, entre otros requisitos:", ["Que el documento pierda su validez jurídica", "Que se elimine el documento electrónico original", "Que quede constancia de su carácter de copia mediante la diligencia correspondiente", "Que se solicite ante notario en todo caso"], 2, "Las copias auténticas deben incluir la diligencia que acredite su condición de copia y su correspondencia con el original."],
[23, "El derecho a obtener información y orientación sobre los requisitos jurídicos o técnicos de un proyecto se recoge, conforme a la LPAC, como:", ["Un derecho condicionado al pago de una tasa previa", "Un privilegio exclusivo de las grandes empresas", "Un derecho exclusivo de los profesionales colegiados", "Un derecho de la ciudadanía en sus relaciones con las Administraciones Públicas"], 3, "El artículo 13 LPAC recoge este derecho entre los derechos generales de las personas en sus relaciones con la Administración."],
[23, "El derecho a ser tratado con respeto y deferencia por las autoridades y empleados públicos forma parte de:", ["Un privilegio exclusivo de los cargos electos", "Los derechos generales de la ciudadanía frente a la Administración", "Un derecho condicionado a la nacionalidad española", "Un derecho exclusivo en vía judicial"], 1, "Es uno de los derechos generales recogidos en el artículo 13 LPAC, aplicable a cualquier persona en sus relaciones con la Administración."],
[25, "El uso de mayúsculas sostenidas en un documento administrativo escrito debe, como buena práctica de estilo:", ["Aplicarse a la totalidad del texto del documento", "Sustituir siempre a la negrita y la cursiva", "Limitarse a casos concretos, evitando su abuso por dificultar la lectura", "Ser obligatorio en cualquier notificación"], 2, "Las guías de estilo administrativo desaconsejan el abuso de mayúsculas sostenidas por dificultar la lectura y comprensión del texto."],
[25, "El lenguaje claro en los documentos administrativos persigue, entre otros objetivos:", ["Aumentar la longitud de las frases para mayor precisión jurídica", "Facilitar la comprensión del contenido por parte de cualquier persona destinataria", "Reducir el documento a un único párrafo sin estructura", "Sustituir por completo el vocabulario técnico necesario"], 1, "El lenguaje claro busca que cualquier persona, sin formación jurídica, pueda comprender el contenido esencial del documento."],
[27, "El depósito legal, en relación con las bibliotecas y centros de documentación, tiene como finalidad:", ["Autorizar la exportación de fondos bibliográficos", "Fijar el precio de venta al público de los libros", "Garantizar la conservación del patrimonio bibliográfico y documental publicado", "Sustituir el registro de la propiedad intelectual"], 2, "El depósito legal obliga a depositar ejemplares de toda publicación para su conservación y control bibliográfico."],
[29, "La avocación es la técnica mediante la cual:", ["Se crea un nuevo órgano administrativo", "Se elimina definitivamente una competencia", "Un órgano superior asume el conocimiento de un asunto que corresponde por delegación o desconcentración a un órgano inferior", "Un órgano inferior asume competencias de uno superior sin autorización"], 2, "La avocación permite al órgano superior recuperar, motivadamente, el conocimiento de un asunto concreto."],
[30, "La motivación de los actos administrativos tiene como finalidad principal:", ["Aumentar la extensión del documento sin más utilidad", "Evitar la necesidad de notificación", "Permitir conocer las razones de hecho y de derecho en que se basa la decisión, facilitando su control", "Sustituir el trámite de audiencia al interesado"], 2, "La motivación es una garantía esencial que permite al interesado conocer y, en su caso, impugnar los fundamentos del acto."],
[30, "La convalidación es la técnica mediante la cual:", ["Se recurre un acto ante los tribunales", "Se declara la nulidad radical de un acto", "Se subsanan los vicios de que adolezca un acto anulable, mediante la subsanación de los defectos", "Se ejecuta forzosamente un acto administrativo"], 2, "La convalidación permite sanar los vicios de anulabilidad de un acto, a diferencia de los actos nulos de pleno derecho, que no admiten convalidación."],
[32, "El trámite de audiencia en el procedimiento administrativo tiene como finalidad:", ["Permitir al interesado alegar y presentar los documentos que estime pertinentes antes de la resolución", "Sustituir la fase de instrucción completa", "Aplicarse únicamente en procedimientos penales", "Ser opcional y prescindible en todo procedimiento"], 0, "Es un trámite esencial de garantía que permite al interesado conocer el expediente y formular alegaciones antes de que se dicte resolución."],
[32, "La propuesta de resolución, en el procedimiento administrativo, es elaborada por:", ["El órgano instructor, tras la fase de instrucción", "El propio interesado exclusivamente", "Un juez de lo contencioso-administrativo", "El órgano competente para resolver, sin instrucción previa"], 0, "Corresponde al órgano instructor, tras haber tramitado el expediente, formular la propuesta que se elevará al órgano competente para resolver."],
[33, "La revisión de oficio de disposiciones administrativas (reglamentos) nulas puede realizarse:", ["Solo mediante sentencia judicial firme previa", "Únicamente dentro del primer año de su aprobación", "En cualquier momento, por iniciativa propia o a solicitud de interesado", "Nunca, si el reglamento ya ha sido publicado"], 2, "A diferencia de los actos, las disposiciones administrativas nulas pueden revisarse de oficio sin límite temporal, dada su naturaleza general."],
[27, "La cooperación bibliotecaria entre distintas Administraciones se articula habitualmente mediante:", ["La centralización obligatoria en un único organismo estatal", "La prohibición de compartir catálogos", "La supresión de las bibliotecas de menor tamaño", "Convenios y órganos de coordinación interadministrativa"], 3, "Los convenios de colaboración y los órganos de coordinación son los instrumentos habituales para articular la cooperación bibliotecaria."],
[21, "La consulta del expediente administrativo por terceros ajenos al procedimiento requiere, con carácter general:", ["Ninguna acreditación, al ser un derecho universal sin límites", "Autorización expresa del Parlamento", "Ser siempre denegada sin excepción", "Acreditar un interés legítimo y directo, respetando los límites legales de protección de datos"], 3, "El acceso de terceros está condicionado a la acreditación de un interés legítimo y al respeto de los límites de protección de datos y otros derechos."],
[20, "La constancia de la fecha y hora en los registros electrónicos se garantiza mediante:", ["La simple anotación manual de un funcionario", "Un sistema de sellado de tiempo fiable e inalterable", "La ausencia de cualquier control horario", "La estimación aproximada del interesado"], 1, "Los registros electrónicos incorporan mecanismos de sellado de tiempo que garantizan la fiabilidad e integridad de la fecha y hora de presentación."],
[16, "Los precios públicos, como categoría de ingreso, se diferencian de las tasas en que:", ["Son siempre de carácter gratuito", "Nunca pueden ser exigidos por una Administración Pública", "Se satisfacen por servicios prestados también por el sector privado, en condiciones de concurrencia", "Sustituyen completamente a los impuestos"], 2, "Los precios públicos se aplican a servicios que también podrían prestarse por el sector privado, a diferencia de las tasas, ligadas a servicios de solicitud o recepción obligatoria."],
[1, "El artículo 10.1 CE establece como fundamento del orden político y de la paz social:", ["La supremacía del poder ejecutivo", "El principio de mayoría absoluta", "La dignidad de la persona y los derechos inviolables que le son inherentes", "La unidad de las fuerzas armadas"], 2, "Es uno de los preceptos más citados de la Constitución, base de todo el sistema de derechos fundamentales."],
[3, "El Defensor del Pueblo Europeo tiene como función:", ["Sustituir al Tribunal de Justicia de la UE", "Investigar las reclamaciones sobre mala administración en las instituciones y órganos de la Unión", "Aprobar el presupuesto de la Unión", "Legislar sobre política exterior común"], 1, "Es una figura de control no jurisdiccional, similar al Defensor del Pueblo estatal pero referida a las instituciones europeas."],
[6, "El principio de transversalidad de género (mainstreaming) implica:", ["Excluir la perspectiva de género de la planificación presupuestaria", "Integrar la perspectiva de género en todas las políticas y actuaciones públicas, no solo en las específicas de igualdad", "Aplicarse únicamente en el ámbito educativo", "Limitar las políticas de igualdad a un único departamento"], 1, "Es un principio metodológico clave de las políticas de igualdad, que exige considerar el impacto de género en cualquier área de actuación pública."],
[9, "La carrera profesional horizontal del personal funcionario consiste en:", ["La jubilación anticipada voluntaria", "La progresión de grado, categoría o escalón sin necesidad de cambiar de puesto de trabajo", "La promoción interna a otro cuerpo distinto", "El ascenso exclusivamente mediante cambio de puesto"], 1, "Se diferencia de la carrera vertical (que exige cambiar de puesto), permitiendo progresar profesionalmente permaneciendo en el mismo puesto."],
[10, "El Registro de Actividades de Tratamiento, exigido por el RGPD, tiene como finalidad:", ["Eliminar la necesidad de nombrar un delegado de protección de datos", "Publicar los datos personales tratados", "Documentar de forma sistemática los tratamientos de datos personales realizados por el responsable o encargado", "Sustituir la obligación de informar a los interesados"], 2, "Es un instrumento de responsabilidad proactiva que documenta qué tratamientos de datos personales se realizan y con qué finalidad."],
[13, "Ante una sospecha de fractura, la actuación de primeros auxilios recomendada es:", ["Intentar recolocar el hueso en su posición original", "Aplicar calor directo sobre la zona", "Inmovilizar la zona afectada sin intentar recolocar el hueso", "Movilizar la zona para comprobar el alcance de la lesión"], 2, "La inmovilización sin manipular la zona afectada es la pauta básica de primeros auxilios ante una posible fractura, evitando agravar la lesión."],
[14, "El derecho de acceso a la información pública puede ejercerse por vía electrónica o presencial, y la Administración debe resolver, con carácter general, en el plazo de:", ["Diez días hábiles improrrogables", "Un mes desde la recepción de la solicitud, prorrogable en determinados casos", "Un año natural sin excepción", "Veinticuatro horas en todo caso"], 1, "La Ley 19/2013 fija este plazo general de un mes, ampliable por otro mes si el volumen o complejidad de la información lo justifica."],
[17, "El complemento específico retributivo del personal funcionario retribuye, entre otros factores:", ["El lugar de nacimiento del funcionario", "Exclusivamente la antigüedad del funcionario", "El número de hijos a cargo", "La especial dificultad técnica, dedicación, incompatibilidad o responsabilidad del puesto"], 3, "Es un complemento ligado a las características objetivas del puesto de trabajo, no a la persona que lo ocupa."],
[20, "La firma de un documento en un registro electrónico deja constancia mediante:", ["Un recibo acreditativo con el contenido presentado, fecha, hora y número de registro", "Ningún tipo de constancia, al ser un trámite informal", "La publicación del documento en el Boletín Oficial", "Una llamada telefónica de confirmación exclusivamente"], 0, "El recibo o justificante de registro es la prueba documental de que la presentación se realizó correctamente."],
[21, "La foliación de un expediente administrativo en soporte papel tiene como finalidad:", ["Sustituir la firma del interesado", "Fijar el plazo de resolución del procedimiento", "Garantizar el orden correlativo y la integridad de los documentos que lo componen", "Determinar el importe de las tasas aplicables"], 2, "Numerar correlativamente los folios evita extravíos o alteraciones en el orden de la documentación del expediente."],
[24, "La accesibilidad universal en la atención a la ciudadanía incluye, entre otros aspectos:", ["Solo la disponibilidad de intérprete de lengua de signos", "La accesibilidad física, sensorial, cognitiva y en la comunicación", "Exclusivamente el uso de letra grande en los documentos", "Únicamente rampas de acceso al edificio"], 1, "La accesibilidad universal es un concepto integral que abarca todas las dimensiones necesarias para que cualquier persona pueda acceder a un servicio."],
[27, "El fondo local de una biblioteca pública se refiere a:", ["El presupuesto anual asignado a la biblioteca", "El conjunto de préstamos interbibliotecarios realizados", "Los fondos destinados exclusivamente a personal investigador", "La colección de materiales relacionados con la historia, cultura y actualidad del territorio donde se ubica"], 3, "El fondo local recoge de forma especializada la producción documental y bibliográfica vinculada al territorio de referencia."],
[29, "La delegación de competencias en el ámbito administrativo se caracteriza por:", ["Ser irrevocable una vez acordada", "Ser revocable en cualquier momento por el órgano delegante", "Transferir la titularidad definitiva de la competencia", "Requerir siempre una ley específica para cada caso"], 1, "El órgano delegante conserva la titularidad de la competencia y puede revocar la delegación en cualquier momento."],
[32, "La ampliación de plazos en el procedimiento administrativo puede acordarse cuando:", ["Nunca es posible ampliar un plazo", "El interesado lo solicite sin ninguna justificación", "Solo si lo autoriza el Tribunal Constitucional", "Las circunstancias lo aconsejen y no se perjudiquen derechos de terceros"], 3, "La LPAC permite ampliar plazos, de oficio o a instancia de parte, siempre que concurran las circunstancias legalmente previstas."],
[33, "La suspensión de la ejecución de un acto administrativo impugnado puede acordarse cuando:", ["Nunca puede acordarse en vía administrativa", "Se solicite sin necesidad de motivación alguna", "Solo procede en materia tributaria", "Concurran circunstancias de especial gravedad que impidan o dificulten la reparación de los daños causados por la ejecución"], 3, "La suspensión cautelar exige una valoración de la gravedad del perjuicio que causaría la ejecución inmediata del acto."],

/* ============ STORAGE (window.storage con fallback a localStorage) ============ */
async function storageGet(key){
  try{ if(window.storage){ const r = await window.storage.get(key); return r ? r.value : null; } }catch(e){}
  try{ return localStorage.getItem(key); }catch(e){}
  return null;
}
async function storageSet(key,value){
  try{ if(window.storage){ await window.storage.set(key,value); return; } }catch(e){}
  try{ localStorage.setItem(key,value); }catch(e){}
}

function buildAll(){
  const out=[];
  QUESTIONS.forEach((q,i)=> out.push({id:'b'+i, tema:q[0], question:q[1], options:q[2], correct:q[3], explanation:q[4]||null}));
  customQuestions.forEach((q,i)=> out.push({id:'c'+i, tema:q[0], question:q[1], options:q[2], correct:q[3], explanation:q[4]||null}));
  return out;
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

async function loadAll(){
  try{ const un = await storageGet('user_name'); if(un) userName = un; }catch(e){}
  try{ const c = await storageGet('custom_questions'); if(c) customQuestions = JSON.parse(c); }catch(e){}
  try{ const f = await storageGet('failed_ids'); if(f) failedIds = new Set(JSON.parse(f)); }catch(e){}
  try{ const fl = await storageGet('flagged_ids'); if(fl) flaggedIds = new Set(JSON.parse(fl)); }catch(e){}
  try{ const qs = await storageGet('question_stats'); if(qs) questionStats = JSON.parse(qs); }catch(e){}
  try{ const s = await storageGet('tema_stats'); if(s) temaStats = JSON.parse(s); }catch(e){}
  try{ const d = await storageGet('dark_mode'); if(d) darkMode = d === '1'; }catch(e){}
  try{ const s = await storageGet('sound_enabled'); if(s!==null && s!==undefined) soundEnabled = s === '1'; }catch(e){}
  try{ const fs = await storageGet('font_size'); if(fs) fontSize = fs; }catch(e){}
  try{ const em = await storageGet('exam_mode'); if(em){ examMode = em === '1'; examModePreference = examMode; } }catch(e){}
  try{
    const migrated = await storageGet('exam_mode_fix_v1');
    if(!migrated){
      // Corrige un valor de "modo examen" que pudo quedar mal guardado por un fallo anterior del simulacro oficial
      examMode = false; examModePreference = false;
      await storageSet('exam_mode', '0');
      await storageSet('exam_mode_fix_v1', '1');
    }
  }catch(e){}
  try{ const sh = await storageGet('sessions_history'); if(sh) sessionsHistory = JSON.parse(sh); }catch(e){}
  try{ const tt = await storageGet('total_tests'); if(tt) totalTestsCompleted = Number(tt)||0; }catch(e){}
  try{ const sd = await storageGet('study_dates'); if(sd) studyDates = new Set(JSON.parse(sd)); }catch(e){}
  applyDarkMode();
  applyFontSize();
  render();
}

/* ============ MONITORIZACIÓN: envío a Google Sheets (si está configurado) ============ */
function sendLog(accion, extra){
  if(!SHEET_WEBHOOK_URL) return; // sin URL configurada, no se envía nada a ningún sitio
  try{
    const payload = Object.assign({
      nombre: userName || "(sin nombre)",
      accion: accion,
      fechaCliente: new Date().toLocaleString('es-ES'),
    }, extra || {});
    fetch(SHEET_WEBHOOK_URL, {
      method: 'POST',
      mode: 'no-cors', // Apps Script no admite CORS estándar; no leemos respuesta, solo enviamos
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(()=>{ /* sin conexión: se ignora silenciosamente, no interrumpe el uso de la app */ });
  }catch(e){ /* nunca debe romper la app por un fallo de red */ }
}

let _audioCtx = null;
function getAudioCtx(){
  if(!_audioCtx){
    try{ _audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; }
  }
  if(_audioCtx.state === 'suspended'){ _audioCtx.resume(); }
  return _audioCtx;
}
function playTone(freq, startTime, duration, ctx, type='sine', gainPeak=0.18){
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, startTime);
  gain.gain.setValueAtTime(0, startTime);
  gain.gain.linearRampToValueAtTime(gainPeak, startTime+0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001, startTime+duration);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(startTime); osc.stop(startTime+duration+0.02);
}
function playCorrectSound(){
  if(!soundEnabled) return;
  const ctx = getAudioCtx(); if(!ctx) return;
  const now = ctx.currentTime;
  playTone(587.33, now, 0.11, ctx, 'sine');       // Re5
  playTone(880.00, now+0.09, 0.16, ctx, 'sine');  // La5
}
function playWrongSound(){
  if(!soundEnabled) return;
  const ctx = getAudioCtx(); if(!ctx) return;
  const now = ctx.currentTime;
  playTone(196.00, now, 0.22, ctx, 'sawtooth', 0.12);     // Sol3
  playTone(174.61, now+0.1, 0.24, ctx, 'sawtooth', 0.12); // Fa3
}

function computeStreak(){
  let streak = 0;
  const d = new Date();
  const todayStr = d.toISOString().slice(0,10);
  if(!studyDates.has(todayStr)){ d.setDate(d.getDate()-1); }
  while(true){
    const s = d.toISOString().slice(0,10);
    if(studyDates.has(s)){ streak++; d.setDate(d.getDate()-1); }
    else break;
  }
  return streak;
}

function weakestTemas(n){
  return Object.entries(TEMAS).map(([num,name])=>{
    const st = temaStats[num]||{attempts:0,correct:0};
    const pct = st.attempts>0 ? st.correct/st.attempts*100 : null;
    return {num:Number(num), name, pct, attempts:st.attempts};
  }).filter(t=>t.pct!==null && t.attempts>=3).sort((a,b)=>a.pct-b.pct).slice(0,n);
}

function renderQuiz(){
  const q = quizPool[currentIndex];
  const answered = answers[currentIndex];
  const progressPct = Math.round((currentIndex/quizPool.length)*100);
  const letters = ["A","B","C","D"];
  const isFlagged = flaggedIds.has(q.id);

  const showFeedback = answered && !examMode;
  const optionsHtml = q.options.map((opt,i)=>{
    let cls = "option";
    if(showFeedback){
      cls += " disabled";
      if(i===q.correct) cls += " correct";
      else if(i===answered.chosen) cls += " wrong";
    } else if(examMode && answered && i===answered.chosen){
      cls += " selected";
    }
    return `<div class="${cls}" data-opt="${i}"><span class="letter">${letters[i]}</span><span>${opt}</span></div>`;
  }).join("");

  let feedback = "";
  if(showFeedback){
    if(answered.chosen === q.correct){
      feedback = `<div class="feedback ok">Correcto.</div>`;
    } else if(answered.chosen === null){
      feedback = `<div class="feedback no">Sin responder. La correcta es la <b>${letters[q.correct]}) ${q.options[q.correct]}</b>.</div>`;
    } else {
      feedback = `<div class="feedback no">Incorrecto. La respuesta correcta es la <b>${letters[q.correct]}) ${q.options[q.correct]}</b>.</div>`;
    }
    if(q.explanation){
      feedback += `<div class="small" style="margin-top:6px;">${q.explanation}</div>`;
    }
    const qst = questionStats[q.id];
    if(qst && qst.fails>0){
      feedback += `<div class="small" style="margin-top:6px;color:var(--gold);">Ya has fallado esta pregunta ${qst.fails} ${qst.fails===1?'vez':'veces'} antes. Repásala con atención.</div>`;
    }
  }

  const timerHtml = quizEndTime ? `<div id="timerDisplay" class="timerBox">--:--</div>` : "";
  const isLast = currentIndex===quizPool.length-1;
  const canAdvance = examMode || answered;
  const nextLabel = isLast ? (examMode ? "Finalizar test" : "Ver resultados") : "Siguiente";

  return `
  <header class="app">
    <h1>Test en curso ${examMode?'<span class="tag" style="margin-left:8px;">MODO EXAMEN</span>':''}</h1>
    <div class="headerRight">
      <button class="iconBtn" id="soundToggle" title="${soundEnabled?'Silenciar sonidos':'Activar sonidos'}">${soundEnabled?'🔊':'🔇'}</button>
      ${timerHtml}
      <div class="tag">${currentIndex+1} / ${quizPool.length}</div>
    </div>
  </header>
  <div class="progress-bar"><div class="progress-fill" style="width:${progressPct}%"></div></div>
  <div class="card">
    <div class="qmeta">
      <span>Tema ${q.tema} · ${TEMAS[q.tema]||''}</span>
      <button class="flagBtn ${isFlagged?'active':''}" id="flagBtn" title="Marcar como duda">${isFlagged?'★ Duda':'☆ Marcar duda'}</button>
    </div>
    <p class="qtext">${q.question}</p>
    ${optionsHtml}
    ${feedback}
  </div>
  <div class="footer-nav">
    <button class="btn secondary" id="quitBtn">Salir</button>
    ${examMode ? `<button class="btn secondary" id="prevBtn" ${currentIndex===0?'disabled':''}>Anterior</button>` : ""}
    <button class="btn" id="nextBtn" ${canAdvance?'':'disabled'}>${nextLabel}</button>
  </div>
  ${examMode && !isLast ? `<div style="text-align:center;margin-top:12px;"><a class="link-btn" id="finishNowBtn">Finalizar test ahora</a></div>` : ""}
  `;
}

function renderEvolutionCard(){
  if(sessionsHistory.length<2) return "";
  const recent = sessionsHistory.slice(-12);
  const w = 300, h = 70, pad = 6;
  const stepX = (w-2*pad)/(recent.length-1);
  const pts = recent.map((s,i)=>{
    const x = pad + i*stepX;
    const y = pad + (h-2*pad) * (1 - s.pct/100);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  const circles = recent.map((s,i)=>{
    const x = pad + i*stepX;
    const y = pad + (h-2*pad) * (1 - s.pct/100);
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.5" fill="var(--green)"></circle>`;
  }).join("");
  const first = recent[0].pct, last = recent[recent.length-1].pct;
  const trend = last>=first ? "↑" : "↓";
  return `
  <div class="card">
    <h2 class="section">Tu evolución (últimos ${recent.length} tests)</h2>
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;overflow:visible;">
      <polyline points="${pts}" fill="none" stroke="var(--green)" stroke-width="2"></polyline>
      ${circles}
    </svg>
    <p class="small" style="margin-top:6px;">De ${first}% a ${last}% de acierto ${trend}</p>
  </div>`;
}

function renderResults(){
  const total = quizPool.length;
  let correctCount=0, wrongCount=0, blankCount=0, netScore=0;
  answers.forEach((a,i)=>{
    const q = quizPool[i];
    if(a.chosen===null){ blankCount++; }
    else if(a.chosen===q.correct){ correctCount++; netScore += 1; }
    else{ wrongCount++; netScore -= penaltyFraction; }
  });
  const notaSobre10 = (netScore/total*10).toFixed(2);

  const byTema = {};
  answers.forEach((a,i)=>{
    const q = quizPool[i];
    if(!byTema[q.tema]) byTema[q.tema] = {ok:0,total:0};
    byTema[q.tema].total++;
    if(a.chosen===q.correct) byTema[q.tema].ok++;
  });
  const temaRows = Object.entries(byTema).sort((a,b)=>a[0]-b[0]).map(([tema,v])=>{
    return `<div class="tema-result"><span>Tema ${tema} · ${TEMAS[tema]}</span><span class="badge">${v.ok}/${v.total}</span></div>`;
  }).join("");

  const wrongList = answers.map((a,i)=>({a,q:quizPool[i]})).filter(x=>x.a.chosen!==x.q.correct).map(({a,q})=>{
    const letters=["A","B","C","D"];
    const tuResp = a.chosen===null ? "sin responder" : `${letters[a.chosen]}) ${q.options[a.chosen]}`;
    return `<div class="card" style="padding:16px;">
      <div class="qmeta">Tema ${q.tema}</div>
      <p style="margin:0 0 8px;font-size:.95rem;">${q.question}</p>
      <p class="small" style="margin:0;">Tu respuesta: ${tuResp}<br>Correcta: ${letters[q.correct]}) ${q.options[q.correct]}</p>
    </div>`;
  }).join("");

  const totalMs = questionElapsed.reduce((a,b)=>a+b,0);
  const avgMs = total>0 ? totalMs/total : 0;
  const avgSec = Math.round(avgMs/1000);
  const avgTimeStr = avgSec>=60 ? `${Math.floor(avgSec/60)} min ${avgSec%60}s` : `${avgSec}s`;

  return `
  ${headerHtml("Resultados", total + " preguntas")}
  <div class="card" style="text-align:center;">
    <div class="score-big">${correctCount}/${total}</div>
    <div class="small" style="margin-top:6px;">${correctCount} aciertos · ${wrongCount} fallos · ${blankCount} en blanco</div>
    <div class="small" style="margin-top:6px;">Tiempo medio por pregunta: <b>${avgTimeStr}</b></div>
    ${penaltyFraction>0 ? `<div class="small" style="margin-top:10px;">Nota con penalización: <b>${netScore.toFixed(2)}</b> puntos (${notaSobre10} sobre 10)</div>` : ""}
  </div>
  ${renderEvolutionCard()}
  <div class="card">
    <h2 class="section">Resultado por tema</h2>
    ${temaRows}
  </div>
  ${wrongList ? `<h2 class="section" style="margin:20px 0 12px;">Repaso de fallos</h2>${wrongList}` : `<p class="small">¡Sin fallos! Buen trabajo.</p>`}
  <div class="row" style="margin-top:16px;">
    <button class="btn wide" id="backHome">Volver al inicio</button>
    ${wrongCount>0 ? `<button class="btn secondary wide" id="exportFails">Exportar fallos (.txt)</button>` : ""}
  </div>
  `;
}

function renderStats(){
  const rows = Object.entries(TEMAS).map(([num,name])=>{
    const st = temaStats[num] || {attempts:0, correct:0};
    const pct = st.attempts>0 ? Math.round(st.correct/st.attempts*100) : null;
    return {num,name,attempts:st.attempts,correct:st.correct,pct};
  }).sort((a,b)=>{
    if(a.pct===null && b.pct===null) return a.num-b.num;
    if(a.pct===null) return 1;
    if(b.pct===null) return -1;
    return a.pct-b.pct;
  });

  const rowsHtml = rows.map(r=>{
    const pctDisplay = r.pct===null ? "—" : r.pct+"%";
    const barWidth = r.pct===null ? 0 : r.pct;
    return `<div class="statRow">
      <span class="name">T${r.num} · ${r.name}</span>
      <div class="statBar"><div style="width:${barWidth}%"></div></div>
      <span class="pct">${pctDisplay}</span>
    </div>`;
  }).join("");

  return `
  ${headerHtml("Estadísticas", "por tema")}
  <div class="card">
    <p class="small">Acumulado de todas tus sesiones de test, ordenado de peor a mejor % de acierto, para ver de un vistazo qué temas tienes más flojos.</p>
    ${rowsHtml}
  </div>

    <button class="btn wide" id="backHome3">Volver al inicio</button>
    <button class="link-btn" id="resetStats">Reiniciar estadísticas</button>
  </div>
  `;
}

  </div>
  <div class="card">
    <p class="small">Tienes actualmente <b>${customQuestions.length}</b> preguntas propias guardadas. Pídeme en el chat más preguntas de un tema concreto y te las paso en este formato.</p>
    ${customQuestions.length ? `<button class="link-btn" id="clearCustom">Borrar todas mis preguntas añadidas</button>` : ""}
  </div>
  `;
}

/* ============ HANDLERS ============ */
function attachHandlers(){
  const splash = document.getElementById('splashScreen');
  if(splash) splash.onclick = ()=>{
    if(SHEET_WEBHOOK_URL && !userName){ view="identify"; } else { view="home"; sendLog('apertura'); }
    render();
  };
  const nameSubmit = document.getElementById('nameSubmit');
  if(nameSubmit){
    const nameInput = document.getElementById('nameInput');
    const submit = async ()=>{
      const val = (nameInput.value||"").trim();
      if(!val) { nameInput.focus(); return; }
      userName = val;
      await storageSet('user_name', userName);
      view = "home";
      sendLog('apertura');
      render();
    };
    nameSubmit.onclick = submit;
    nameInput.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
  }

  const dt = document.getElementById('darkToggle');
  if(dt) dt.onclick = async ()=>{ darkMode=!darkMode; applyDarkMode(); await persistDark(); render(); };

  if(view==="home"){
    document.querySelectorAll('[data-tema]').forEach(cb=>{
      cb.addEventListener('change',e=>{
        const n = Number(e.target.dataset.tema);
        if(e.target.checked) selectedTemas.add(n); else selectedTemas.delete(n);
        updateMaxAvail();
      });
    });
    document.querySelectorAll('input[name="srcMode"]').forEach(r=>{
      r.addEventListener('change', e=>{ sourceMode = e.target.value; render(); });
    });
    document.getElementById('selAll').onclick=()=>{selectedTemas=new Set(Object.keys(TEMAS).map(Number));render();};
    document.getElementById('selNone').onclick=()=>{selectedTemas=new Set();render();};
    document.getElementById('goTemario').onclick=()=>{view="temario";render();};
    document.getElementById('goGlosario').onclick=()=>{view="glosario";render();};
    document.getElementById('startBtn').onclick=startQuiz;
    document.getElementById('examSimBtn').onclick=startExamSimulation;
    document.getElementById('goImport').onclick=()=>{view="import";render();};
    document.getElementById('goStats').onclick=()=>{view="stats";render();};
    document.getElementById('examModeChk').onchange=async e=>{ examMode=e.target.checked; examModePreference=examMode; await persistExamMode(); };
    document.getElementById('fontSizeSel').onchange=async e=>{ fontSize=e.target.value; applyFontSize(); await persistFontSize(); };
    updateMaxAvail();
  } else if(view==="quiz"){
    document.querySelectorAll('.option').forEach(el=>{
      el.addEventListener('click',()=>{
        if(answers[currentIndex] && !examMode) return;
        const chosen = Number(el.dataset.opt);
        answers[currentIndex] = {chosen};
        if(!examMode){
          const q = quizPool[currentIndex];
          if(chosen === q.correct) playCorrectSound(); else playWrongSound();
        }
        render();
      });
    });
    document.getElementById('quitBtn').onclick=()=>{
      if(confirm("¿Seguro que quieres salir? Perderás el progreso de este test.")){
        clearInterval(timerInterval); examMode = examModePreference; view="home"; render();
      }
    };
    const st = document.getElementById('soundToggle');
    if(st) st.onclick = async ()=>{ soundEnabled = !soundEnabled; await persistSound(); render(); };
    document.getElementById('flagBtn').onclick=async ()=>{
      const q = quizPool[currentIndex];
      if(flaggedIds.has(q.id)) flaggedIds.delete(q.id); else flaggedIds.add(q.id);
      await persistFlagged();
      render();
    };
    const pb = document.getElementById('prevBtn');
    if(pb) pb.onclick=()=>{ recordTimeSpent(); currentIndex--; render(); };
    const fnb = document.getElementById('finishNowBtn');
    if(fnb) fnb.onclick=()=>{
      for(let i=0;i<quizPool.length;i++){ if(!answers[i]) answers[i]={chosen:null}; }
      recordTimeSpent();
      finalizeQuiz();
    };
    const nb = document.getElementById('nextBtn');
    if(nb) nb.onclick=()=>{
      recordTimeSpent();
      if(currentIndex===quizPool.length-1){
        if(examMode){ for(let i=0;i<quizPool.length;i++){ if(!answers[i]) answers[i]={chosen:null}; } }
        finalizeQuiz();
      }
      else{ currentIndex++; render(); }
    };
  } else if(view==="results"){
    document.getElementById('backHome').onclick=()=>{examMode = examModePreference; view="home";render();};
    const exp = document.getElementById('exportFails');
    if(exp) exp.onclick = exportFails;
  } else if(view==="import"){
    document.getElementById('importBtn').onclick=handleImport;
    document.getElementById('backHome2').onclick=()=>{view="home";render();};
    const clr = document.getElementById('clearCustom');
    if(clr) clr.onclick=async ()=>{ customQuestions=[]; await persistCustom(); render(); };
  } else if(view==="temario"){
    document.getElementById('backHome4').onclick=()=>{view="home";render();};
  } else if(view==="glosario"){
    document.getElementById('backHomeG').onclick=()=>{view="home";render();};
  } else if(view==="stats"){
    document.getElementById('backHome3').onclick=()=>{view="home";render();};
    document.getElementById('resetStats').onclick=async ()=>{
      if(confirm("¿Reiniciar todo el historial de estadísticas por tema?")){
        temaStats = {}; await persistStats(); render();
      }
    };
  }
}

function updateMaxAvail(){
  const avail = buildAll().filter(q=>selectedTemas.has(q.tema)).length;
  const maxEl = document.getElementById('maxAvail');
  const numQ = document.getElementById('numQ');
  if(maxEl) maxEl.textContent = avail;
  if(numQ) numQ.max = Math.max(1,avail);
}

function priorityWeight(q){
  // Prioridad de repaso: cuantas más veces se ha fallado en proporción a los intentos, mayor peso.
  // Suavizado de Laplace para que una sola pregunta nunca fallada no quede en peso 0, y una nueva sin intentos tenga peso medio.
  const st = questionStats[q.id];
  if(!st || !st.attempts) return 1.5; // preguntas nunca vistas: prioridad media-alta para que entren en rotación
  const failRate = (st.fails + 1) / (st.attempts + 2);
  return 0.3 + failRate*3; // entre ~0.3 (dominada) y ~3.3 (muy fallada)
}

function weightedShuffle(arr, weightFn){
  // Muestreo aleatorio ponderado sin reemplazo (algoritmo de la clave A-ExpJ simplificado)
  return arr
    .map(q=>({q, key: Math.pow(Math.random(), 1/weightFn(q))}))
    .sort((a,b)=>b.key-a.key)
    .map(p=>p.q);
}

function weightedByFails(pool){
  // Repetición espaciada: prioriza preguntas con peor % de acierto histórico, con aleatoriedad para no repetir siempre el mismo orden
  return weightedShuffle(pool, priorityWeight);
}

function stratifiedByTema(pool, n){
  // Reparte las preguntas de forma equilibrada entre los temas seleccionados y, dentro de cada tema,
  // da prioridad suave a las preguntas que peor dominas (repetición espaciada ligera también en modo normal)
  const byTema = {};
  pool.forEach(q=>{ (byTema[q.tema] = byTema[q.tema]||[]).push(q); });
  const temaKeys = Object.keys(byTema);
  const numTemas = temaKeys.length;
  if(numTemas<=1) return weightedShuffle(pool, priorityWeight).slice(0,n);
  temaKeys.forEach(k=> byTema[k]=weightedShuffle(byTema[k], priorityWeight));
  const base = Math.floor(n/numTemas);
  let remainder = n - base*numTemas;
  const order = shuffle(temaKeys);
  const result = [];
  order.forEach(k=>{
    let quota = base + (remainder>0 ? 1 : 0);
    if(remainder>0) remainder--;
    result.push(...byTema[k].slice(0,quota));
  });
  if(result.length<n){
    const used = new Set(result.map(q=>q.id));
    const leftovers = weightedShuffle(pool.filter(q=>!used.has(q.id)), priorityWeight);
    result.push(...leftovers.slice(0, n-result.length));
  }
  return shuffle(result).slice(0,n);
}


function startExamSimulation(){
  selectedTemas = new Set(Object.keys(TEMAS).map(Number));
  sourceMode = "temas";
  examMode = true;
  const all = buildAll().filter(q=>selectedTemas.has(q.tema));
  const n = Math.min(60, all.length);
  const chosen = stratifiedByTema(all, n);
  quizPool = shuffle(chosen).map(q=>{
    const idxs = shuffle(q.options.map((_,i)=>i));
    return {...q, options: idxs.map(i=>q.options[i]), correct: idxs.indexOf(q.correct)};
  });
  currentIndex = 0;
  answers = [];
  questionElapsed = new Array(quizPool.length).fill(0);
  qEnterTime = Date.now();
  penaltyFraction = 0.3333;
  timeLimitMin = 60;
  quizEndTime = Date.now() + timeLimitMin*60000;
  view = "quiz";
  render();
}

function startQuiz(){
  const all = buildAll();
  let pool;
  let useWeighting = false;
  if(sourceMode==="fallos"){
    pool = all.filter(q=>failedIds.has(q.id));
    if(pool.length===0){ alert("Todavía no tienes preguntas falladas guardadas."); return; }
    useWeighting = true;
  } else if(sourceMode==="dudas"){
    pool = all.filter(q=>flaggedIds.has(q.id));
    if(pool.length===0){ alert("Todavía no tienes preguntas marcadas como duda."); return; }
    useWeighting = true;
  } else {
    pool = all.filter(q=>selectedTemas.has(q.tema));
    if(pool.length===0){ alert("Selecciona al menos un tema."); return; }
  }
  let n = Number(document.getElementById('numQ').value) || pool.length;
  n = Math.min(Math.max(n,1), pool.length);
  penaltyFraction = Number(document.getElementById('penaltySel').value) || 0;
  timeLimitMin = Number(document.getElementById('timeLimit').value) || 0;

  let chosen;
  if(useWeighting){
    chosen = weightedByFails(pool).slice(0,n);
  } else {
    chosen = stratifiedByTema(pool, n);
  }

  quizPool = shuffle(chosen).map(q=>{
    const idxs = shuffle(q.options.map((_,i)=>i));
    return {...q, options: idxs.map(i=>q.options[i]), correct: idxs.indexOf(q.correct)};
  });
  currentIndex = 0;
  answers = [];
  questionElapsed = new Array(quizPool.length).fill(0);
  qEnterTime = Date.now();
  quizEndTime = timeLimitMin>0 ? (Date.now() + timeLimitMin*60000) : null;
  view = "quiz";
  render();
}

function recordTimeSpent(){
  if(currentIndex>=0 && currentIndex<questionElapsed.length){
    questionElapsed[currentIndex] += Date.now()-qEnterTime;
  }
  qEnterTime = Date.now();
}

function startTimerIfNeeded(){
  clearInterval(timerInterval);
  if(view!=="quiz" || !quizEndTime) return;
  timerInterval = setInterval(()=>{
    const remain = quizEndTime - Date.now();
    const el = document.getElementById('timerDisplay');
    if(remain<=0){
      clearInterval(timerInterval);
      forceFinishByTime();
      return;
    }
    if(el){
      const m = Math.floor(remain/60000);
      const s = Math.floor((remain%60000)/1000);
      el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      el.classList.toggle('low', remain < 60000);
    }
  },500);
}

function forceFinishByTime(){
  for(let i=0;i<quizPool.length;i++){
    if(!answers[i]) answers[i] = {chosen:null};
  }
  finalizeQuiz();
}

async function finalizeQuiz(){
  clearInterval(timerInterval);
  recordTimeSpent();
  let correctCount = 0;
  quizPool.forEach((q,i)=>{
    const a = answers[i];
    if(!temaStats[q.tema]) temaStats[q.tema] = {attempts:0, correct:0};
    temaStats[q.tema].attempts++;
    if(!questionStats[q.id]) questionStats[q.id] = {attempts:0, correct:0, fails:0};
    questionStats[q.id].attempts++;
    if(a && a.chosen===q.correct){
      temaStats[q.tema].correct++;
      questionStats[q.id].correct++;
      failedIds.delete(q.id);
      correctCount++;
    } else {
      failedIds.add(q.id);
      questionStats[q.id].fails++;
    }
  });
  const total = quizPool.length;
  const pct = total>0 ? Math.round(correctCount/total*100) : 0;
  sessionsHistory.push({date: new Date().toISOString(), pct});
  if(sessionsHistory.length>30) sessionsHistory = sessionsHistory.slice(-30);
  totalTestsCompleted++;
  studyDates.add(new Date().toISOString().slice(0,10));
  await persistStats();
  await persistQuestionStats();
  await persistFailed();
  await persistSessions();
  await persistTotalTests();
  await persistStudyDates();
  const temasEnTest = [...new Set(quizPool.map(q=>q.tema))].sort((a,b)=>a-b);
  const failsPorTema = {};
  quizPool.forEach((q,i)=>{ const a=answers[i]; if(!a || a.chosen!==q.correct) failsPorTema[q.tema]=(failsPorTema[q.tema]||0)+1; });
  const temasFlojos = Object.entries(failsPorTema).sort((a,b)=>b[1]-a[1]).slice(0,5)
    .map(([t,n])=>`T${t} (${n} fallo${n===1?'':'s'})`).join(', ');
  sendLog('test_completado', {
    modo: sourceMode,
    modoExamen: examMode,
    temas: temasEnTest.join(', '),
    totalPreguntas: total,
    aciertos: correctCount,
    fallos: total - correctCount,
    porcentaje: pct,
    tiempoSegundos: questionElapsed.reduce((a,b)=>a+b,0),
    temasFlojos: temasFlojos
  });
  view = "results";
  render();
}

function exportFails(){
  const letters=["A","B","C","D"];
  let text = "Repaso de fallos - Test Cuerpo Administrativo\n" + new Date().toLocaleString() + "\n\n";
  answers.forEach((a,i)=>{
    const q = quizPool[i];
    if(a.chosen!==q.correct){
      text += `Tema ${q.tema} - ${TEMAS[q.tema]}\n`;
      text += q.question + "\n";
      q.options.forEach((opt,idx)=>{ text += `  ${letters[idx]}) ${opt}${idx===q.correct?'  <-- correcta':''}\n`; });
      text += `Tu respuesta: ${a.chosen===null?'sin responder':letters[a.chosen]}\n\n`;
    }
  });
  const blob = new Blob([text], {type:"text/plain;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = "fallos_test_oposicion.txt";
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

function handleImport(){
  const raw = document.getElementById('importArea').value.trim();
  const msg = document.getElementById('importMsg');
  if(!raw){ msg.textContent=""; return; }
  try{
    const parsed = JSON.parse(raw);
    if(!Array.isArray(parsed)) throw new Error("no es un array");
    let added = 0;
    parsed.forEach(item=>{
      if(Array.isArray(item) && item.length>=4 && typeof item[0]==="number" && typeof item[1]==="string" && Array.isArray(item[2]) && item[2].length===4 && typeof item[3]==="number"){
        customQuestions.push(item);
        added++;
      }
    });
    msg.textContent = `Se añadieron ${added} preguntas correctamente.`;
    msg.style.color = "var(--green)";
    persistCustom();
    document.getElementById('importArea').value = "";
    setTimeout(render, 900);
  }catch(e){
    msg.textContent = "El formato no es válido. Revisa el ejemplo de arriba.";
    msg.style.color = "var(--red)";
  }
}

window.addEventListener('beforeunload', (e)=>{
  if(view==="quiz"){ e.preventDefault(); e.returnValue=''; }
});

loadAll();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
