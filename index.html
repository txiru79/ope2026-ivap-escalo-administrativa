<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Cuerpo Administrativo - IVAP</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b2430">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --ink:#1b2430; --paper:#f7f5f0; --card:#ffffff; --line:#dcd6c8;
    --green:#2f5d4f; --green-dark:#1f3f36; --red:#8a2b2b; --gold:#a3742b; --muted:#6b6459;
    --shadow: 0 1px 2px rgba(27,36,48,.06), 0 6px 20px rgba(27,36,48,.06);
  }
  body.dark{
    --ink:#eae5da; --paper:#171b1f; --card:#20262c; --line:#3d464c;
    --green:#5fae95; --green-dark:#8fd3bd; --red:#e08787; --gold:#d9ac5f; --muted:#a9ada6;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
  }
  html.fs-sm{font-size:15px;}
  html.fs-md{font-size:16px;}
  html.fs-lg{font-size:18.5px;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s;}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px;}
  header.app{display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:22px;gap:10px;}
  header.app h1{font-size:1.3rem;letter-spacing:.02em;margin:0;font-weight:700;}
  header.app .tag{font-family:ui-monospace,Menlo,monospace;font-size:.72rem;color:var(--muted);letter-spacing:.06em;white-space:nowrap;}
  .headerRight{display:flex;align-items:center;gap:10px;}
  .iconBtn{border:1px solid var(--line);background:var(--card);border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:.95rem;line-height:1;color:var(--ink);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);padding:22px;margin-bottom:18px;}
  h2.section{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--gold);margin:0 0 14px;font-family:ui-monospace,Menlo,monospace;border-bottom:1px solid var(--line);padding-bottom:8px;}
  .btn{font-family:ui-monospace,Menlo,monospace;font-size:.85rem;letter-spacing:.03em;border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:2px;cursor:pointer;}
  .btn.secondary{background:transparent;color:var(--ink);}
  .btn.wide{width:100%;}
  .btn:disabled{opacity:.4;cursor:default;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .num-input,select.field{width:100px;padding:9px;font-family:ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:2px;font-size:.9rem;background:var(--card);color:var(--ink);}
  input[type="text"].field{width:100%;padding:12px;border:1px solid var(--line);border-radius:2px;font-size:1rem;background:var(--card);color:var(--ink);box-sizing:border-box;}
  select.field{width:auto;}
  .tema-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:.86rem;max-height:300px;overflow-y:auto;padding-right:4px;}
  @media (max-width:560px){.tema-grid{grid-template-columns:1fr;}}
  .tema-item{display:flex;align-items:flex-start;gap:8px;line-height:1.3;padding:4px 0;border-bottom:1px dashed var(--line);}
  .tema-item input{margin-top:4px;flex-shrink:0;}
  .tema-actions{display:flex;gap:14px;margin:10px 0 14px;font-size:.8rem;}
  .tema-actions a,.link-btn{color:var(--green);cursor:pointer;text-decoration:underline;background:none;border:none;font-size:.85rem;padding:0;font-family:inherit;}
  .progress-bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px;}
  .progress-fill{height:100%;background:var(--green);transition:width .25s ease;}
  .qmeta{font-family:ui-monospace,Menlo,monospace;font-size:.72rem;color:var(--muted);letter-spacing:.05em;margin-bottom:10px;text-transform:uppercase;display:flex;justify-content:space-between;}
  .qtext{font-size:1.12rem;line-height:1.5;margin:0 0 20px;}
  .option{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:3px;padding:13px 14px;margin-bottom:10px;cursor:pointer;font-size:.98rem;line-height:1.4;background:var(--card);transition:border-color .15s,background .15s;}
  .option:hover{border-color:var(--green);}
  .option .letter{font-family:ui-monospace,Menlo,monospace;font-weight:700;color:var(--gold);flex-shrink:0;}
  .option.correct{border-color:var(--green);background:rgba(47,93,79,.12);}
  .option.correct .letter{color:var(--green);}
  .option.wrong{border-color:var(--red);background:rgba(138,43,43,.12);}
  .option.wrong .letter{color:var(--red);}
  .option.disabled{cursor:default;}
  .option.selected{border-color:var(--gold);background:rgba(163,116,43,.12);}
  .flagBtn{border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:.72rem;padding:3px 8px;border-radius:10px;cursor:pointer;font-family:ui-monospace,Menlo,monospace;white-space:nowrap;}
  .flagBtn.active{border-color:var(--gold);color:var(--gold);background:rgba(163,116,43,.12);}
  .feedback{margin-top:6px;padding:12px 14px;border-radius:3px;font-size:.88rem;line-height:1.5;}
  .feedback.ok{background:rgba(47,93,79,.12);border:1px solid var(--green);color:var(--green-dark);}
  .feedback.no{background:rgba(138,43,43,.12);border:1px solid var(--red);color:var(--red);}
  .footer-nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px;}
  .score-big{font-size:2.6rem;font-weight:700;font-family:ui-monospace,Menlo,monospace;}
  .tema-result{display:flex;justify-content:space-between;font-size:.85rem;padding:7px 0;border-bottom:1px dashed var(--line);}
  .badge{font-family:ui-monospace,Menlo,monospace;font-size:.72rem;padding:2px 7px;border-radius:10px;background:var(--line);color:var(--ink);}
  textarea{width:100%;min-height:140px;font-family:ui-monospace,Menlo,monospace;font-size:.82rem;border:1px solid var(--line);border-radius:3px;padding:10px;background:var(--card);color:var(--ink);}
  .small{font-size:.82rem;color:var(--muted);line-height:1.5;}
  .flag{display:inline-block;width:14px;height:14px;border-radius:50%;background:conic-gradient(from 0deg,#d52b1e 0 25%,#eab308 25% 40%,#2f5d4f 40% 100%);margin-right:8px;vertical-align:-2px;}
  .radioRow{display:flex;gap:16px;font-size:.88rem;margin:6px 0;flex-wrap:wrap;}
  .radioRow label{display:flex;gap:6px;align-items:center;cursor:pointer;}
  .statBar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;flex:1;margin:0 10px;}
  .statBar > div{height:100%;background:var(--green);}
  .statRow{display:flex;align-items:center;font-size:.82rem;padding:8px 0;border-bottom:1px dashed var(--line);}
  .statRow .name{width:160px;flex-shrink:0;}
  .statRow .pct{width:44px;text-align:right;font-family:ui-monospace,Menlo,monospace;flex-shrink:0;}
  .timerBox{font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:.95rem;padding:4px 10px;border:1px solid var(--line);border-radius:3px;}
  .timerBox.low{color:var(--red);border-color:var(--red);}

  /* Splash screen */
  .splash{
    position:fixed; inset:0; z-index:50;
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    background: radial-gradient(ellipse at 50% 30%, rgba(163,116,43,.10), transparent 60%), var(--paper);
    cursor:pointer; text-align:center; padding:24px;
  }
  .splash-flag{width:34px;height:34px;border-radius:50%;background:conic-gradient(from 0deg,#d52b1e 0 25%,#eab308 25% 40%,#2f5d4f 40% 100%);margin-bottom:26px;box-shadow:0 4px 18px rgba(0,0,0,.15);}
  .splash-logo{max-width:min(420px,80vw);width:100%;height:auto;margin-bottom:30px;}
  .splash-title{
    font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;
    font-weight:700; letter-spacing:.02em; color:var(--ink);
    font-size:clamp(2.4rem, 9vw, 4.2rem); line-height:1.05; margin:0;
  }
  .splash-subtitle{
    font-family: ui-monospace, Menlo, monospace;
    text-transform:uppercase; letter-spacing:.22em; color:var(--gold);
    font-size:clamp(.9rem, 3vw, 1.15rem); margin:18px 0 0;
  }
  .splash-rule{width:64px;height:2px;background:var(--ink);margin:26px 0;opacity:.5;}
  .splash-hint{font-family:ui-monospace,Menlo,monospace;font-size:.72rem;color:var(--muted);letter-spacing:.08em;margin-top:40px;animation:splashPulse 2s ease-in-out infinite;}
  @keyframes splashPulse{0%,100%{opacity:.4;}50%{opacity:1;}}
  .splash-credit{
    position:fixed; bottom:22px; right:26px; z-index:51;
    font-family:ui-monospace,Menlo,monospace; letter-spacing:.05em;
    font-size:.8rem; color:var(--ink); opacity:.75;
    padding:6px 12px; border:1px solid var(--line); border-radius:3px; background:var(--card);
  }
</style>
</head>

[30, "La producción de un acto administrativo debe ajustarse, entre otros requisitos, al procedimiento:", ["Determinado únicamente por la costumbre local", "Fijado por el interesado", "Legalmente establecido", "Que discrecionalmente decida el órgano competente"], 2, "La producción del acto administrativo debe ajustarse, entre otros requisitos, al procedimiento legalmente establecido."],
[30, "Un acto administrativo dictado por órgano manifiestamente incompetente por razón de la materia o del territorio es:", ["Simplemente anulable", "Nulo de pleno derecho", "Plenamente válido y eficaz", "Inexistente sin consecuencias jurídicas"], 1, "Un acto dictado por órgano manifiestamente incompetente por razón de la materia o del territorio es nulo de pleno derecho."],
[31, "La falta de recusación de una autoridad afectada por una causa legal no impide:", ["La imposibilidad de recurrir la resolución", "La validez del acto en todo caso sin control", "Que los interesados puedan promoverla en cualquier momento de la tramitación", "Que el procedimiento se archive automáticamente"], 2, "La falta de recusación por la propia autoridad afectada no impide que los interesados puedan promoverla en cualquier momento de la tramitación."],
[31, "El principio de proporcionalidad en el procedimiento administrativo sancionador exige que la sanción sea:", ["Idéntica para todas las infracciones sin distinción", "Determinada de forma arbitraria", "Siempre la máxima prevista legalmente", "Adecuada a la gravedad del hecho constitutivo de la infracción"], 3, "El principio de proporcionalidad exige que la sanción sea adecuada a la gravedad del hecho constitutivo de la infracción."],
[32, "La aportación de documentos por los interesados durante la instrucción debe realizarse:", ["Antes del trámite de audiencia, salvo excepciones", "Exclusivamente en la fase de iniciación sin posibilidad posterior", "Solo tras dictarse la resolución definitiva", "Nunca, pues corresponde solo a la Administración"], 0, "La aportación de documentos por los interesados debe realizarse, con carácter general, antes del trámite de audiencia, salvo excepciones."],
[32, "La caducidad del procedimiento iniciado de oficio susceptible de producir efectos desfavorables se produce por:", ["La presentación de un recurso por el interesado", "El transcurso del plazo máximo sin haberse dictado resolución expresa", "La ausencia de pruebas practicadas", "La solicitud expresa del interesado"], 1, "La caducidad de un procedimiento iniciado de oficio susceptible de efectos desfavorables se produce por el transcurso del plazo máximo sin resolución expresa."],
[33, "La anulación de un acto en vía de recurso puede conllevar, en su caso:", ["La responsabilidad penal automática del funcionario", "La retroacción de actuaciones al momento en que se produjo el defecto", "La suspensión automática de cualquier otro procedimiento", "La nulidad de todo el ordenamiento jurídico aplicable"], 1, "La anulación de un acto en vía de recurso puede conllevar la retroacción de actuaciones al momento en que se produjo el defecto."],
[34, "La indemnización por responsabilidad patrimonial se calcula, entre otros criterios, con arreglo a:", ["La libre voluntad del reclamante sin ningún criterio objetivo", "La exclusiva capacidad económica de la Administración", "Un importe fijo idéntico en todos los casos", "Los criterios de valoración establecidos en la legislación fiscal, de expropiación forzosa y demás normas aplicables"], 3, "La indemnización se calcula, entre otros criterios, con arreglo a los de valoración establecidos en la legislación fiscal, de expropiación forzosa y demás normas aplicables."],
[15, "La aplicación presupuestaria es la unidad que identifica en el presupuesto de gastos:", ["Solo el importe total del presupuesto", "El nombre del funcionario responsable del gasto", "La clasificación orgánica, funcional y económica del crédito", "La fecha de aprobación del presupuesto"], 2, "La aplicación presupuestaria combina tres clasificaciones (quién gasta, para qué y en qué concepto) y es la unidad mínima de vinculación del crédito."],
[15, "La fase de autorización del gasto (fase A) supone:", ["El pago material al acreedor", "La recaudación del ingreso correspondiente", "El acto por el que se aprueba la realización de un gasto por una cuantía determinada", "El reconocimiento de la obligación frente a un tercero"], 2, "La autorización (A) es la primera fase: reserva el crédito pero todavía no vincula a la Administración con un tercero concreto."],
[15, "La fase de disposición o compromiso del gasto (fase D) implica:", ["El cobro efectivo de un derecho", "La simple previsión inicial del crédito", "La devolución de un ingreso indebido", "Un acto por el que se acuerda la realización de gastos previamente autorizados, vinculando a la Administración con un tercero"], 3, "La disposición (D) vincula ya jurídicamente a la Administración con el tercero, tras la autorización previa."],
[15, "El reconocimiento de la obligación (fase O) se produce cuando:", ["Se declara la existencia de un crédito exigible contra la Administración derivado de un gasto autorizado y comprometido", "Se aprueba el presupuesto anual", "Se recibe una factura sin verificar", "Se ordena el pago al acreedor"], 0, "El reconocimiento de la obligación (O) exige que se haya realizado la prestación o el derecho del acreedor, tras las fases A y D."],
[15, "La ordenación del pago (fase P) consiste en:", ["Aprobar el gasto inicialmente", "Fiscalizar el expediente de gasto", "Expedir la orden de pago contra la Tesorería a favor de los acreedores", "Comprometer el crédito presupuestario"], 2, "La ordenación del pago (P) es la última fase del ciclo ADOP: autorización, disposición, obligación y pago."],
[15, "Los créditos de compromiso son créditos que:", ["Permiten adquirir compromisos de gasto que se extenderán a ejercicios futuros", "Solo pueden emplearse dentro del ejercicio en curso", "No requieren autorización previa", "Se destinan exclusivamente a gastos de personal"], 0, "Se usan para gastos plurianuales, como obras o contratos de varios años, comprometiendo presupuesto de ejercicios futuros."],
[15, "Los pagos a justificar son aquellos que:", ["Nunca requieren justificación posterior", "Solo se destinan a gastos de inversión", "Se libran sin la previa aportación de documentos justificativos, quedando obligado el perceptor a justificarlos posteriormente", "Se realizan siempre tras la fiscalización completa del gasto"], 2, "Son una excepción al procedimiento ordinario para gastos urgentes o de difícil justificación previa, con obligación de rendir cuentas después."],
[15, "Los anticipos de caja fija (fondos anticipados) se destinan a:", ["Financiar inversiones de gran cuantía", "Atender gastos periódicos o repetitivos de carácter menor", "Pagar exclusivamente subvenciones", "Sustituir la totalidad del presupuesto de gastos"], 1, "Son provisiones de fondos para gastos corrientes de escasa cuantía y repetitivos (material de oficina, pequeñas reparaciones, etc.)."],
[15, "La vinculación jurídica de los créditos determina:", ["La fecha límite de gasto en el ejercicio", "El importe exacto de cada factura", "El nivel en que los créditos presupuestarios tienen carácter limitativo y vinculante", "El responsable político del gasto"], 2, "Determina hasta qué nivel de desagregación (capítulo, artículo, concepto...) el crédito no puede superarse sin modificación presupuestaria."],
[15, "La referencia de intervención en un expediente de gasto hace alusión a:", ["El código de la partida de ingresos", "La identificación del acto de control o fiscalización realizado por el órgano interventor", "La firma del responsable del área usuaria", "El número de expediente judicial asociado"], 1, "Es la marca que deja el órgano de control interno (Intervención) al fiscalizar el expediente antes de continuar su tramitación."],
[15, "Los residuos de gastos hacen referencia a:", ["Ingresos pendientes de cobro", "Gastos anulados definitivamente sin posibilidad de reclamación", "Créditos ampliables sin límite", "Obligaciones reconocidas y no pagadas o gastos comprometidos no realizados que se incorporan al ejercicio siguiente"], 3, "Permiten que gastos ya autorizados/comprometidos en un ejercicio, pero no completados, continúen tramitándose en el siguiente."],
[15, "La ejecución del presupuesto de gastos sigue, con carácter general, la secuencia de fases:", ["Solo la fase de pago, sin trámites previos", "Recaudación, liquidación, ingreso y compromiso", "Autorización, disposición, reconocimiento de la obligación y ordenación del pago", "Ordenación, disposición, autorización y reconocimiento"], 2, "Es el conocido ciclo ADOP: A-D-O-P, en ese orden estricto."],
[16, "Los derechos reconocidos, en el presupuesto de ingresos, son:", ["Los ingresos previstos en el anteproyecto de presupuesto", "Los créditos a favor de la Administración una vez practicada la liquidación del ingreso correspondiente", "Los créditos vencidos y prescritos", "Solo los ingresos ya recaudados en efectivo"], 1, "Es el equivalente, en ingresos, a la fase de 'obligación reconocida' en gastos: existe ya un derecho de cobro liquidado."],
[16, "Las fases de ejecución del presupuesto de ingresos incluyen, entre otras:", ["La fiscalización previa exclusivamente", "El reconocimiento del derecho y la recaudación", "Únicamente la fase de disposición", "Únicamente la fase de ordenación del pago"], 1, "El ciclo de ingresos es más simple que el de gastos: liquidación/reconocimiento del derecho y recaudación."],
[16, "La devolución de ingresos indebidos procede cuando:", ["Se supera el presupuesto anual de gastos", "El contribuyente lo solicita sin ninguna justificación", "El ejercicio presupuestario ha finalizado", "Se ha producido un ingreso en la Tesorería que no correspondía o excedía de lo debido"], 3, "Corrige un ingreso erróneo o excesivo, devolviendo al interesado la cantidad indebidamente percibida por la Administración."],
[16, "Los derechos reconocidos pendientes de cobro son aquellos que:", ["Han sido liquidados pero aún no se ha producido su recaudación efectiva", "Ya han sido cobrados y contabilizados como ingreso definitivo", "Corresponden a gastos ya pagados", "Nunca podrán ser exigidos"], 0, "Representan la diferencia entre lo ya liquidado (derecho reconocido) y lo efectivamente cobrado (recaudación)."],
[16, "Los ingresos públicos se clasifican, entre otros criterios, en:", ["Ingresos tributarios, patrimoniales y por operaciones financieras, entre otros", "Solo ingresos por multas", "Solo ingresos tributarios", "Solo transferencias del Estado"], 0, "La clasificación económica de ingresos incluye varios capítulos: impuestos, tasas, transferencias, ingresos patrimoniales, operaciones financieras, etc."],
[16, "Los documentos contables de ingresos permiten, entre otras funciones:", ["Sustituir el presupuesto de gastos", "Aprobar el gasto público", "Reflejar el reconocimiento del derecho y la recaudación del ingreso", "Fiscalizar la nómina del personal"], 2, "Son el soporte documental que registra contablemente cada fase de la ejecución del ingreso."],
[16, "La recaudación en período voluntario de un ingreso público se caracteriza por:", ["Realizarse dentro del plazo señalado sin recargos ni intereses de demora", "Ser posterior al período ejecutivo", "No requerir liquidación previa", "Aplicar siempre recargo de apremio"], 0, "Es la recaudación normal dentro de plazo; si no se paga, se pasa a período ejecutivo con recargos."],
[16, "El presupuesto de ingresos de una Administración recoge:", ["Únicamente los gastos de personal", "La previsión de los recursos económicos que se estima obtener durante el ejercicio", "El balance de situación patrimonial", "La ejecución final del gasto del año anterior"], 1, "Es la contrapartida del presupuesto de gastos: estimación de recursos que financiarán el gasto previsto."],
[17, "La relación de puestos de trabajo (RPT) es el instrumento que:", ["Sustituye a la ley de presupuestos", "Regula exclusivamente el régimen disciplinario", "Fija únicamente el horario laboral", "Ordena el conjunto de puestos de trabajo de la Administración, definiendo sus características esenciales"], 3, "La RPT es el instrumento técnico básico de organización del personal: define denominación, cuerpo, nivel, forma de provisión, etc. de cada puesto."],
[17, "La clasificación en Cuerpos y Escalas de la Administración de la Comunidad Autónoma de Euskadi se rige por:", ["El Código Civil", "La normativa de contratos del sector público", "El Estatuto de los Trabajadores exclusivamente", "La Ley de Cuerpos y Escalas de la Administración de la Comunidad Autónoma de Euskadi"], 3, "Es la norma específica vasca que estructura los cuerpos y escalas de la función pública autonómica."],
[17, "La relación de puestos de trabajo debe contener, entre otros datos:", ["Solo la fecha de creación del organismo", "La denominación del puesto, el cuerpo o escala de adscripción y el sistema de provisión", "Exclusivamente el presupuesto de personal", "Únicamente el nombre del titular del puesto"], 1, "La RPT recoge datos estructurales del puesto, no de la persona concreta que lo ocupa en cada momento."],
[17, "La estructura del empleo público vasco se organiza, entre otros, en función de:", ["El sindicato de afiliación del empleado", "Cuerpos, escalas y grupos de clasificación profesional", "La antigüedad exclusivamente", "Un único cuerpo general sin distinción de escalas"], 1, "La clasificación profesional se basa en cuerpos/escalas (por especialización) y grupos (por titulación exigida)."],
[17, "La modificación de la relación de puestos de trabajo corresponde, con carácter general:", ["Al órgano competente en materia de función pública, conforme al procedimiento establecido", "A los sindicatos de forma exclusiva y vinculante", "A los usuarios de los servicios públicos", "A cualquier empleado público a título individual"], 0, "Es un acto de organización que corresponde a la Administración, con la negociación colectiva que proceda, no una decisión individual."],
[17, "Los grupos de clasificación profesional del personal funcionario se determinan, entre otros criterios, según:", ["El número de hijos a cargo", "El estado civil del empleado", "El lugar de residencia del funcionario", "La titulación exigida para el ingreso"], 3, "El grupo (A1, A2, C1, C2...) depende del nivel de titulación académica requerido para acceder al cuerpo o escala."],
[18, "El acceso al empleo público se rige, entre otros, por el principio de:", ["Libre designación sin concurrencia", "Igualdad, mérito y capacidad", "Antigüedad exclusiva sin otros criterios", "Discrecionalidad absoluta del órgano convocante"], 1, "Es un principio constitucional (art. 103.3 CE) aplicable a todo acceso a la función pública."],
[18, "Los sistemas selectivos de acceso al empleo público incluyen, entre otros:", ["La libre designación exclusivamente", "La cooptación entre funcionarios", "Únicamente el sorteo", "La oposición, el concurso y el concurso-oposición"], 3, "Son los tres sistemas selectivos clásicos regulados en la normativa de función pública."],
[18, "La provisión de puestos de trabajo puede realizarse, entre otros sistemas, mediante:", ["Exclusivamente por antigüedad", "El concurso de méritos y la libre designación", "Solo mediante oposición libre", "Únicamente por sorteo público"], 1, "A diferencia del acceso al cuerpo (oposición), la provisión del puesto concreto usa concurso o libre designación."],
[18, "La situación administrativa de servicio activo implica que el funcionario:", ["Está jubilado", "Ha perdido la condición de funcionario", "Presta efectivamente sus servicios en el puesto que ocupa", "Se encuentra suspendido de funciones"], 2, "Es la situación 'normal': el funcionario desempeña su puesto de trabajo con plenitud de derechos y deberes."],
[18, "La excedencia voluntaria es una situación administrativa en la que el funcionario:", ["Se encuentra en prisión provisional", "Percibe siempre el cien por cien de sus retribuciones", "Es expulsado definitivamente del cuerpo", "No presta servicio activo por decisión propia, con reserva o no del puesto según la modalidad"], 3, "Existen distintas modalidades de excedencia voluntaria, algunas con reserva de plaza y otras sin ella."],
[18, "Los servicios especiales, como situación administrativa, se declaran, entre otros supuestos, cuando el funcionario:", ["Solicita un permiso de pocos días", "Se traslada de localidad dentro del mismo cuerpo", "Comete una falta disciplinaria leve", "Es nombrado para un cargo político o de alta responsabilidad"], 3, "Se reconoce, entre otros casos, a quienes son nombrados altos cargos, conservando derechos como el cómputo de antigüedad."],
[18, "La suspensión de funciones, como situación administrativa, puede tener origen:", ["Exclusivamente por jubilación", "Únicamente voluntario a petición del interesado", "Disciplinario o preventivo, mientras se tramita un procedimiento", "Solo por concurso de traslados"], 2, "Puede imponerse como sanción firme o como medida cautelar durante la tramitación de un expediente."],
[18, "El sistema de concurso para la provisión de puestos de trabajo valora fundamentalmente:", ["La pertenencia a un sindicato determinado", "Los méritos y capacidades de los candidatos, conforme al baremo de la convocatoria", "Únicamente la antigüedad en el cuerpo", "El lugar de nacimiento del candidato"], 1, "El concurso se resuelve mediante un baremo objetivo de méritos (formación, experiencia, etc.) fijado en la convocatoria."],
[19, "La gestión de la documentación en los archivos de oficina tiene como finalidad principal:", ["Publicar automáticamente los expedientes en el Boletín Oficial", "Sustituir el registro de entrada de documentos", "Organizar y conservar la documentación generada en la tramitación de los asuntos hasta su transferencia o eliminación", "Eliminar sistemáticamente toda la documentación anual"], 2, "El archivo de oficina es la primera fase del ciclo vital del documento, mientras el expediente sigue activo o recién cerrado."],
[19, "El Sistema de Archivo de la Administración Pública de la Comunidad Autónoma de Euskadi tiene por objeto:", ["Gestionar únicamente la nómina del personal", "Sustituir la sede electrónica", "Organizar de forma integral el ciclo de vida de los documentos, desde su creación hasta su conservación permanente o eliminación", "Regular exclusivamente los archivos históricos"], 2, "Cubre todo el ciclo vital: archivo de gestión, intermedio e histórico, en soporte papel y electrónico."],
[19, "La documentación electrónica en la gestión de archivos de oficina exige garantizar, entre otros aspectos:", ["Que se conserve exclusivamente en soporte papel", "Su eliminación automática tras la resolución del expediente", "Su autenticidad, integridad y disponibilidad a lo largo del tiempo", "Que no exista ningún control de acceso"], 2, "Son las garantías básicas de preservación digital a largo plazo (autenticidad, integridad, disponibilidad, confidencialidad)."],
[19, "El calendario de conservación y acceso a la documentación establece:", ["Los plazos de transferencia, conservación, acceso y eliminación de las series documentales", "La estructura orgánica del departamento", "Únicamente el horario de atención al público", "El sueldo del personal de archivo"], 0, "Es la herramienta que fija, para cada serie documental, cuándo se transfiere, cuánto se conserva y cuándo se elimina o conserva permanentemente."],
[19, "El ciclo vital de los documentos administrativos comprende, entre otras, las fases de:", ["Únicamente la fase de destrucción inmediata", "Exclusivamente la fase de digitalización", "Archivo de gestión, archivo intermedio y archivo histórico o definitivo", "Solo la fase de creación del documento"], 2, "Es el modelo clásico de las tres edades del documento archivístico."],
[19, "Una serie documental se define como:", ["El índice del expediente electrónico", "El conjunto de documentos producidos de manera continuada como resultado de una misma actividad o función administrativa", "Un documento único e irrepetible", "Un tipo de firma electrónica avanzada"], 1, "Es la unidad básica de clasificación archivística: documentos generados repetidamente por una misma función (por ejemplo, expedientes de subvenciones)."],
[20, "El Sistema de Intercambio Registral (SIR) tiene como finalidad:", ["Eliminar el registro de entrada y salida", "Gestionar exclusivamente la contabilidad pública", "Permitir el intercambio de asientos registrales entre las distintas Administraciones Públicas conectadas", "Sustituir la sede electrónica de cada organismo"], 2, "El SIR conecta los registros de distintas Administraciones para remitirse documentos entre sí de forma electrónica y con validez de registro."],
[20, "Los registros electrónicos de entrada y salida de documentos permiten:", ["Eliminar la necesidad de identificación del interesado", "Prescindir del cómputo de plazos administrativos", "Sustituir el archivo definitivo de los expedientes", "Dejar constancia oficial de la recepción o remisión de documentos, con indicación de fecha y hora"], 3, "La fecha y hora del asiento registral es clave para el cómputo de plazos del procedimiento."],
[20, "La interoperabilidad entre sistemas de información de distintas Administraciones tiene como objetivo:", ["Permitir la relación, el intercambio de información y la prestación conjunta de servicios entre Administraciones", "Impedir el acceso electrónico de la ciudadanía", "Centralizar toda la información en un único registro sin posibilidad de intercambio", "Eliminar los estándares técnicos comunes"], 0, "Busca que sistemas distintos 'se entiendan' entre sí, evitando que la ciudadanía tenga que aportar datos que ya obran en otra Administración."],
[20, "Los registros electrónicos generales de la Comunidad Autónoma de Euskadi permiten, entre otras funciones:", ["La eliminación automática de los documentos tras su registro", "Solo la recepción de documentos dirigidos al propio organismo", "La presentación de solicitudes, escritos y comunicaciones dirigidos a cualquier Administración", "Únicamente la recepción de documentos en papel"], 2, "Gracias a la interconexión de registros, se puede presentar documentación dirigida a otra Administración distinta."],
[20, "El asiento registral de un documento recoge, entre otros datos:", ["El importe económico del expediente exclusivamente", "Un número, epígrafe expresivo del contenido y la fecha y hora de presentación", "Solo el nombre del funcionario que lo tramita", "La resolución final del procedimiento"], 1, "Estos datos permiten identificar y localizar el documento, así como acreditar el momento exacto de su presentación."],
[20, "La interoperabilidad se clasifica habitualmente en las siguientes dimensiones:", ["Organizativa, semántica y técnica", "Únicamente técnica", "Exclusivamente jurídica", "Solo económica"], 0, "Son las tres dimensiones clásicas del Esquema Nacional de Interoperabilidad."],
[24, "La ciudadanía, como destinataria de los servicios y prestaciones públicas, tiene derecho, entre otros, a:", ["Exigir la gratuidad de cualquier tasa administrativa", "Obtener resolución inmediata de cualquier solicitud sin trámite", "Recibir una atención de calidad y adaptada a sus necesidades", "Elegir personalmente al funcionario que le atienda"], 2, "El derecho a una atención de calidad es un principio general de las cartas de servicios y la normativa de atención ciudadana."],
[24, "La atención ante quejas y reclamaciones de la ciudadanía debe caracterizarse por:", ["El traslado sin registro a otro organismo", "La ausencia de respuesta al interesado", "La negación sistemática de cualquier responsabilidad", "La escucha activa, el registro adecuado y la información sobre el cauce de tramitación"], 3, "Una buena praxis de atención exige escuchar, registrar formalmente la queja e informar sobre cómo se tramitará."],
[24, "La atención a personas con discapacidad en las dependencias administrativas exige garantizar:", ["La reducción del tiempo de atención respecto a otras personas", "La atención exclusivamente telefónica", "La accesibilidad universal, física, sensorial y cognitiva", "La exigencia de acompañante obligatorio en todo caso"], 2, "La accesibilidad universal cubre tanto barreras físicas como de comunicación (sensorial, cognitiva)."],
[24, "La atención intercultural en la Administración vasca implica, entre otros aspectos:", ["Excluir a la población extranjera de los servicios públicos", "Adaptar la comunicación y los servicios a la diversidad cultural y lingüística de la ciudadanía", "Limitar la atención únicamente al euskera", "Exigir siempre la contratación de un traductor jurado"], 1, "Se trata de adaptar la atención (lenguaje, mediación cultural si procede) sin excluir a nadie ni imponer trámites innecesarios."],
[24, "La información y atención al público, como función de la Administración, debe prestarse conforme a los principios de:", ["Exclusividad para determinados colectivos", "Discrecionalidad absoluta sin criterios uniformes", "Confidencialidad total frente al interesado", "Claridad, veracidad y accesibilidad"], 3, "Son los principios básicos de cualquier servicio de información administrativa de calidad."],
[24, "Ante una reclamación por demora en la tramitación de un expediente, la actuación adecuada del personal de atención es:", ["Negar cualquier información sobre el expediente", "Derivar la reclamación sin registrar la incidencia", "Prometer una resolución inmediata sin base real", "Informar del estado real de tramitación y de los cauces de reclamación disponibles"], 3, "La transparencia sobre el estado real del expediente es preferible a promesas que luego no se pueden cumplir."],
[24, "La Carta de Servicios de un organismo público tiene como finalidad:", ["Sustituir la normativa reguladora del procedimiento", "Establecer el presupuesto anual del organismo", "Fijar el régimen disciplinario del personal", "Informar a la ciudadanía sobre los servicios prestados y los compromisos de calidad asumidos"], 3, "Es un instrumento de transparencia y calidad que recoge compromisos concretos y medibles frente a la ciudadanía."],
[24, "Los canales de atención a la ciudadanía en la Administración vasca incluyen habitualmente:", ["Únicamente la atención presencial", "Solo el correo postal ordinario", "Exclusivamente redes sociales privadas", "La atención presencial, telefónica y electrónica"], 3, "La multicanalidad es un principio habitual de la atención ciudadana moderna."],

[7, "Conforme al Reglamento de actuación y funcionamiento del sector público por medios electrónicos (RD 203/2021), la actuación administrativa automatizada requiere:", ["La intervención manual de un funcionario en cada acto", "La renuncia expresa del interesado a la vía electrónica", "La imposibilidad de recurrir el acto resultante", "Que se establezcan las especificaciones, programación, mantenimiento y supervisión de la aplicación empleada"], 3, "La actuación administrativa automatizada exige garantías técnicas y de supervisión, aunque no intervenga una persona en cada acto concreto."],
[8, "La Ley 10/1982, de 24 de noviembre, básica de normalización del uso del Euskera, tiene como objetivo fundamental:", ["Regular exclusivamente la enseñanza universitaria", "Suprimir el castellano como lengua oficial", "Regular la cooficialidad y el proceso de normalización del euskera en la Comunidad Autónoma", "Establecer el régimen sancionador en materia lingüística"], 2, "Es la ley marco que desarrolla el mandato estatutario de cooficialidad del euskera y el castellano en la CAE."],
[8, "El Decreto 19/2024, de 22 de febrero, regula:", ["La normalización del uso del euskera en el Sector Público Vasco", "El régimen de bibliotecas de Euskadi", "La normalización del euskera en la enseñanza no universitaria", "El Concierto Económico"], 0, "Es una norma reciente que actualiza los criterios de uso y normalización del euskera en el conjunto del sector público vasco."],
[8, "Conforme a la Ley 10/1982, la cooficialidad del euskera implica que la ciudadanía tiene derecho a:", ["Elegir un tercer idioma oficial en la Administración", "Usar tanto el euskera como el castellano en sus relaciones con la Administración", "Usar exclusivamente el castellano en cualquier trámite", "Usar exclusivamente el euskera en cualquier trámite"], 1, "La cooficialidad garantiza el derecho de la ciudadanía a relacionarse con la Administración en cualquiera de las dos lenguas oficiales."],
[9, "La Ley 11/2022, de 1 de diciembre, de Empleo Público Vasco, tiene por objeto:", ["Regular exclusivamente el régimen presupuestario", "Regular el régimen del empleo público de las Administraciones Públicas vascas", "Aprobar el Estatuto de Autonomía", "Regular únicamente el personal laboral privado"], 1, "Es la norma vasca más reciente y completa sobre función pública, adaptando el Estatuto Básico del Empleado Público (TREBEP) al ámbito autonómico."],
[9, "El Real Decreto Legislativo 5/2015 aprueba el texto refundido de:", ["La Ley General Presupuestaria", "La Ley de Procedimiento Administrativo Común", "La Ley del Estatuto Básico del Empleado Público (TREBEP)", "La Ley de Bases del Régimen Local"], 2, "El TREBEP es la norma básica estatal aplicable a todo el personal empleado público, sin perjuicio de su desarrollo autonómico."],
[9, "El TREBEP clasifica al personal al servicio de las Administraciones Públicas, entre otras categorías, en:", ["Solo personal laboral", "Exclusivamente altos cargos", "Funcionarios de carrera, funcionarios interinos, personal laboral y personal eventual", "Únicamente funcionarios de carrera"], 2, "Es la clasificación básica común a todas las Administraciones Públicas españolas."],
[9, "Conforme al TREBEP, los principios éticos del personal al servicio de las Administraciones Públicas incluyen, entre otros:", ["La confidencialidad frente a los órganos de fiscalización", "La subordinación exclusiva a intereses partidistas", "La discrecionalidad absoluta sin control", "La objetividad, integridad y transparencia"], 3, "El TREBEP dedica un capítulo específico al código de conducta de los empleados públicos, con principios éticos y de conducta."],
[10, "El Reglamento (UE) 2016/679 es conocido comúnmente como:", ["Reglamento de Transparencia", "Reglamento de Administración Electrónica", "Reglamento de Interoperabilidad", "Reglamento General de Protección de Datos (RGPD)"], 3, "El RGPD es la norma europea directamente aplicable en materia de protección de datos personales desde el 25 de mayo de 2018."],
[10, "La Ley Orgánica 3/2018, de 5 de diciembre, tiene por objeto:", ["Regular exclusivamente la Administración electrónica", "Adaptar el ordenamiento español al RGPD y garantizar los derechos digitales", "Regular el régimen de incompatibilidades del personal público", "Aprobar el régimen de transparencia"], 1, "La LOPDGDD completa y adapta al ordenamiento español las disposiciones del RGPD, además de reconocer nuevos derechos digitales."],
[10, "Según el RGPD, el responsable del tratamiento de datos personales es:", ["Quien únicamente trata los datos por cuenta de otro", "El propio interesado titular de los datos", "La autoridad de control en materia de protección de datos", "Quien determina los fines y medios del tratamiento"], 3, "Se diferencia del 'encargado del tratamiento', que trata datos por cuenta del responsable, siguiendo sus instrucciones."],
[10, "Entre los derechos digitales reconocidos por la LOPDGDD se encuentra:", ["El derecho de sufragio activo", "El derecho a la desconexión digital en el ámbito laboral", "El derecho a la libre circulación de mercancías", "El derecho a la propiedad privada"], 1, "La LOPDGDD incorpora un título específico de derechos digitales, entre ellos la desconexión digital, la neutralidad de la red o el testamento digital."],
[11, "La Ley 31/1995, de 8 de noviembre, de Prevención de Riesgos Laborales, tiene como principio básico:", ["Fijar el salario mínimo interprofesional", "Garantizar la seguridad y la salud de los trabajadores en el desempeño de su trabajo", "Regular exclusivamente las relaciones laborales colectivas", "Regular el régimen de la Seguridad Social"], 1, "Es la norma marco estatal en materia de prevención de riesgos laborales, aplicable tanto al sector privado como a las Administraciones Públicas."],
[11, "Conforme a la Ley 31/1995, la evaluación de riesgos laborales debe realizarse:", ["Nunca, si la empresa tiene menos de 10 empleados", "Únicamente si lo solicita el trabajador", "Inicialmente y actualizarse cuando cambien las condiciones de trabajo", "Solo una vez, al iniciar la actividad, sin necesidad de actualización"], 2, "La evaluación inicial de riesgos debe revisarse cuando cambien las condiciones de trabajo o se detecten daños a la salud."],
[11, "Los delegados de prevención, conforme a la Ley 31/1995, son:", ["Los representantes de los trabajadores con funciones específicas en materia de prevención de riesgos laborales", "Cargos de libre designación de la empresa", "Inspectores de trabajo destinados en la empresa", "Miembros del comité de empresa sin funciones específicas"], 0, "Son elegidos entre los representantes del personal para ejercer funciones específicas de representación en materia preventiva."],
[12, "El Real Decreto 488/1997, de 14 de abril, regula:", ["Las disposiciones mínimas de seguridad y salud relativas al trabajo con equipos que incluyen pantallas de visualización", "El régimen de accidentes de trabajo", "La formación continua del personal", "La prevención de riesgos laborales con carácter general"], 0, "Desarrolla específicamente la Ley 31/1995 en lo relativo a los riesgos derivados del trabajo con pantallas de visualización de datos."],
[12, "Según la normativa sobre pantallas de visualización de datos, la empresa debe garantizar al trabajador, entre otras medidas:", ["La prohibición absoluta de usar pantallas más de una hora al día", "Interrupciones periódicas o cambios de actividad que reduzcan la carga del trabajo con pantallas", "La eliminación de cualquier descanso durante la jornada", "La sustitución obligatoria de toda pantalla cada seis meses"], 1, "El RD 488/1997 exige organizar el trabajo de forma que existan pausas o cambios de actividad que atenúen la carga visual y postural."],
[13, "Ante una parada cardíaca extrahospitalaria, la actuación inmediata prioritaria es:", ["Esperar la llegada de personal sanitario sin intervenir", "Iniciar la reanimación cardiopulmonar y activar el sistema de emergencias", "Administrar medicación sin supervisión", "Trasladar a la persona por medios propios sin avisar a emergencias"], 1, "La cadena de supervivencia exige el reconocimiento precoz, la activación de emergencias y el inicio inmediato de RCP por parte de cualquier testigo."],
[13, "En la cadena de supervivencia ante una parada cardiorrespiratoria, el uso de un desfibrilador externo automático (DEA) debe realizarse:", ["Nunca antes de que llegue la ambulancia", "Únicamente en el hospital", "Lo antes posible, en cuanto esté disponible, combinado con las compresiones torácicas", "Solo por personal médico especializado"], 2, "La desfibrilación precoz es una de las claves de la cadena de supervivencia y puede ser usada por personal no sanitario entrenado."],
[14, "La Ley 19/2013, de 9 de diciembre, regula:", ["La transparencia, el acceso a la información pública y el buen gobierno", "El régimen presupuestario del Estado", "La protección de datos personales", "La Administración electrónica"], 0, "Es la ley estatal básica en materia de transparencia, aplicable con carácter supletorio y de mínimos a todas las Administraciones."],
[14, "Conforme a la Ley 19/2013, la publicidad activa consiste en:", ["La prohibición de publicar información sin autorización judicial", "La obligación de las Administraciones de publicar de oficio determinada información, sin necesidad de solicitud previa", "La obligación del ciudadano de solicitar siempre por escrito la información", "La publicación exclusiva de los presupuestos anuales"], 1, "Se diferencia del derecho de acceso a la información pública, que se ejerce mediante solicitud; la publicidad activa es proactiva."],
[14, "El derecho de acceso a la información pública, regulado en la Ley 19/2013, puede ser ejercido por:", ["Únicamente las personas directamente afectadas por la información", "Solo periodistas acreditados", "Cualquier persona, sin necesidad de motivar su solicitud", "Exclusivamente los cargos electos"], 2, "Es un derecho de titularidad universal, sin necesidad de acreditar un interés específico, aunque sujeto a los límites legalmente establecidos."],
[14, "El 'buen gobierno', como parte del contenido de la Ley 19/2013, establece:", ["Principios éticos y de actuación que deben guiar a los altos cargos de las Administraciones Públicas", "El régimen sancionador tributario", "El régimen retributivo del personal funcionario", "El sistema electoral municipal"], 0, "Incluye principios generales y de actuación (objetividad, transparencia, responsabilidad) exigibles a los altos cargos."],
[15, "El Decreto Legislativo 1/1997, de 11 de noviembre, aprueba el texto refundido de:", ["La Ley de Empleo Público Vasco", "La Ley del Sector Público Vasco", "El Concierto Económico", "La Ley de Principios Ordenadores de la Hacienda General del País Vasco"], 3, "Es la norma marco que regula los principios generales de la Hacienda General del País Vasco, incluida la actividad económico-financiera."],
[15, "El Decreto Legislativo 1/2011, de 24 de mayo, regula:", ["La protección de datos en el ámbito presupuestario", "El régimen de contratación pública", "El régimen de recaudación tributaria", "El régimen presupuestario de Euskadi, incluyendo fundaciones y consorcios del sector público autonómico"], 3, "Contiene el texto refundido de las disposiciones sobre régimen presupuestario aplicables a la Administración General y su sector público."],
[15, "La Ley 8/1996, de 8 de noviembre, de Finanzas de la Comunidad Autónoma de Euskadi, regula fundamentalmente:", ["La normalización del euskera", "El régimen de empleo público", "El sistema financiero y presupuestario de la Comunidad Autónoma de Euskadi", "El régimen de bibliotecas"], 2, "Es una de las normas base del sistema financiero vasco, junto con el Decreto Legislativo 1/1997 y el régimen presupuestario."],
[15, "El Decreto Legislativo 2/2017, de 19 de octubre, aprueba el texto refundido de la Ley de:", ["Instituciones Locales de Euskadi", "Control Económico y Contabilidad de la Comunidad Autónoma de Euskadi", "Empleo Público Vasco", "Administración Electrónica"], 1, "Regula el sistema de control económico interno (función interventora) y la contabilidad pública de la CAE."],
[15, "La función interventora, en el marco del control económico de la Hacienda vasca, tiene como finalidad principal:", ["Ejercer funciones exclusivamente de auditoría externa posterior", "Fiscalizar previamente los actos que dan lugar al reconocimiento de derechos y obligaciones económicas", "Aprobar directamente el presupuesto anual", "Sustituir al Parlamento Vasco en el control del gasto"], 1, "El control interno mediante la función interventora es un mecanismo de fiscalización previa dentro de la propia Administración."],
[16, "El Decreto 1/2021, de 12 de enero, aprueba el Reglamento de:", ["Bibliotecas de Euskadi", "Protección de Datos de la CAE", "Empleo Público Vasco", "Recaudación de la Hacienda General del País Vasco"], 3, "Desarrolla el procedimiento de recaudación, tanto en período voluntario como ejecutivo, de los ingresos de derecho público vascos."],
[16, "El período ejecutivo de recaudación conlleva, con carácter general:", ["La exigencia de recargos e intereses de demora sobre la deuda no satisfecha en plazo", "La prescripción inmediata del derecho de cobro", "La paralización de cualquier actuación de la Administración", "La condonación automática de la deuda"], 0, "El impago en período voluntario abre el período ejecutivo, con recargos crecientes según el momento del pago."],
[16, "Los principios ordenadores de la Hacienda General del País Vasco incluyen, entre otros:", ["La ausencia total de control presupuestario", "La libre disposición de fondos sin límite alguno", "La unidad de caja y la anualidad presupuestaria", "La inexistencia de contabilidad pública"], 2, "Son principios clásicos de la hacienda pública (unidad de caja, anualidad, especialidad, entre otros) recogidos en el Decreto Legislativo 1/1997."],
[17, "La Ley 11/2022, de Empleo Público Vasco, regula, entre otros aspectos:", ["Exclusivamente el régimen retributivo estatal", "El régimen electoral autonómico", "La ordenación, planificación y gestión de los recursos humanos de las Administraciones Públicas vascas", "El régimen de contratos del sector público"], 2, "Es la norma vasca de referencia en materia de empleo público, en desarrollo del TREBEP."],
[17, "Conforme al TREBEP, los cuerpos y escalas se agrupan en distintos grupos de clasificación profesional en función de:", ["El destino geográfico del puesto", "El número de méritos acreditados", "La antigüedad del funcionario", "La titulación exigida para el ingreso"], 3, "El TREBEP establece los grupos A1, A2, C1, C2 y Agrupaciones Profesionales según la titulación exigida."],
[18, "La Ley 11/2022 de Empleo Público Vasco regula la provisión de puestos de trabajo, entre otros, a través de:", ["Solo mediante herencia del puesto", "Exclusivamente por decisión sindical", "Únicamente el sorteo entre aspirantes", "El concurso de méritos y la libre designación"], 3, "Mantiene los sistemas clásicos de provisión (concurso y libre designación) previstos también en el TREBEP."],
[18, "Conforme al TREBEP, la evaluación del desempeño del personal funcionario:", ["Solo puede aplicarse al personal laboral", "Es un instrumento para medir la conducta profesional y el rendimiento o logro de resultados", "Sustituye completamente al régimen disciplinario", "Está prohibida por la normativa de función pública"], 1, "El TREBEP introduce la evaluación del desempeño como herramienta de gestión de recursos humanos, vinculada a la carrera profesional."],
[19, "El Decreto 91/2023, de atención integral y multicanal a la ciudadanía, contempla el acceso a los servicios públicos, entre otros medios, por:", ["Vía electrónica, presencial y telefónica de forma integrada", "Exclusivamente por correo postal", "Solo mediante cita previa presencial", "Únicamente vía electrónica"], 0, "Este decreto vasco consolida un modelo de atención integral que combina distintos canales de forma coordinada."],
[20, "El Real Decreto 203/2021 regula, entre otros aspectos, el funcionamiento de:", ["Los registros electrónicos y las sedes electrónicas del sector público", "El régimen notarial", "El régimen de propiedad industrial", "Los registros civiles exclusivamente"], 0, "Desarrolla, junto a otros aspectos, el funcionamiento electrónico de registros, sedes y archivos del sector público."],
[21, "La Ley 39/2015, de 1 de octubre, regula:", ["El Régimen Jurídico del Sector Público", "La Prevención de Riesgos Laborales", "El Procedimiento Administrativo Común de las Administraciones Públicas", "La Protección de Datos Personales"], 2, "Es la ley básica estatal (LPAC) que regula el procedimiento administrativo aplicable a todas las Administraciones Públicas."],
[21, "Conforme a la Ley 39/2015, el expediente administrativo electrónico se forma mediante:", ["Actas notariales obligatorias en todo caso", "Documentos exclusivamente en soporte papel", "La agregación ordenada de documentos, pruebas e informes en un índice electrónico firmado", "La simple acumulación de archivos sin ningún orden"], 2, "El artículo 70 LPAC exige que el expediente electrónico se forme mediante un índice electrónico firmado que garantice su integridad."],
[22, "La Ley 39/2015 admite, entre los sistemas de firma electrónica de las personas interesadas, los siguientes:", ["Solo el certificado electrónico cualificado", "Exclusivamente la firma biométrica", "Sistemas de firma electrónica cualificada, avanzada y otros sistemas como claves concertadas", "Únicamente la firma manuscrita digitalizada"], 2, "El artículo 10 LPAC admite distintos sistemas de identificación y firma, no solo el certificado cualificado."],
[23, "Conforme a la Ley 39/2015, las personas físicas podrán elegir en todo caso:", ["Relacionarse con las Administraciones Públicas a través de medios electrónicos o presenciales, salvo obligación de relacionarse electrónicamente", "Relacionarse exclusivamente de forma presencial", "Relacionarse exclusivamente por vía electrónica", "No poder ejercer ningún derecho de acceso a archivos"], 0, "El artículo 14 LPAC reconoce este derecho de elección a las personas físicas, salvo que estén obligadas a relacionarse electrónicamente."],
[23, "Están obligados a relacionarse electrónicamente con las Administraciones Públicas, conforme a la Ley 39/2015, entre otros:", ["Únicamente las personas mayores de 65 años", "Exclusivamente las personas con discapacidad", "Las personas jurídicas y los empleados públicos, en los trámites relacionados con su condición de funcionario", "Todas las personas físicas sin excepción"], 2, "El artículo 14.2 LPAC establece la obligación electrónica para determinados colectivos, incluidas las personas jurídicas."],
[24, "El derecho de la ciudadanía a no aportar documentos que ya obren en poder de la Administración actuante se recoge en:", ["El RGPD", "El artículo 103 de la Constitución", "El artículo 28 de la Ley 39/2015", "La Ley 19/2013 de Transparencia"], 2, "Este derecho, que evita duplicidades y cargas innecesarias, está expresamente recogido en la LPAC."],
[25, "Las notificaciones electrónicas practicadas por las Administraciones Públicas se entienden rechazadas, conforme a la Ley 39/2015, cuando:", ["Nunca se pueden considerar rechazadas", "El interesado lo solicita expresamente", "Transcurre un año sin acceder al contenido", "Transcurren diez días naturales desde la puesta a disposición sin que el interesado acceda a su contenido"], 3, "El artículo 43 LPAC establece esta consecuencia, salvo que de oficio o a instancia del destinatario se compruebe la imposibilidad técnica de acceso."],
[26, "La comunicación no verbal en la atención presencial incluye, entre otros elementos:", ["Únicamente el contenido de los formularios entregados", "La expresión facial, la postura corporal y el tono de voz", "El sello del registro de entrada", "La firma electrónica del funcionario"], 1, "La comunicación no verbal complementa y a veces condiciona más que el propio contenido verbal la calidad percibida de la atención."],
[27, "La Ley 11/2007, de 26 de octubre, de Bibliotecas de Euskadi, tiene por objeto:", ["Regular exclusivamente las bibliotecas universitarias", "Aprobar el régimen de propiedad intelectual", "Regular el régimen de archivos históricos", "Regular el sistema bibliotecario de la Comunidad Autónoma del País Vasco"], 3, "Es la norma marco que ordena el sistema bibliotecario vasco, incluyendo la Red de Lectura Pública de Euskadi."],
[27, "Conforme a la Ley 11/2007, el sistema bibliotecario de Euskadi se estructura, entre otros elementos, en torno a:", ["Un único organismo centralizado sin coordinación territorial", "La Red de Lectura Pública de Euskadi y el Consejo Vasco de Bibliotecas", "La ausencia de cualquier órgano consultivo", "Bibliotecas exclusivamente privadas"], 1, "La ley prevé tanto una red de bibliotecas de acceso público como órganos de coordinación y participación."],
[27, "Entre los fines del sistema bibliotecario de Euskadi, conforme a su ley reguladora, se encuentra:", ["Restringir el acceso a los fondos a personal investigador", "Garantizar el acceso de toda la ciudadanía a la información, la formación y el ocio cultural", "Suprimir el préstamo domiciliario", "Sustituir a los archivos administrativos"], 1, "El acceso universal a la información y la cultura es uno de los fines esenciales de cualquier ley de bibliotecas."],
[28, "La Ley 40/2015, de 1 de octubre, regula:", ["El Procedimiento Administrativo Común", "La Prevención de Riesgos Laborales", "El Estatuto Básico del Empleado Público", "El Régimen Jurídico del Sector Público"], 3, "La Ley 40/2015 (LRJSP) regula la organización y funcionamiento del sector público, en paralelo a la Ley 39/2015 (procedimiento)."],
[28, "Conforme a la Ley 40/2015, los principios generales de actuación de las Administraciones Públicas incluyen:", ["Subordinación exclusiva al poder legislativo", "Eficacia, jerarquía, descentralización, desconcentración y coordinación", "Confidencialidad total frente a la ciudadanía", "Discrecionalidad absoluta sin control judicial"], 1, "Estos principios, recogidos también en el art. 103 CE, se desarrollan en el artículo 3 de la Ley 40/2015."],
[29, "Los órganos administrativos, conforme a la Ley 40/2015, se crean mediante:", ["La norma que determine su forma de integración y dependencia, dotación de créditos y atribución de competencias", "La costumbre administrativa exclusivamente", "Decisión unilateral de cualquier empleado público", "Un simple acuerdo verbal entre funcionarios"], 0, "El artículo 5 de la Ley 40/2015 exige varios requisitos formales para la válida creación de un órgano administrativo."],
[30, "Conforme a la Ley 39/2015, los actos administrativos se presumen:", ["Siempre nulos hasta que se demuestre lo contrario", "Válidos y producen efectos desde la fecha en que se dicten, salvo que en ellos se disponga otra cosa", "Ineficaces hasta su publicación en el BOE en todo caso", "Recurribles únicamente en vía penal"], 1, "El artículo 39 LPAC establece la presunción de validez de los actos administrativos y su eficacia inmediata salvo excepción."],
[31, "Conforme a la Ley 39/2015, tienen la consideración de interesados en el procedimiento administrativo, entre otros:", ["Quienes lo promuevan como titulares de derechos o intereses legítimos, individuales o colectivos", "Solo el personal funcionario que lo tramita", "Únicamente quienes hayan iniciado formalmente el expediente", "Exclusivamente el Ministerio Fiscal"], 0, "El artículo 4 LPAC define ampliamente quiénes tienen la condición de interesados, incluyendo a los titulares de intereses legítimos aunque no hayan iniciado el procedimiento."],
[32, "Conforme a la Ley 39/2015, la fase de instrucción del procedimiento administrativo tiene como finalidad:", ["Sustituir a la fase de iniciación", "Ser la última fase antes de la ejecución forzosa", "Determinar, conocer y comprobar los datos en virtud de los cuales debe pronunciarse la resolución", "Eliminar el trámite de audiencia al interesado"], 2, "La instrucción incluye actos como la prueba, los informes y el trámite de audiencia, previos a la propuesta de resolución."],
[33, "Conforme a la Ley 39/2015, el plazo para interponer el recurso de alzada es, con carácter general, de:", ["Diez días hábiles", "Seis meses desde la notificación", "Un año en todo caso", "Un mes si el acto fuera expreso"], 3, "El artículo 122 LPAC fija este plazo general de un mes desde la notificación del acto expreso (tres meses si el acto no fuese expreso)."],
[34, "Conforme a la Ley 40/2015, la responsabilidad patrimonial de las Administraciones Públicas se rige por el principio de:", ["Responsabilidad objetiva o por el resultado, con independencia de la culpa del agente", "Responsabilidad únicamente penal de los funcionarios", "Ausencia total de responsabilidad frente a terceros", "Responsabilidad exclusivamente subjetiva basada en dolo"], 0, "El sistema español de responsabilidad patrimonial de la Administración es de carácter objetivo, exigiendo un daño efectivo derivado del funcionamiento del servicio público."],
[4, "El Parlamento Vasco ejerce el control del Gobierno mediante, entre otros instrumentos:", ["La aprobación de sentencias", "La gestión directa de los servicios públicos", "Preguntas, interpelaciones y mociones", "Únicamente el nombramiento de jueces"], 2, "El Parlamento controla la acción del Gobierno mediante preguntas, interpelaciones, mociones y otros instrumentos parlamentarios."],
[4, "La sede del Parlamento Vasco se encuentra en:", ["Vitoria-Gasteiz", "Bilbao", "Donostia-San Sebastián", "Bergara"], 0, "El Parlamento Vasco tiene su sede en Vitoria-Gasteiz."],

[20, "La firma electrónica que se aplica automáticamente en las actuaciones administrativas automatizadas se denomina habitualmente:", ["Certificado de persona física", "Firma biométrica", "Firma manuscrita digitalizada", "Sello electrónico"], 3, "El sello electrónico es la firma que se aplica automáticamente en las actuaciones administrativas automatizadas."],

[21, "La consulta del expediente administrativo por un interesado puede realizarse:", ["Solo mediante autorización judicial previa", "Nunca, si el expediente contiene datos personales de terceros", "Únicamente antes del inicio del procedimiento", "Durante la tramitación del procedimiento y tras su finalización, dentro de los límites legales"], 3, "La consulta del expediente puede realizarse durante la tramitación del procedimiento y también tras su finalización, dentro de los límites legales."],

[22, "La firma electrónica avanzada, a diferencia de la firma electrónica simple, se caracteriza por:", ["Requerir siempre presencia física notarial", "Permitir identificar al firmante y detectar cualquier cambio posterior en los datos firmados", "No tener ningún valor jurídico", "Ser válida solo durante 24 horas"], 1, "La firma avanzada cumple con requisitos adicionales de vinculación única al firmante y de detección de alteraciones posteriores."],

[26, "En la atención telefónica a la ciudadanía, una buena práctica es:", ["Identificarse con el nombre del organismo y, si procede, el propio, al inicio de la llamada", "Interrumpir constantemente a la persona que llama", "Colgar sin explicación si la consulta es compleja", "Evitar dar cualquier información por teléfono"], 0, "Una identificación clara y una respuesta ágil son elementos básicos de un protocolo de atención telefónica de calidad."],

[12, "El ángulo de visión recomendado entre los ojos y la parte superior de la pantalla debe ser:", ["Irrelevante para la ergonomía del puesto", "Perpendicular al suelo", "Siempre ascendente, mirando hacia arriba", "Ligeramente descendente, evitando mirar hacia arriba"], 3, "Se recomienda un ángulo de visión ligeramente descendente hacia la pantalla, evitando mirar hacia arriba de forma prolongada."],

[26, "El silencio en la comunicación oral con la ciudadanía puede utilizarse, entre otros fines, para:", ["Evitar la resolución de la consulta", "Dar tiempo a la persona usuaria a expresar su consulta o duda", "Generar incomodidad de forma deliberada", "Sustituir cualquier explicación necesaria"], 1, "El silencio en la comunicación oral puede utilizarse, entre otros fines, para dar tiempo a la persona usuaria a expresar su consulta."],
[26, "Ante una consulta que excede las competencias del puesto de atención, la actuación adecuada es:", ["Inventar una respuesta sin base real", "Negarse a atender la consulta sin explicación", "Derivar a la persona usuaria al servicio competente, informando del motivo", "Ignorar la pregunta planteada"], 2, "Ante una consulta que excede las propias competencias, lo adecuado es derivar a la persona al servicio competente, informando del motivo."],

[28, "La Constitución, como fuente del ordenamiento jurídico administrativo, tiene rango:", ["Inferior a las leyes orgánicas", "Supremo, siendo la norma de mayor jerarquía del ordenamiento español", "Equivalente a un simple reglamento", "Solo aplicable en materia penal"], 1, "La Constitución tiene rango supremo, siendo la norma de mayor jerarquía del ordenamiento jurídico español."],

[31, "La comparecencia de interesados, cuando la Administración lo requiere, debe estar prevista en:", ["La costumbre exclusivamente", "Un acuerdo verbal entre las partes", "Cualquier instrucción interna sin necesidad de norma", "Una norma con rango de ley que determine el objeto y efectos de la comparecencia"], 3, "La comparecencia de interesados requerida por la Administración debe estar prevista en una norma con rango de ley que determine su objeto y efectos."],
[32, "El trámite de audiencia al interesado, conforme a la Ley 39/2015, se practica:", ["Solo si el interesado lo solicita expresamente por escrito", "Después de dictada la resolución definitiva", "Nunca en los procedimientos sancionadores", "Antes de redactar la propuesta de resolución, con vista del expediente"], 3, "El trámite de audiencia se practica antes de redactar la propuesta de resolución, con vista del expediente."],
[32, "Cuando no figuren en el procedimiento ni sean tenidos en cuenta otros hechos ni otras alegaciones que las aducidas por el interesado, puede:", ["Prescindirse siempre de la resolución expresa", "Prescindirse del trámite de audiencia", "Iniciarse un nuevo procedimiento paralelo", "Suprimirse el plazo máximo de resolución"], 1, "Puede prescindirse del trámite de audiencia cuando no figuren en el procedimiento ni se tengan en cuenta otros hechos ni alegaciones distintas de las del interesado."],
[32, "La prueba en el procedimiento administrativo se practica cuando:", ["La Administración no tenga por ciertos los hechos alegados o la naturaleza del procedimiento lo exija", "Nunca es admisible en vía administrativa", "Solo si lo autoriza un juez", "Se ha dictado ya la resolución final"], 0, "La prueba se practica cuando la Administración no tenga por ciertos los hechos alegados o la naturaleza del procedimiento lo exija."],
[33, "El error de derecho, a diferencia del error material, no puede rectificarse mediante el procedimiento simplificado de rectificación porque:", ["Solo puede corregirse mediante sanción penal", "Es idéntico al error material a todos los efectos", "Implica una nueva valoración jurídica que exige, en su caso, la revisión del acto por los cauces ordinarios", "Nunca puede corregirse un acto administrativo"], 2, "El error de derecho implica una nueva valoración jurídica que exige, en su caso, la revisión del acto por los cauces ordinarios de recurso."],

[33, "La resolución de un recurso administrativo puede, entre otros efectos, además de estimarlo o desestimarlo:", ["Sustituir la vía judicial de forma definitiva", "Declarar su inadmisión cuando concurra alguna causa legalmente prevista", "Solo confirmar el acto recurrido, sin más opciones", "Anular automáticamente todo el procedimiento anterior"], 1, "La resolución de un recurso puede, además de estimarlo o desestimarlo, declarar su inadmisión cuando concurra causa legalmente prevista."],
[34, "La responsabilidad patrimonial por actos legislativos de naturaleza no expropiatoria procede, entre otros supuestos, cuando:", ["Así se establezca en los propios actos legislativos y en los términos que en ellos se especifiquen", "Nunca puede generarse responsabilidad por una ley", "Se trata siempre de responsabilidad penal del legislador", "Corresponde exclusivamente a la vía judicial ordinaria sin más requisito"], 0, "La responsabilidad por actos legislativos no expropiatorios procede cuando así se establezca en los propios actos legislativos, en los términos que especifiquen."],
[34, "El daño moral, en el ámbito de la responsabilidad patrimonial de la Administración, es:", ["Nunca indemnizable en derecho administrativo", "Idéntico al daño material en su forma de prueba", "Solo indemnizable en el ámbito penal", "Indemnizable cuando se acredite su existencia, aunque sea de difícil cuantificación económica"], 3, "El daño moral es indemnizable cuando se acredite su existencia, aunque resulte de difícil cuantificación económica."],
[34, "La responsabilidad patrimonial de las Administraciones Públicas en régimen de derecho privado se exige, conforme a la Ley 40/2015, de forma:", ["Similar a la de derecho público, siguiendo el mismo procedimiento y criterios de imputación", "Exclusivamente ante la jurisdicción civil ordinaria sin ninguna particularidad", "Nunca es exigible en este régimen", "Solo mediante arbitraje internacional"], 0, "La responsabilidad patrimonial en régimen de derecho privado se exige, conforme a la Ley 40/2015, de forma similar a la de derecho público."],
[24, "La calidad en la prestación de servicios públicos exige, entre otros elementos:", ["Prioridad exclusiva a la rapidez sobre la corrección del trámite", "Fiabilidad, capacidad de respuesta y empatía hacia la persona usuaria", "Uniformidad absoluta sin adaptación a necesidades individuales", "Ausencia de cualquier mecanismo de evaluación"], 1, "Son dimensiones clásicas de la calidad de servicio aplicables también a la atención administrativa."],
[24, "Un plan de mejora de la atención ciudadana se basa habitualmente en:", ["La supresión de las cartas de servicios", "El análisis de quejas, sugerencias y resultados de encuestas de satisfacción", "La reducción del personal de atención sin más criterio", "La eliminación de los canales de queja"], 1, "Las quejas y encuestas son fuentes de información clave para detectar puntos de mejora en la atención."],
[24, "La empatía en la atención a la ciudadanía consiste en:", ["Evitar cualquier contacto emocional con la persona atendida", "Ponerse en el lugar de la persona usuaria para comprender su situación y necesidades", "Aceptar sin cuestionamiento cualquier petición, sea o no procedente", "Priorizar siempre los intereses del propio organismo"], 1, "La empatía no implica ceder ante peticiones improcedentes, sino comprender la perspectiva de la persona atendida para dar una respuesta adecuada."],
[24, "Ante una persona usuaria visiblemente alterada o agresiva, la actuación recomendada del personal de atención es:", ["Mantener la calma, escuchar y, si es preciso, solicitar apoyo sin entrar en confrontación", "Responder con el mismo tono para 'poner límites' de forma inmediata", "Ignorar completamente a la persona hasta que se calme por sí sola", "Abandonar el puesto de atención sin informar a nadie"], 0, "La desescalada mediante la calma y la escucha activa es la técnica recomendada en protocolos de atención al público."],
[24, "La accesibilidad cognitiva en la atención a la ciudadanía implica, entre otros aspectos:", ["Emplear siempre terminología jurídica precisa sin adaptarla", "Limitar la información a un máximo de una frase", "Excluir cualquier apoyo visual en la comunicación", "Utilizar un lenguaje claro, sencillo y estructurado en la información que se ofrece"], 3, "El lenguaje claro es una herramienta clave de accesibilidad cognitiva, especialmente relevante en la comunicación administrativa."],
[24, "Los indicadores de calidad de una Carta de Servicios permiten:", ["Eliminar la necesidad de atención presencial", "Sustituir la evaluación del desempeño del personal", "Medir objetivamente el grado de cumplimiento de los compromisos asumidos", "Fijar el presupuesto anual del organismo"], 2, "Los indicadores cuantifican compromisos concretos (plazos, tasas de resolución, etc.) para verificar su cumplimiento."],
[24, "La escucha activa, como técnica de atención a la ciudadanía, implica:", ["Limitarse a asentir sin verificar la comprensión del mensaje", "Prestar atención completa al interlocutor, verificando la comprensión de lo escuchado", "Preparar la respuesta propia mientras habla la otra persona sin prestarle atención", "Interrumpir constantemente para agilizar la atención"], 1, "La escucha activa exige concentración plena y comprobación de que se ha entendido correctamente el mensaje, no solo oírlo."],
[26, "En la atención telefónica, el protocolo habitual de descolgado recomienda:", ["Contestar sin identificación alguna del servicio", "Dejar sonar el teléfono el mayor tiempo posible antes de contestar", "Identificar el organismo, saludar y ofrecerse a ayudar en un tiempo breve", "Transferir la llamada sin informar al usuario del motivo"], 2, "Un protocolo de atención telefónica de calidad exige una identificación clara y una respuesta ágil."],
[26, "El desvío de llamadas hacia otro servicio debe realizarse, como buena práctica:", ["Únicamente si el usuario lo exige expresamente por escrito", "Sin informar en ningún caso al usuario", "Informando previamente a la persona usuaria del motivo y destino del desvío", "Transfiriendo sin verificar que el destino puede atender la consulta"], 2, "La transparencia sobre el motivo y destino del desvío mejora la experiencia y evita reiteraciones innecesarias."],
[26, "El silencio en una conversación telefónica de atención al público puede generar, si se prolonga sin explicación:", ["Sensación de desatención o desconexión en la persona que llama", "Mayor confianza automática del usuario", "Mejora automática de la satisfacción del usuario", "Ninguna consecuencia relevante en la percepción del servicio"], 0, "Los silencios prolongados sin explicación suelen generar incertidumbre o incomodidad en la persona que llama; conviene explicarlos brevemente."],
